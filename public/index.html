성조를 식별한다."],["9생베01-02","9","생활 베트남어","듣기","낱말이나 간단하고 쉬운 구, 문장을 듣고 의미를 파악한다."],["9생베01-03","9","생활 베트남어","듣기","일상생활과 관련된 간단하고 쉬운 글이나 대화를 듣고 주요 정보를 파악한다."],["9생베01-04","9","생활 베트남어","듣기","간단하고 쉬운 듣기 자료나 상대방의 말을 경청하고 적절하게 반응한다."],["9생베02-01","9","생활 베트남어","말하기","낱말이나 간단하고 쉬운 구, 문장을 발음과 성조에 유의하여 말한다."],["9생베02-02","9","생활 베트남어","말하기","낱말이나 간단하고 쉬운 의사소통 표현을 상황에 맞게 말한다."],["9생베02-03","9","생활 베트남어","말하기","상대방을 존중하는 태도로 말하기 활동에 적극적으로 참여한다."],["9생베03-01","9","생활 베트남어","읽기","낱말이나 간단하고 쉬운 구, 문장을 발음과 성조에 유의하여 소리 내어 읽는다."],["9생베03-02","9","생활 베트남어","읽기","낱말이나 간단하고 쉬운 구, 문장을 읽고 의미를 파악한다."],["9생베03-03","9","생활 베트남어","읽기","간단하고 쉬운 글이나 대화문을 읽고 주요 정보나 주제를 파악한다."],["9생베04-01","9","생활 베트남어","쓰기","낱말이나 간단하고 쉬운 구, 문장을 철자와 성조에 유의하여 쓴다."],["9생베04-02","9","생활 베트남어","쓰기","간단하고 쉬운 글이나 대화문을 상황과 어법에 맞게 쓴다."],["9생베04-03","9","생활 베트남어","쓰기","글쓰기에 흥미를 갖고 쓰기 활동에 적극적으로 참여한다."],["9생베05-01","9","생활 베트남어","문화","베트남의 개관 및 생활 문화, 언어문화, 전통문화, 예술 문화 등에 대해 이해한다."],["9생베05-02","9","생활 베트남어","문화","베트남 문화 내용을 베트남어 의사소통 상황에 활용한다."],["9생베05-03","9","생활 베트남어","문화","베트남 문화에 대해 조사하고 정리한다."],["9생베05-04","9","생활 베트남어","문화","베트남 문화에 대해 조사⋅정리한 내용을 설명한다."],["9생베05-05","9","생활 베트남어","문화","상호문화적 관점에서 한국 문화와 베트남 문화의 공통점과 차이점을 이해한다."],["9보01-01","9","보건","건강증진과 질병예방","건강의 개념과 영향요인, 건강관리 모델을 탐구하여 건강을 관리하는 태도를 갖는다."],["9보01-02","9","보건","건강증진과 질병예방","몸과 마음의 신호와 건강지표를 통해 건강상태를 평가하여 건강관리에 적용한다."],["9보01-03","9","보건","건강증진과 질병예방","건강한 수면, 식습관, 신체활동에 대해 알아보고 건강생활습관을 계획하고 실천한다."],["9보01-04","9","보건","건강증진과 질병예방","건강문제와 건강생활기술을 탐색하여 질병을 예방할 수 있도록 건강을 관리한다."],["9보01-05","9","보건","건강증진과 질병예방","건강에 대한 사회적 지지의 중요성을 인식하고 개인과 공동체의 건강옹호활동을 협력적으로 탐색한다."],["9보02-01","9","보건","정서와 정신건강","약물 오⋅남용과 흡연, 음주의 유혹과 압력에 대해 안전하게 선택하고 대처⋅옹호한다."],["9보02-02","9","보건","정서와 정신건강","행위 중독이 건강에 미치는 영향과 위험요인 및 대처방안을 탐색하여 예방하고 관리하려는 태도를 갖는다."],["9보02-03","9","보건","정서와 정신건강","자아 존중감에 대해 이해하고 생활 속에서 자아 존중감을 높이는 상황과 저하시키는 상황을 탐색하여 대처하고 지지하여 건강한 자아상을 추구한다."],["9보02-04","9","보건","정서와 정신건강","감정과 스트레스의 적절한 인식과 표현, 지지와 공감 및 다양성 존중을 통해 관계 속에서 행복함과 건강한 관계 맺기를 보여준다."],["9보02-05","9","보건","정서와 정신건강","삶과 죽음, 상실의 의미에 대한 성찰을 바탕으로, 삶의 소중함을 깨닫고 죽음⋅상실에 건강하게 대처하는 자세를 지지한다."],["9보03-01","9","보건","성과 건강","성의 개념과 성역할 및 영향요인에 대해 성인지적 관점에서 탐색하여 안전하고 행복한 성문화와 성의식의 필요성을 이해한다."],["9보03-02","9","보건","성과 건강","청소년기 성적 발달과 관계, 신체상에 대해 알아보고 사회적 조건을 이해하며 건강하게 관리한다."],["9보03-03","9","보건","성과 건강","성적자기결정권을 균형 있게 탐색하여 안전하고 행복한 대처전략을 세우고 이성 교제 시 경계를 존중하고 배려하는 자세를 갖는다."],["9보03-04","9","보건","성과 건강","성폭력⋅성매개감염병 등 성 건강 위험요소를 미디어 문해력 및 성문화와 관련지어 탐색하고 건강하게 관리⋅옹호한다."],["9보03-05","9","보건","성과 건강","임신, 피임에 대한 이해를 바탕으로 십대의 임신과 미혼 부모 문제가 개인과 사회에 미치는 영향을 분석하고 건강에 유익한 선택과 자원을 지지한다."],["9보03-06","9","보건","성과 건강","청소년의 성 건강과 관련하여 사회적 쟁점이 있는 이슈들에 대해 다양한 입장의 근거와 맥락, 고정 관념, 차별, 불평등한 상황을 파악하여 균형 있고 평등한 성문화를 조성하려는 자세를 갖는다."],["9보04-01","9","보건","건강안전과 응급처치","건강안전의 의미와 위험요인을 탐구하여 질병과 사고를 예방하고 관리하며 건강안전 지향적 환경 개선에 적극적인 태도를 갖는다."],["9보04-02","9","보건","건강안전과 응급처치","급⋅만성 질병의 위험요인과 건강에 미치는 영향을 탐색하여, 질병과 함께 건강하게 살아가기 위한 방안을 세우고 실천한다."],["9보04-03","9","보건","건강안전과 응급처치","감염병과 면역의 원리를 이해하고 개인과 공동체가 지켜야 할 건강수칙을 탐색하여 근거와 함께 제안하고 실천한다."],["9보04-04","9","보건","건강안전과 응급처치","상황에 따른 응급처치의 원리와 방법을 이해하고, 다양한 위기 및 응급상황에서 적절한 응급처치와 협력적 대응 방안을 탐색하여 적용한다."],["9보04-05","9","보건","건강안전과 응급처치","응급의료체계의 활용 방안을 탐색하고 심폐소생술과 자동심장충격기의 원리와 사용법을 익혀 협력적으로 바르게 적용한다."],["9보05-01","9","보건","건강자원과 건강문화","건강권 발전을 위한 노력과 건강자원을 탐색하여 공동체의 건강권 향상을 위한 활동에 관심을 가지고 참여한다."],["9보05-02","9","보건","건강자원과 건강문화","디지털⋅인공지능 시대에 따른 보건의료서비스와 건강정보를 포함한 건강자원의 변화를 알아보고 건강에 유익하게 활용하며 개선방안을 탐색한다."],["9보05-03","9","보건","건강자원과 건강문화","기후변화와 건강의 관계를 탐색하고, 지속가능한 사회를 위한 개인과 공동체의 건강옹호활동을 탐구하고 실천한다."],["9보05-04","9","보건","건강자원과 건강문화","건강 신념과 규범⋅관행 및 미디어 등이 건강에 미치는 영향을 탐색하고 건강하게 개선하려는 태도를 발전시켜 건강관리와 건강문제 해결에 적용한다."],["9보05-05","9","보건","건강자원과 건강문화","다양성 존중과 사회적 소수자 배려를 포함하여 건강지향적 문화와 환경을 지지⋅옹호한다."],["9진로01-01","9","진로와 직업","진로와 나의 이해","진로와 직업의 의미를 이해하고 다양한 직업인의 진로 특성과 삶의 모습을 탐색한다."],["9진로01-02","9","진로와 직업","진로와 나의 이해","다양한 방법으로 자신의 진로 특성을 파악하고 긍정적 자아 개념을 갖는다."],["9진로01-03","9","진로와 직업","진로와 나의 이해","함께 일하고 싶은 직업인의 특성을 알아보고 바람직한 직업인의 자세를 갖는다."],["9진로01-04","9","진로와 직업","진로와 나의 이해","일과 여가의 의미와 상호 관계를 이해하고 조화롭고 행복한 삶을 생각한다."],["9진로02-01","9","진로와 직업","직업 세계와 진로 탐색","사회 변화에 따른 직업 세계의 변화를 이해한다."],["9진로02-02","9","진로와 직업","직업 세계와 진로 탐색","진로 경로의 다양성과 가변성을 이해하고, 유연한 진로 탐색 태도를 함양한다."],["9진로02-03","9","진로와 직업","직업 세계와 진로 탐색","진로 정보를 탐색하는 다양한 방법을 알아보고 관심 분야의 진로 정보를 탐색하고 활용한다."],["9진로02-04","9","진로와 직업","직업 세계와 진로 탐색","다양한 경험과 진로 활동을 자신의 진로와 연계하며 주도적인 진로 탐색 태도를 함양한다."],["9진로02-05","9","진로와 직업","직업 세계와 진로 탐색","고등학교의 유형, 특성, 교육과정에 대한 정보를 통해 교육 기회를 탐색한다."],["9진로02-06","9","진로와 직업","직업 세계와 진로 탐색","창업의 특성과 창업가 정신을 이해하고 그 중요성을 인식한다."],["9진로03-01","9","진로와 직업","진로 설계와 실천","진로의사결정의 방법과 고려 사항을 이해하고 진로를 잠정적으로 결정한다."],["9진로03-02","9","진로와 직업","진로 설계와 실천","관심 진로 분야의 다양한 진로 경로를 탐색하고 자신의 진로 경로를 설정한다."],["9진로03-03","9","진로와 직업","진로 설계와 실천","진로 목표 성취를 위해 학습의 필요성을 이해하고, 학습 계획을 자기 주도적으로 수립하여 실천한다."],["9진로03-04","9","진로와 직업","진로 설계와 실천","졸업 이후의 진로 계획을 수립하고 자기 관리 및 진로 준비 방법을 알아보고 실천한다."],["10공국1-01-01","10","공통국어","듣기⋅말하기","대화의 원리를 고려하여 대화하고 자신의 듣기⋅말하기 과정과 공동체의 담화 관습을 성찰한다."],["10공국1-01-02","10","공통국어","듣기⋅말하기","논제의 필수 쟁점별로 논증을 구성하고 논증이 타당한지 평가하며 토론한다."],["10공국1-02-01","10","공통국어","읽기","다양한 글이나 자료를 읽으며 논증의 타당성을 평가하고 자신의 관점을 바탕으로 논증을 재구성한다."],["10공국1-02-02","10","공통국어","읽기","자신의 진로나 관심 분야와 관련한 다양한 글이나 자료를 찾아 주제 통합적으로 읽고 읽은 결과를 공유한다."],["10공국1-03-01","10","공통국어","쓰기","내용 전개의 일반적 원리를 고려하여 사회적 쟁점에 대한 자신의 견해를 정교하게 표현하는 글을 쓴다."],["10공국1-03-02","10","공통국어","쓰기","다양한 언어 공동체의 특성을 고려하며 필자의 개성이 드러나는 글을 쓴다."],["10공국1-04-01","10","공통국어","문법","언어 공동체가 다변화함에 따라 다양해진 언어 실천 양상을 분석하고 언어 주체로서 책임감을 가지며 국어생활을 한다."],["10공국1-04-02","10","공통국어","문법","음운 변동을 탐구하여 발음과 표기에 올바르게 적용한다."],["10공국1-04-03","10","공통국어","문법","다양한 분야의 글과 담화에 나타난 문법 요소 및 어휘의 표현 효과를 평가하고 적절한 표현을 생성한다."],["10공국1-05-01","10","공통국어","문학","문학 소통의 특성을 고려하며 문학 소통에 참여한다."],["10공국1-05-02","10","공통국어","문학","갈래에 따른 형상화 방법의 특성을 고려하며 작품을 수용한다."],["10공국1-05-03","10","공통국어","문학","작품 구성 요소의 유기적 관계와 맥락에 유의하여 작품을 수용하고 생산한다."],["10공국1-06-01","10","공통국어","매체","사회적 의제를 다룬 매체 자료를 비판적으로 분석한다."],["10공국1-06-02","10","공통국어","매체","소통 맥락과 매체 특성을 고려하여 다양한 목적의 매체 자료를 제작한다."],["10공국2-01-01","10","공통국어","듣기⋅말하기","청중의 관심과 요구에 맞게 내용을 구성하여 발표하고 청중의 질문에 효과적으로 답변한다."],["10공국2-01-02","10","공통국어","듣기⋅말하기","쟁점과 이해관계를 고려하여 문제를 해결할 수 있는 대안을 탐색하며 협상한다."],["10공국2-01-03","10","공통국어","듣기⋅말하기","사회적 소통 과정에서 말의 영향력을 고려하여 책임감 있게 듣고 말한다."],["10공국2-02-01","10","공통국어","읽기","복합양식으로 구성된 글이나 자료에 내재된 필자의 관점이나 의도, 표현 방법을 평가하며 읽는다."],["10공국2-02-02","10","공통국어","읽기","동일한 화제의 글이나 자료라도 서로 다른 관점과 형식으로 표현됨을 이해하며 읽기 목적을 고려하여 글이나 자료를 주제 통합적으로 읽는다."],["10공국2-02-03","10","공통국어","읽기","의미 있는 사회적 독서 활동에 참여함으로써 타인과 교류하고 다양한 지식이나 정보, 삶에 대한 가치관 등을 이해하는 태도를 지닌다."],["10공국2-03-01","10","공통국어","쓰기","언어 공동체가 공유하는 작문 관습의 특성을 이해하고 쓰기 과정과 전략을 점검하며 책임감 있게 글을 쓴다."],["10공국2-03-02","10","공통국어","쓰기","논증 요소에 따른 분석을 바탕으로 효과적으로 내용을 조직하여 논증하는 글을 쓴다."],["10공국2-03-03","10","공통국어","쓰기","신뢰할 수 있는 정보를 종합하여 복합양식 자료가 포함된 공동 보고서를 쓴다."],["10공국2-04-01","10","공통국어","문법","과거 및 현재의 국어생활에 나타나는 국어의 변화를 이해하고 국어문화 발전에 참여한다."],["10공국2-04-02","10","공통국어","문법","한글 맞춤법의 원리를 적용하여 국어생활을 성찰하고 문제를 해결한다."],["10공국2-05-01","10","공통국어","문학","한국 문학사의 흐름을 고려하여 작품을 수용한다."],["10공국2-05-02","10","공통국어","문학","주체적인 관점에서 작품을 해석하고 평가하며 문학을 생활화하는 태도를 지닌다."],["10공국2-06-01","10","공통국어","매체","매체 비평 자료를 비판적으로 수용하고 자신의 관점을 담아 매체 비평 자료를 제작한다."],["10공국2-06-02","10","공통국어","매체","매체의 변화가 소통 문화에 끼치는 영향을 탐구한다."],["10한사1-01-01","10","한국사","근대 이전 한국사의 이해","고대 국가의 형성과 성장 과정을 파악한다."],["10한사1-01-02","10","한국사","근대 이전 한국사의 이해","고려의 통치 체제와 지배 세력의 변화를 이해한다."],["10한사1-01-03","10","한국사","근대 이전 한국사의 이해","조선의 성립과 정치 운영의 변화를 파악한다."],["10한사1-01-04","10","한국사","근대 이전 한국사의 이해","조선 후기에 등장한 새로운 변화 양상을 이해한다."],["10한사1-02-01","10","한국사","근대 이전 한국사의 탐구","근대 이전 국제 관계와 대외 교류의 시대적 특징을 비교한다."],["10한사1-02-02","10","한국사","근대 이전 한국사의 탐구","근대 이전의 수취 체제 변화를 농업 중심의 경제생활과 관련하여 탐구한다."],["10한사1-02-03","10","한국사","근대 이전 한국사의 탐구","근대 이전 사회 구조를 신분제를 중심으로 분석한다."],["10한사1-02-04","10","한국사","근대 이전 한국사의 탐구","근대 이전의 사상과 문화를 국제 교류와 관련하여 탐구한다."],["10한사1-02-05","10","한국사","근대 이전 한국사의 탐구","근대 이전 한국사 주제를 설정하여 탐구하고, 그 결과를 다양한 방법으로 표현한다."],["10한사1-03-01","10","한국사","근대 국가 수립의 노력","조선의 개항을 국제 질서의 변동과 연관하여 분석한다."],["10한사1-03-02","10","한국사","근대 국가 수립의 노력","여러 세력이 추진한 근대 국가 수립의 다양한 노력을 이해한다."],["10한사1-03-03","10","한국사","근대 국가 수립의 노력","개항 이후 사회⋅경제 변화를 파악하고, 서구 문물의 도입이 문화에 미친 영향을 탐구한다."],["10한사1-03-04","10","한국사","근대 국가 수립의 노력","일제의 국권 침탈 과정을 조사하고, 이에 맞선 국권 수호 운동의 흐름을 파악한다."],["10한사2-01-01","10","한국사","일제 식민 통치와 민족운동","일제의 식민 통치 정책을 제국주의 질서의 변동과 연관하여 이해한다."],["10한사2-01-02","10","한국사","일제 식민 통치와 민족운동","일제의 식민 통치가 초래한 경제 구조의 변화와 그것이 경제생활에 미친 영향을 분석한다."],["10한사2-01-03","10","한국사","일제 식민 통치와 민족운동","국내외에서 전개된 민족 운동의 흐름을 이해한다."],["10한사2-01-04","10","한국사","일제 식민 통치와 민족운동","일제의 식민 통치로 인한 사회 및 문화의 변화와 대중운동의 양상을 파악한다."],["10한사2-01-05","10","한국사","일제 식민 통치와 민족운동","일제의 침략 전쟁에 맞서 전개된 독립 국가 건설 운동의 양상을 분석한다."],["10한사2-02-01","10","한국사","대한민국의 발전","냉전 체제가 한반도 정세에 미친 영향을 파악하고, 자유민주주의에 기초한 대한민국 정부 수립 과정을 탐색한다."],["10한사2-02-02","10","한국사","대한민국의 발전","6⋅25 전쟁과 분단의 고착화 과정을 국내외의 정세 변화와 연관하여 이해한다."],["10한사2-02-03","10","한국사","대한민국의 발전","4⋅19 혁명에서 6월 민주 항쟁에 이르는 민주화 과정을 탐구한다."],["10한사2-02-04","10","한국사","대한민국의 발전","산업화의 성과를 파악하고, 그것이 사회 및 환경에 미친 영향을 인식한다."],["10한사2-02-05","10","한국사","대한민국의 발전","사회⋅경제의 변화에 따른 문화 변동과 일상생활의 변화 사례를 조사한다."],["10한사2-03-01","10","한국사","오늘날의 대한민국","6월 민주 항쟁 이후 각 분야에서 전개된 민주화의 과정을 탐구한다."],["10한사2-03-02","10","한국사","오늘날의 대한민국","외환 위기의 극복 과정을 이해하고, 사회와 문화의 변동을 파악한다."],["10한사2-03-03","10","한국사","오늘날의 대한민국","한반도 분단과 동아시아의 갈등을 극복하고 평화를 실현하기 위한 방안을 모색한다."],["10통사1-01-01","10","통합사회","통합적 관점","인간, 사회, 환경을 바라보는 시간적, 공간적, 사회적, 윤리적 관점의 의미와 특징을 사례를 통해 파악한다."],["10통사1-01-02","10","통합사회","통합적 관점","인간, 사회, 환경의 탐구에 통합적 관점이 요청되는 이유를 도출하고 이를 탐구에 적용한다."],["10통사1-02-01","10","통합사회","인간, 사회, 환경과 행복","시대와 지역에 따라 다르게 나타나는 행복의 기준을 사례를 통해 비교하여 평가하고, 삶의 목적으로서 행복의 의미를 성찰한다."],["10통사1-02-02","10","통합사회","인간, 사회, 환경과 행복","행복한 삶을 실현하기 위한 조건으로 질 높은 정주 환경의 조성, 경제적 안정, 민주주의 발전 및 도덕적 실천의 필요성에 관해 탐구한다."],["10통사1-03-01","10","통합사회","자연환경과 인간","자연환경이 인간의 생활에 미치는 영향에 관한 과거와 현재의 사례를 조사하여 분석하고, 안전하고 쾌적한 환경에서 살아가는 것이 시민의 권리임을 주장한다."],["10통사1-03-02","10","통합사회","자연환경과 인간","자연에 대한 인간의 다양한 관점을 사례를 통해 비교하고, 인간과 자연의 바람직한 관계를 제안한다."],["10통사1-03-03","10","통합사회","자연환경과 인간","환경 문제 해결을 위한 정부, 시민사회, 기업 등의 다양한 노력을 조사하고, 생태시민으로서 실천 방안을 모색한다."],["10통사1-04-01","10","통합사회","문화와 다양성","자연환경과 인문환경의 영향을 받아 형성된 다양한 문화권의 특징과 삶의 방식을 탐구한다."],["10통사1-04-02","10","통합사회","문화와 다양성","문화 변동의 다양한 양상을 이해하고, 현대 사회에서 전통문화가 지니는 의의를 탐색한다."],["10통사1-04-03","10","통합사회","문화와 다양성","문화적 차이에 대한 상대주의적 태도의 필요성을 이해하고, 보편 윤리의 차원에서 자문화와 타문화를 평가한다."],["10통사1-04-04","10","통합사회","문화와 다양성","다문화 사회의 현황을 조사하고, 문화적 다양성을 존중하는 태도를 바탕으로 갈등 해결 방안을 모색한다."],["10통사1-05-01","10","통합사회","생활공간과 사회","산업화, 도시화로 인해 나타난 생활공간과 생활양식의 변화 양상을 조사하고, 이에 따른 문제점의 해결 방안을 제안한다."],["10통사1-05-02","10","통합사회","생활공간과 사회","교통⋅통신 및 과학기술의 발달과 함께 나타난 생활공간과 생활양식의 변화 양상을 조사하고, 이에 따른 문제점의 해결 방안을 제안한다."],["10통사1-05-03","10","통합사회","생활공간과 사회","자신이 거주하는 지역을 사례로 공간 변화가 초래한 양상 및 문제점을 탐구하고, 공동체의 구성원으로서 지역사회의 변화를 위한 방안을 모색하고 이를 실천한다."],["10통사2-01-01","10","통합사회","인권보장과 헌법","근대 시민 혁명 등을 통해 확립되어 온 인권의 의미와 변화 양상을 이해하고, 현대사회에서 주거, 안전, 환경, 문화 등 다양한 영역으로 인권이 확장되고 있는 사례를 조사한다."],["10통사2-01-02","10","통합사회","인권보장과 헌법","인간 존엄성 실현과 인권 보장을 위한 헌법의 역할을 파악하고, 시민의 권익을 보호하기 위한 다양한 시민 참여의 방안을 탐구하고 이를 실천한다."],["10통사2-01-03","10","통합사회","인권보장과 헌법","사회적 소수자 차별, 청소년의 노동권 등 국내 인권 문제와 인권지수를 통해 확인할 수 있는 세계 인권 문제의 양상을 조사하고, 이에 대한 해결 방안을 모색한다."],["10통사2-02-01","10","통합사회","사회정의와 불평등","정의의 의미와 정의가 요구되는 이유를 파악하고, 다양한 사례를 통해 정의의 실질적 기준을 탐구한다."],["10통사2-02-02","10","통합사회","사회정의와 불평등","개인과 공동체의 관계를 기준으로 다양한 정의관을 비교하고, 이를 구체적인 사례에 적용하여 설명한다."],["10통사2-02-03","10","통합사회","사회정의와 불평등","사회 및 공간 불평등 현상의 사례를 조사하고, 정의로운 사회를 만들기 위한 다양한 제도와 시민으로서의 실천 방안을 제안한다."],["10통사2-03-01","10","통합사회","시장경제와 지속가능발전","자본주의의 역사적 전개 과정과 그 특징을 조사하고, 시장과 정부의 관계를 중심으로 다양한 삶의 방식을 비교 평가한다."],["10통사2-03-02","10","통합사회","시장경제와 지속가능발전","합리적 선택의 의미와 그 한계를 파악하고, 지속가능발전을 위해 요청되는 정부, 기업가, 노동자, 소비자의 바람직한 역할과 책임에 관해 탐구한다."],["10통사2-03-03","10","통합사회","시장경제와 지속가능발전","금융 자산의 특징과 자산 관리의 원칙을 토대로 금융 생활을 설계하고, 경제적, 사회적 환경의 변화가 금융과 관련한 의사 결정에 미치는 영향을 탐구한다."],["10통사2-03-04","10","통합사회","시장경제와 지속가능발전","자원, 노동, 자본의 지역 분포에 따른 국제 분업과 무역의 필요성을 이해하고, 지속가능발전에 기여하는 국제무역의 방안을 탐색한다."],["10통사2-04-01","10","통합사회","세계화와 평화","세계화의 다양한 양상을 살펴보고, 세계화 시대의 문제점과 그에 대한 해결 방안을 제안한다."],["10통사2-04-02","10","통합사회","세계화와 평화","평화의 관점에서 국제 사회의 갈등과 협력의 사례를 조사하고, 세계 평화를 위한 행위 주체의 바람직한 역할을 탐색한다."],["10통사2-04-03","10","통합사회","세계화와 평화","남북 분단과 동아시아의 역사 갈등 상황을 분석하고, 이를 토대로 우리나라가 세계 평화에 기여할 수 있는 방안을 제안한다."],["10통사2-05-01","10","통합사회","미래와 지속가능한 삶","세계의 인구 분포와 구조 등에 대한 이해를 토대로 현재와 미래의 인구 문제 양상을 파악하고, 그 해결 방안을 제안한다."],["10통사2-05-02","10","통합사회","미래와 지속가능한 삶","지구적 차원에서 에너지 자원의 분포와 소비 실태를 파악하고, 기후변화에 대한 대응과 지속가능한 발전을 위한 제도적 방안과 개인적 노력을 탐구한다."],["10통사2-05-03","10","통합사회","미래와 지속가능한 삶","미래 사회의 모습을 다양한 측면에서 예측하고, 이를 바탕으로 세계시민으로서 자신의 미래 삶의 방향을 설정한다."],["10공수1-01-01","10","공통수학","다항식","다항식의 사칙연산의 원리를 설명하고, 그 계산을 할 수 있다."],["10공수1-01-02","10","공통수학","다항식","항등식의 성질과 나머지정리를 이해하고, 이를 활용하여 문제를 해결할 수 있다."],["10공수1-01-03","10","공통수학","다항식","다항식의 인수분해를 할 수 있다."],["10공수1-02-01","10","공통수학","방정식과 부등식","복소수의 뜻과 성질을 설명하고, 사칙연산을 수행할 수 있다."],["10공수1-02-02","10","공통수학","방정식과 부등식","이차방정식의 실근과 허근을 이해하고, 판별식을 이용하여 이차방정식의 근을 판별할 수 있다."],["10공수1-02-03","10","공통수학","방정식과 부등식","이차방정식의 근과 계수의 관계를 설명할 수 있다."],["10공수1-02-04","10","공통수학","방정식과 부등식","이차방정식과 이차함수를 연결하여 그 관계를 설명할 수 있다."],["10공수1-02-05","10","공통수학","방정식과 부등식","이차함수의 그래프와 직선의 위치 관계를 판단할 수 있다."],["10공수1-02-06","10","공통수학","방정식과 부등식","이차함수의 최대, 최소를 탐구하고, 이를 실생활과 연결하여 유용성을 인식할 수 있다."],["10공수1-02-07","10","공통수학","방정식과 부등식","간단한 삼차방정식과 사차방정식을 풀 수 있다."],["10공수1-02-08","10","공통수학","방정식과 부등식","미지수가 2개인 연립이차방정식을 풀 수 있다."],["10공수1-02-09","10","공통수학","방정식과 부등식","미지수가 1개인 연립일차부등식을 풀 수 있다."],["10공수1-02-10","10","공통수학","방정식과 부등식","절댓값을 포함한 일차부등식을 풀 수 있다."],["10공수1-02-11","10","공통수학","방정식과 부등식","이차부등식과 이차함수를 연결하여 그 관계를 설명하고, 이차부등식과 연립이차 부등식을 풀 수 있다."],["10공수1-03-01","10","공통수학","경우의 수","합의 법칙과 곱의 법칙을 이해하고, 적절한 전략을 사용하여 경우의 수와 관련된 문제를 해결할 수 있다."],["10공수1-03-02","10","공통수학","경우의 수","순열의 개념을 이해하고, 순열의 수를 구하는 방법을 설명할 수 있다."],["10공수1-03-03","10","공통수학","경우의 수","조합의 개념을 이해하고, 조합의 수를 구하는 방법을 설명할 수 있다."],["10공수1-04-01","10","공통수학","행렬","행렬의 뜻을 알고, 실생활 상황을 행렬로 표현할 수 있다."],["10공수1-04-02","10","공통수학","행렬","행렬의 연산을 수행하고, 관련된 문제를 해결할 수 있다."],["10공수2-01-01","10","공통수학","도형의 방정식","선분의 내분을 이해하고, 내분점의 좌표를 계산할 수 있다."],["10공수2-01-02","10","공통수학","도형의 방정식","두 직선의 평행 조건과 수직 조건을 탐구하고 이해한다."],["10공수2-01-03","10","공통수학","도형의 방정식","점과 직선 사이의 거리를 구하고, 관련된 문제를 해결할 수 있다."],["10공수2-01-04","10","공통수학","도형의 방정식","원의 방정식을 구하고, 그래프를 그릴 수 있다."],["10공수2-01-05","10","공통수학","도형의 방정식","좌표평면에서 원과 직선의 위치 관계를 판단하고, 이를 활용하여 문제를 해결할 수 있다."],["10공수2-01-06","10","공통수학","도형의 방정식","평행이동을 탐구하고, 실생활과 연결하여 문제를 해결할 수 있다."],["10공수2-01-07","10","공통수학","도형의 방정식","원점,  축,  축, 직선    에 대한 대칭이동을 탐구하고, 실생활과 연결하여 문제를 해결할 수 있다."],["10공수2-02-01","10","공통수학","집합과 명제","집합의 개념을 이해하고, 집합을 표현할 수 있다."],["10공수2-02-02","10","공통수학","집합과 명제","두 집합 사이의 포함관계를 판단할 수 있다."],["10공수2-02-03","10","공통수학","집합과 명제","집합의 연산을 수행하고, 벤 다이어그램을 이용하여 나타낼 수 있다."],["10공수2-02-04","10","공통수학","집합과 명제","명제와 조건의 뜻을 알고, ‘모든’, ‘어떤’을 포함한 명제를 이해하고 설명할 수 있다."],["10공수2-02-05","10","공통수학","집합과 명제","명제의 역과 대우를 이해하고 설명할 수 있다."],["10공수2-02-06","10","공통수학","집합과 명제","충분조건과 필요조건을 이해하고 판단할 수 있다."],["10공수2-02-07","10","공통수학","집합과 명제","대우를 이용한 증명법과 귀류법을 이해하고 관련된 명제를 증명할 수 있다."],["10공수2-02-08","10","공통수학","집합과 명제","절대부등식의 뜻을 알고, 간단한 절대부등식을 증명할 수 있다."],["10공수2-03-01","10","공통수학","함수와 그래프","함수의 개념을 설명하고, 그 그래프를 이해한다."],["10공수2-03-02","10","공통수학","함수와 그래프","함수의 합성을 설명하고, 합성함수를 구할 수 있다."],["10공수2-03-03","10","공통수학","함수와 그래프","역함수의 개념을 설명하고, 역함수를 구할 수 있다."],["10공수2-03-04","10","공통수학","함수와 그래프","유리함수    의 그래프를 그릴 수 있고, 그 그래프의 성질을 탐구할 수    있다."],["10공수2-03-05","10","공통수학","함수와 그래프","무리함수         의 그래프를 그릴 수 있고, 그 그래프의 성질을 탐구할 수 있다."],["10기수1-01-01","10","기본수학","다항식","다항식의 덧셈과 뺄셈의 원리를 이해하고, 그 계산을 할 수 있다."],["10기수1-01-02","10","기본수학","다항식","다항식의 곱셈과 나눗셈의 원리를 이해하고, 그 계산을 할 수 있다."],["10기수1-01-03","10","기본수학","다항식","인수분해 공식을 이용하여 다항식의 인수분해를 할 수 있다."],["10기수1-02-01","10","기본수학","방정식과 부등식","간단한 이차방정식을 풀 수 있다."],["10기수1-02-02","10","기본수학","방정식과 부등식","이차방정식에서 판별식을 이해하고, 근의 존재성을 판단할 수 있다."],["10기수1-02-03","10","기본수학","방정식과 부등식","이차함수의 뜻을 알고, 이차함수의 그래프의 성질을 설명할 수 있다."],["10기수1-02-04","10","기본수학","방정식과 부등식","이차방정식과 이차함수를 연결하여 그 관계를 이해한다."],["10기수1-02-05","10","기본수학","방정식과 부등식","이차함수의 최대, 최소를 이해하고, 간단한 문제를 해결할 수 있다."],["10기수1-02-06","10","기본수학","방정식과 부등식","부등식의 성질을 설명하고, 일차부등식을 풀 수 있다."],["10기수1-02-07","10","기본수학","방정식과 부등식","미지수가 1개인 연립일차부등식을 풀 수 있다."],["10기수1-02-08","10","기본수학","방정식과 부등식","절댓값을 포함한 간단한 일차부등식을 풀 수 있다."],["10기수1-02-09","10","기본수학","방정식과 부등식","이차부등식과 이차함수를 연결하여 그 관계를 이해하고, 간단한 이차부등식을 풀 수 있다."],["10기수1-03-01","10","기본수학","경우의 수","합의 법칙과 곱의 법칙을 이해하고, 적절한 전략을 사용하여 경우의 수와 관련된 문제를 해결할 수 있다."],["10기수1-03-02","10","기본수학","경우의 수","순열의 개념을 이해하고, 순열의 수를 구할 수 있다."],["10기수1-03-03","10","기본수학","경우의 수","조합의 개념을 이해하고, 조합의 수를 구할 수 있다."],["10기수1-04-01","10","기본수학","행렬","행렬의 뜻을 알고, 실생활 상황을 행렬로 표현할 수 있다."],["10기수1-04-02","10","기본수학","행렬","행렬의 연산을 수행하고, 간단한 문제를 해결할 수 있다."],["10기수2-01-01","10","기본수학","도형의 방정식","두 점 사이의 거리를 계산할 수 있다."],["10기수2-01-02","10","기본수학","도형의 방정식","직선의 방정식을 구하고, 그래프를 그릴 수 있다."],["10기수2-01-03","10","기본수학","도형의 방정식","두 직선의 평행 조건과 수직 조건을 이해하고, 관련된 문제를 해결할 수 있다."],["10기수2-01-04","10","기본수학","도형의 방정식","원의 방정식을 구하고, 그래프를 그릴 수 있다."],["10기수2-01-05","10","기본수학","도형의 방정식","좌표평면에서 원과 직선의 위치 관계를 판단할 수 있다."],["10기수2-01-06","10","기본수학","도형의 방정식","평행이동을 이해하고, 실생활과 연결할 수 있다."],["10기수2-01-07","10","기본수학","도형의 방정식","원점,  축,  축, 직선    에 대한 대칭이동을 이해하고, 실생활과 연결할 수 있다."],["10기수2-02-01","10","기본수학","집합과 명제","집합의 개념을 이해하고, 집합을 표현할 수 있다."],["10기수2-02-02","10","기본수학","집합과 명제","두 집합 사이의 포함관계를 판단할 수 있다."],["10기수2-02-03","10","기본수학","집합과 명제","두 집합의 연산을 수행하고, 벤 다이어그램을 이용하여 나타낼 수 있다."],["10기수2-02-04","10","기본수학","집합과 명제","명제와 조건의 뜻을 알고, 이를 설명할 수 있다."],["10기수2-02-05","10","기본수학","집합과 명제","명제의 역과 대우를 이해하고 설명할 수 있다."],["10기수2-03-01","10","기본수학","함수와 그래프","함수의 개념을 설명하고, 그 그래프를 이해한다."],["10기수2-03-02","10","기본수학","함수와 그래프","함수의 합성을 이해하고, 합성함수를 구할 수 있다."],["10기수2-03-03","10","기본수학","함수와 그래프","역함수의 개념을 이해하고, 역함수를 구할 수 있다."],["10기수2-03-04","10","기본수학","함수와 그래프","유리함수    의 그래프를 그릴 수 있고, 그 그래프의 성질을 탐구할 수 있다."],["10기수2-03-05","10","기본수학","함수와 그래프","무리함수     의 그래프를 그릴 수 있고, 그 그래프의 성질을 탐구할 수 있다."],["10통과1-01-01","10","통합과학","과학의 기초","자연을 시간과 공간에서 기술할 수 있음을 알고, 길이와 시간 측정의 현대적 방법과 다양한 규모의 측정 사례를 조사할 수 있다."],["10통과1-01-02","10","통합과학","과학의 기초","과학 탐구에서 중요한 기본량의 의미를 알고, 자연 현상을 기술하는 데 단위가 가지는 의미와 적용사례를 설명할 수 있다."],["10통과1-01-03","10","통합과학","과학의 기초","과학 탐구에서 측정과 어림의 의미를 알고, 일상생활의 여러 가지 상황에서 측정 표준의 유용성과 필요성을 논증할 수 있다."],["10통과1-01-04","10","통합과학","과학의 기초","자연에서 일어나는 다양한 변화를 측정⋅분석하여 정보를 산출함을 알고, 이러한 정보를 디지털로 변환하는 기술을 정보 통신에 활용하여 현대 문명에 미친 영향을 인식한다."],["10통과1-02-01","10","통합과학","물질과 규칙성","천체에서 방출되는 빛의 스펙트럼을 분석하여 우주 초기에 형성된 원소와 천체의 구성 물질을 추론할 수 있다."],["10통과1-02-02","10","통합과학","물질과 규칙성","우주 초기의 원소들로부터 태양계의 재료이면서 생명체를 구성하는 원소들이 형성되는 과정을 통해 지구와 생명의 역사가 우주 역사의 일부분임을 해석할 수 있다."],["10통과1-02-03","10","통합과학","물질과 규칙성","세상을 구성하는 원소들의 성질이 주기성을 나타내는 현상을 통해 자연의 규칙성을 도출하고, 지구와 생명체를 구성하는 주요 원소들이 결합을 형성하는 이유를 해석할 수 있다."],["10통과1-02-04","10","통합과학","물질과 규칙성","인류의 생존에 필수적인 물, 산소, 소금 등이 만들어지는 결합의 차이를 이해하고 각 물질의 성질과 관련지어 설명할 수 있다."],["10통과1-02-05","10","통합과학","물질과 규칙성","지각과 생명체를 구성하는 물질들이 기본 단위체의 결합을 통해서 형성된다는 것을 규산염 광물, 단백질과 핵산의 예를 통해 설명할 수 있다."],["10통과1-02-06","10","통합과학","물질과 규칙성","지구를 구성하는 물질을 전기적 성질에 따라 구분할 수 있고, 물질의 전기적 성질을 응용하여 일상생활과 첨단기술에서 다양한 소재로 활용됨을 인식한다."],["10통과1-03-01","10","통합과학","시스템과 상호작용","지구시스템은 태양계라는 시스템의 구성요소임을 알고, 지구시스템을 구성하는 권역들 간의 물질 순환과 에너지 흐름의 결과로 나타나는 현상을 논증할 수 있다."],["10통과1-03-02","10","통합과학","시스템과 상호작용","지권의 변화를 판구조론 관점에서 해석하고, 에너지 흐름의 결과로 발생하는 지권의 변화가 지구시스템에 미치는 영향을 추론할 수 있다."],["10통과1-03-03","10","통합과학","시스템과 상호작용","중력의 작용으로 인한 지구 표면과 지구 주위의 다양한 운동을 설명할 수 있다."],["10통과1-03-04","10","통합과학","시스템과 상호작용","상호작용이 없을 때 물체가 가속되지 않음을 알고, 충격량과 운동량의 관계를 충돌 관련 안전장치와 스포츠에 적용할 수 있다."],["10통과1-03-05","10","통합과학","시스템과 상호작용","생명 시스템을 유지하기 위해서 다양한 화학 반응과 물질 출입이 필요함을 이해하고, 일상생활에서 활용되는 화학 반응 사례를 조사하여 발표할 수 있다."],["10통과1-03-06","10","통합과학","시스템과 상호작용","생명 시스템의 유지에 필요한 세포 내 정보의 흐름을 유전자로부터 단백질이 만들어지는 과정을 중심으로 설명할 수 있다."],["10통과2-01-01","10","통합과학","변화와 다양성","지질시대를 통해 지구 환경이 끊임없이 변화해 왔으며 이러한 환경 변화가 생물다양성에 미치는 영향을 추론할 수 있다."],["10통과2-01-02","10","통합과학","변화와 다양성","변이의 발생과 자연선택 과정을 통해 생물의 진화가 일어나고, 진화의 과정을 통해 생물다양성이 형성되었음을 추론할 수 있다."],["10통과2-01-03","10","통합과학","변화와 다양성","자연과 인류의 역사에 큰 변화를 가져온 광합성, 화석 연료 사용, 철의 제련 등에서 공통점을 찾아 산화와 환원을 이해하고, 생활 주변의 다양한 변화를 산화와 환원의 특징과 규칙성으로 분석할 수 있다."],["10통과2-01-04","10","통합과학","변화와 다양성","대표적인 산⋅염기 물질의 특징을 알고, 산과 염기를 혼합할 때 나타나는 중화 반응을 생활 속에서 이용할 수 있다."],["10통과2-01-05","10","통합과학","변화와 다양성","생활 주변에서 에너지를 흡수하거나 방출하는 현상을 찾아 에너지의 흡수 방출이 우리 생활에 어떻게 이용되는지 토의할 수 있다."],["10통과2-02-01","10","통합과학","환경과 에너지","생태계 구성요소를 이해하고 생물과 환경 사이의 상호 관계를 설명할 수 있다."],["10통과2-02-02","10","통합과학","환경과 에너지","먹이 관계와 생태 피라미드를 중심으로 생태계 평형이 유지되는 과정을 이해하고, 환경의 변화가 생태계에 미칠 수 있는 영향에 대해 협력적으로 소통할 수 있다."],["10통과2-02-03","10","통합과학","환경과 에너지","온실효과 강화로 인한 지구온난화의 메커니즘을 이해하고, 엘니뇨, 사막화 등과 같은 현상이 지구 환경과 인간 생활에 미치는 영향과 대처 방안을 분석할 수 있다."],["10통과2-02-04","10","통합과학","환경과 에너지","태양에서 수소 핵융합 반응을 통해 질량 일부가 에너지로 바뀌고, 그중 일부가 지구에서 에너지 흐름을 일으키며 다양한 에너지로 전환되는 과정을 추론할 수 있다."],["10통과2-02-05","10","통합과학","환경과 에너지","발전기에서 운동 에너지가 전기 에너지로 전환되는 과정을 이해하고, 열원으로서 화석 연료, 핵에너지를 이용하는 발전소가 인간 생활에 미치는 영향을 조사⋅발표할 수 있다."],["10통과2-02-06","10","통합과학","환경과 에너지","에너지 효율의 의미와 중요성을 이해하고, 지속가능한 발전과 지구 환경 문제 해결에 신재생 에너지 기술을 활용하는 방안을 탐색할 수 있다."],["10통과2-03-01","10","통합과학","과학과 미래 사회","감염병의 진단, 추적 등을 사례로 과학의 유용성을 설명하고, 미래 사회 문제 해결에서 과학의 필요성에 대해 논증할 수 있다."],["10통과2-03-02","10","통합과학","과학과 미래 사회","빅데이터를 과학기술사회에서 사용하고 있는 사례를 조사하고, 빅데이터 활용의 장점과 문제점을 추론할 수 있다."],["10통과2-03-03","10","통합과학","과학과 미래 사회","인공지능 로봇, 사물인터넷 등과 같이 과학기술의 발전을 인간 삶과 환경 개선에 활용하는 사례를 찾고, 이러한 과학기술의 발전이 미래 사회에 미치는 유용성과 한계를 예측할 수 있다."],["10통과2-03-04","10","통합과학","과학과 미래 사회","과학기술의 발전 과정에서 발생할 수 있는 과학 관련 사회적 쟁점(SSI)과 과학기술 이용에서 과학 윤리의 중요성에 대해 논증할 수 있다."],["10과탐1-01-01","10","과학탐구실험","과학의 본성과 역사 속의 과학 탐구","과학사에서 패러다임의 전환을 가져온 결정적 실험을 따라 해보고, 과학의 발전 과정에 관해 설명할 수 있다."],["10과탐1-01-02","10","과학탐구실험","과학의 본성과 역사 속의 과학 탐구","과학사의 다양한 사례들로부터 과학의 본성을 추론할 수 있다."],["10과탐1-02-01","10","과학탐구실험","과학 탐구의 과정과 절차","직접적인 관찰을 통한 탐구를 수행하고, 귀납적 탐구 방법을 설명할 수 있다."],["10과탐1-02-02","10","과학탐구실험","과학 탐구의 과정과 절차","가설 설정을 포함한 과학사의 대표적인 탐구실험을 수행하고, 연역적 탐구 방법의 특징을 예증할 수 있다."],["10과탐1-02-03","10","과학탐구실험","과학 탐구의 과정과 절차","탐구 수행에서 얻은 정성적 혹은 정량적 데이터를 분석하고 그 결과를 다양하게 표상하고 소통할 수 있다."],["10과탐1-02-04","10","과학탐구실험","과학 탐구의 과정과 절차","흥미와 호기심을 갖고 과학 탐구에 참여하고, 분야 간 협동 연구 등을 통해 협력적 탐구 활동을 수행하며, 도출한 결과를 증거에 근거하여 해석하고 평가할 수 있다."],["10과탐2-01-01","10","과학탐구실험","생활 속의 과학 탐구","영화, 건축, 요리, 스포츠, 미디어 등 생활 속의 과학 원리를 실험 등을 통해 탐구하고, 과학 원리를 활용한 놀이 체험을 통해 과학의 즐거움과 유용성을 느낄 수 있다."],["10과탐2-01-02","10","과학탐구실험","생활 속의 과학 탐구","사회적 이슈나 생활 속에서 과학 탐구 문제를 발견하고, 이를 해결하기 위한 과학탐구 활동을 계획하고 수행할 수 있다."],["10과탐2-01-03","10","과학탐구실험","생활 속의 과학 탐구","과학 개념을 적용하여 실생활 문제의 해결방안을 창의적으로 고안하고, 필요한 도구를 설계⋅제작할 수 있다."],["10과탐02-01-03","10","과학탐구실험","생활 속의 과학 탐구","‘운동 관련 안전사고 예방 장치 고안하기’ 탐구 활동을 통해 협업의 가치를 깨닫고, 과학 탐구 전체 과정을 경험하여 공학적 설계 과정을 거쳐 창의적인 산출물을 고안하게 한다."],["10과탐2-02-01","10","과학탐구실험","미래 사회와 첨단 과학 탐구","첨단 과학기술 속의 과학 원리를 찾아내는 탐구 활동을 통해 과학 지식이 활용된 사례를 추론할 수 있다."],["10과탐2-02-02","10","과학탐구실험","미래 사회와 첨단 과학 탐구","과학 원리가 적용된 첨단 과학기술 및 탐구 산출물을 발표하고 공유하며, 이를 확 산할 수 있다."],["10과탐2-02-03","10","과학탐구실험","미래 사회와 첨단 과학 탐구","탐구 활동 과정에서 지켜야 할 생명 존중, 연구 진실성, 지식 재산권 존중 등과 같은 연구 윤리와 함께, 과학기술 이용과 관련된 과학 윤리 및 안전 사항을 준수할 수 있다."],["10공영1-01-01","10","공통영어","이해","말이나 글에 포함된 세부 정보를 파악한다."],["10공영1-01-02","10","공통영어","이해","말이나 글의 주제나 요지를 파악한다."],["10공영1-01-03","10","공통영어","이해","말이나 글의 분위기나 화자나 인물의 심정 및 의도 등을 추론한다."],["10공영1-01-04","10","공통영어","이해","말이나 글에 나타난 일이나 사건의 논리적 관계를 파악한다."],["10공영1-01-05","10","공통영어","이해","말이나 글에 포함된 표현의 함축적 의미를 추론한다."],["10공영1-01-06","10","공통영어","이해","말이나 글의 전개 방식이나 구조를 파악한다."],["10공영1-01-07","10","공통영어","이해","말이나 글의 이해를 위한 적절한 전략을 적용한다."],["10공영1-01-08","10","공통영어","이해","말이나 글에 나타난 다양한 관점이나 의견을 포용적인 태도로 분석한다."],["10공영1-02-01","10","공통영어","표현","실물, 그림, 사진, 도표 등을 활용하여 내용을 설명한다."],["10공영1-02-02","10","공통영어","표현","사실적 정보나 지식을 말이나 글로 전달한다."],["10공영1-02-03","10","공통영어","표현", function persist(){ clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(STORE, JSON.stringify(state)); $("#saved").textContent = "이 브라우저에 자동 저장됨"; } catch(e){ $("#saved").textContent = "자동 저장 안 됨 — 엑셀로 저장하세요"; } }, 350); }

/* ---------------- derived ---------------- */
function udlSet(){ return new Set(state.acts.flatMap(a => a.udl)); }
function byLevel(L){ return state.learners.filter(l => l.level === L); }
function traitCounts(list){ const m = {}; list.forEach(l => l.traits.forEach(t => m[t] = (m[t]||0)+1)); return Object.entries(m).sort((a,b)=>b[1]-a[1]); }
function levelMods(L){ return traitCounts(byLevel(L)).map(([t])=>TRAITS[t]?.mod).filter(Boolean).filter(m => !(L!=="상" && m==="스스로 계획을 세워")).slice(0,2); }
function genGoal(L){
  const G = state.goals.common.trim(); if (!G) return "";
  const mods = levelMods(L); const pre = mods.length ? mods.join(", ") + " " : "";
  if (L === "상") return pre + (/수 있다\.?$/.test(G) ? G.replace(/수 있다\.?$/, "수 있으며, 활동 방법을 스스로 선택하고 친구를 도울 수 있다.") : G);
  if (L === "중") return (special() ? "교사의 안내와 시범을 보며 " : "교사의 안내를 받아 ") + pre + G;
  return (special() ? "교사·보조인력의 도움을 받아 " : "교사의 도움을 받아 ") + pre + (/할 수 있다\.?$/.test(G) ? G.replace(/할 수 있다\.?$/, "하는 활동에 참여할 수 있다.") : G);
}
function refreshAutoGoals(){ LEVELS.forEach(L => { if (!state.goals.edited[L]) state.goals[L] = genGoal(L); }); }
function actsText(){ return state.acts.map(a => [a.title,a.teacher,a.student,a.mat,...LEVELS.map(L=>a.lv[L])].join(" ")).join(" "); }
function autoEnv(){
  const items = []; const add = (text, src) => { if (!items.some(x=>x.text===text)) items.push({key:text, text, src}); };
  ENV_GENERAL.forEach(t => add(t, "기본"));
  if (special()) ENV_SPECIAL.forEach(t => add(t, "특수학교"));
  const hay = [state.meta.subject, state.meta.content, state.meta.place, actsText()].join(" ");
  ENV_SUBJ.forEach(([re, ts]) => { if (re.test(hay)) ts.forEach(t => add(t, "수업 내용")); });
  traitCounts(state.learners).forEach(([t, n]) => (TRAITS[t]?.env||[]).forEach(x => add(x, `학습자: ${t} ${n}명`)));
  return items.map(it => { const o = state.env.over[it.key] || {}; return {...it, on: o.on ?? true, text: o.text ?? it.text}; });
}
function envActive(){ return [...autoEnv(), ...state.env.custom].filter(x => x.on); }
function goalToQ(g){ const t = g.trim().replace(/\.$/, ""); if (/할 수 있다$/.test(t)) return t.replace(/할 수 있다$/, "하는가?"); if (/수 있다$/.test(t)) return t.replace(/수 있다$/, "수 있는가?"); return t + " (달성 여부)"; }
function genChecklist(){
  const items = []; const add = (who, level, text) => { if (text && !items.some(x => x.text === text)) items.push({id:uid(), who, level, text, auto:true}); };
  LEVELS.forEach(L => { if (state.goals[L]) add("학생", L, goalToQ(state.goals[L])); });
  state.acts.filter(a => a.stage === "전개").forEach(a => add("학생", "공통", `‘${a.title || "활동"}’에 끝까지 참여하는가?`));
  const all = actsText();
  if (/차례|기다|대기선/.test(all)) add("학생","공통","대기선에서 차례를 기다리는가?");
  if (/응원|하이파이브|인사|위로/.test(all)) add("학생","공통","친구를 응원하거나 위로하는가?");
  if (/목표 카드|나의 목표/.test(all)) add("학생","공통","스스로 고른 목표의 달성 여부를 표시하는가?");
  const tl = {}; state.learners.forEach(l => l.traits.forEach(t => (tl[t] = tl[t] || new Set()).add(l.level)));
  Object.entries(tl).forEach(([t, set]) => add("학생", set.size === 1 ? [...set][0] : "공통", TRAITS[t]?.chk));
  uniq(state.acts.flatMap(a => a.mat.split(/[,·]/).map(x=>x.trim()).filter(Boolean))).slice(0,8).forEach(m => add("교사","공통", `${m} 준비 확인`));
  envActive().filter(x => x.src !== "기본").slice(0,4).forEach(x => add("교사","공통", x.text));
  Object.keys(state.beh.sel).filter(id => BEH_TEXT[id]?.cat === "예방").slice(0,3).forEach(id => add("교사","공통", state.beh.sel[id]));
  return items;
}

/* ---------------- report ---------------- */
function report(){
  const set = udlSet(); const acts = state.acts; const gOf = c => +c.split(".")[0];
  const out = [];
  const princ = (p, label, effect) => {
    const gs = PR[p].gs; const codes = [...set].filter(c => gs.includes(gOf(c)));
    const cov = gs.filter(g => codes.some(c => gOf(c) === g));
    const score = Math.round(100*(cov.length/3*0.6 + Math.min(codes.length,6)/6*0.4));
    const tips = gs.filter(g => !cov.includes(g)).map(g => ({text:`지침 ${g} ‘${GUIDE[g].name}’ 고려사항이 없습니다. 예: ${EX[PICK[g]]}`, act:{type:"addUdl", code:PICK[g]}}));
    if (!tips.length && score < 80) tips.push({text:`고려사항이 ${codes.length}개입니다. 한두 개를 더하면 설계가 촘촘해집니다.`, act:{type:"goto", step:"acts"}});
    out.push({key:p, label, short:label, color:`var(--${p.toLowerCase()})`, score, effect, tips});
  };
  princ("E","참여 (왜 배우나)","학생이 활동에 머무는 시간이 늘고 중도 이탈이 줄어듭니다.");
  princ("R","표상 (무엇을 배우나)","설명을 여러 방식으로 받아 이해의 격차가 줄어듭니다.");
  princ("A","행동·표현 (어떻게 배우나)","저마다의 방법으로 참여하고 스스로 점검하는 장면이 늘어납니다.");
  out[0].short="참여"; out[1].short="표상"; out[2].short="행동·표현";
  // learners
  { const needs = {}; state.learners.forEach(l => l.traits.forEach(t => (needs[t] = needs[t] || []).push(l.name || "이름 없음")));
    const keys = Object.keys(needs); let total = 0, ok = 0; const tips = [];
    keys.forEach(t => { const n = needs[t].length; total += n; const covered = (TRAITS[t]?.udl||[]).some(c => set.has(c)); if (covered) ok += n; else tips.push({text:`${t} (${needs[t].join(", ")}) — 활동에 드러나지 않습니다. 예: ${EX[TRAITS[t].udl[0]]}`, act:{type:"addUdl", code:TRAITS[t].udl[0]}}); });
    if (!state.learners.length) tips.push({text:"학습자 실태를 입력하면 개별 요구 반영도를 계산합니다.", act:{type:"goto", step:"learners"}});
    out.push({key:"L", label:"학습자 실태 반영", short:"실태 반영", color:"var(--accent)", score: total ? Math.round(100*ok/total) : 0, effect:"실태에 적힌 개별 요구가 수업 장면에서 채워집니다.", tips:tips.slice(0,4)}); }
  // differentiation
  { const good = acts.filter(a => LEVELS.every(L => a.lv[L].trim()) && new Set(LEVELS.map(L=>a.lv[L].trim())).size > 1);
    const goalsOk = LEVELS.every(L => state.goals[L].trim()) && new Set(LEVELS.map(L=>state.goals[L].trim())).size === 3;
    const score = Math.round(100*(0.7*(acts.length ? good.length/acts.length : 0) + 0.3*(goalsOk?1:0)));
    const tips = acts.filter(a => !good.includes(a)).slice(0,3).map(a => ({text:`‘${a.title||a.stage}’ 활동에 상·중·하 수행이 비었거나 같습니다.`, act:{type:"goto", step:"acts"}}));
    if (!goalsOk) tips.push({text:"상·중·하 학습목표가 비었거나 서로 같습니다.", act:{type:"goto", step:"goals"}});
    out.push({key:"D", label:"수준별 차별화", short:"수준 차별화", color:"#A8690F", score, effect:"상·중·하 모두 도달할 수 있는 목표로 성취 경험이 생깁니다.", tips}); }
  // agency
  { const core = ["6.1","7.1","9.3","6.4","8.5"]; const miss = core.filter(c => !set.has(c));
    out.push({key:"G", label:"학습자 주도성 (UDL 3.0 핵심)", short:"주도성", color:"var(--r)", score:(5-miss.length)*20, effect:"학생이 스스로 고르고, 점검하고, 돌아보는 장면이 늘어납니다.",
      tips: miss.slice(0,3).map(c => ({text:`${c} ${UDL[c].name} — 예: ${EX[c]}`, act:{type:"addUdl", code:c}}))}); }
  // safety
  { const env = autoEnv(); const on = envActive().length;
    const traitEnv = env.filter(x => x.src.startsWith("학습자")); const traitOn = traitEnv.filter(x => x.on).length;
    const score = Math.round(Math.min(1, on/7)*70 + (traitEnv.length ? traitOn/traitEnv.length : 1)*30);
    const tips = []; traitEnv.filter(x => !x.on).slice(0,2).forEach(x => tips.push({text:`꺼져 있는 학습자 맞춤 항목: ${x.text}`, act:{type:"goto", step:"env"}}));
    if (on < 7) tips.push({text:`켜진 안전 항목이 ${on}개입니다. 수업 장소·교구에 맞는 특수 상황을 입력해 보세요.`, act:{type:"goto", step:"env"}});
    out.push({key:"S", label:"환경·안전", short:"안전", color:"var(--e)", score, effect:"사고와 돌발 상황을 수업 전에 막습니다.", tips}); }
  // behavior
  { const cats = uniq([...Object.keys(state.beh.sel).map(id => BEH_TEXT[id]?.cat), ...state.beh.custom.map(c => c.cat)].filter(Boolean));
    const miss = ["예방","교수","강화","대응"].filter(c => !cats.includes(c));
    out.push({key:"B", label:"행동지원", short:"행동지원", color:"var(--a)", score:(4-miss.length)*25, effect:"기다림·활동 전환에서 생기는 돌발 행동이 줄어듭니다.", tips: miss.map(c => ({text:`‘${c}’ 전략이 없습니다.`, act:{type:"goto", step:"beh"}}))}); }
  // alignment
  { const goalsN = LEVELS.filter(L => state.goals[L].trim()).length;
    const studentItems = state.chk.items.filter(x => x.who === "학생");
    const lvPresent = uniq(state.learners.map(l => l.level)); const lvCovered = lvPresent.filter(L => studentItems.some(x => x.level === L || x.level === "공통"));
    const actsOk = acts.filter(a => a.student.trim()).length;
    const score = Math.round(40*goalsN/3 + 30*(lvPresent.length ? lvCovered.length/lvPresent.length : (studentItems.length?1:0)) + 30*(acts.length ? actsOk/acts.length : 0));
    const tips = []; if (!studentItems.length) tips.push({text:"관찰 체크리스트가 없습니다. 9단계에서 자동 생성하세요.", act:{type:"goto", step:"chk"}});
    acts.filter(a => !a.student.trim()).slice(0,2).forEach(a => tips.push({text:`‘${a.title||a.stage}’에 학생 활동이 비어 있습니다.`, act:{type:"goto", step:"acts"}}));
    out.push({key:"P", label:"목표–활동–평가 일치", short:"목표–평가", color:"var(--ink-2)", score, effect:"목표·활동·평가가 이어져 관찰 근거가 분명해집니다.", tips}); }
  // time
  { const tot = acts.reduce((s,a)=>s+(+a.min||0),0); const m = +state.meta.minutes; const hasIO = acts.some(a=>a.stage==="도입") && acts.some(a=>a.stage==="정리");
    let score = Math.max(0, 100 - Math.abs(tot-m)*10); if (!hasIO) score = Math.max(0, score-30);
    const tips = []; if (tot !== m) tips.push({text:`활동 시간 합계 ${tot}분, 수업 시간 ${m}분입니다.`, act:{type:"goto", step:"acts"}}); if (!hasIO) tips.push({text:"도입 또는 정리 단계가 없습니다.", act:{type:"goto", step:"acts"}});
    out.push({key:"T", label:"시간 배분", short:"시간", color:"var(--ink-3)", score, effect:"계획한 시간 안에 정리 단계까지 마칩니다.", tips}); }
  return out;
}
function status(score){ return score >= 80 ? ["ok","충분"] : score >= 50 ? ["warn","보완 권장"] : ["bad","부족"]; }
function ring(score, size=56, color="var(--accent)"){
  const r = size/2 - 6, c = 2*Math.PI*r, v = Math.max(0, Math.min(100, score));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="7"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-size="${size>80?26:15}" font-weight="700" fill="var(--ink)" font-family="var(--f-body)">${v}</text></svg>`;
}
function radar(ms){
  const W = 440, H = 360, cx = 220, cy = 180, R = 118, n = ms.length;
  const pt = (i, v) => { const a = -Math.PI/2 + i*2*Math.PI/n; return [cx + Math.cos(a)*R*v/100, cy + Math.sin(a)*R*v/100]; };
  let g = ""; [25,50,75,100].forEach(v => { g += `<polygon points="${ms.map((_,i)=>pt(i,v).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`; });
  ms.forEach((_,i) => { const [x,y] = pt(i,100); g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`; });
  g += `<polygon points="${ms.map((m,i)=>pt(i,m.score).join(",")).join(" ")}" fill="var(--accent)" fill-opacity=".18" stroke="var(--accent)" stroke-width="2"/>`;
  ms.forEach((m,i) => { const [x,y] = pt(i,m.score); g += `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--accent)"/>`; const a = -Math.PI/2 + i*2*Math.PI/n; const lx = cx + Math.cos(a)*(R+18), ly = cy + Math.sin(a)*(R+18); const anchor = Math.abs(Math.cos(a)) < .2 ? "middle" : Math.cos(a) > 0 ? "start" : "end"; g += `<text x="${lx}" y="${ly}" text-anchor="${anchor}" dominant-baseline="middle">${esc(m.short)} ${m.score}</text>`; });
  return `<svg class="radar" viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="설계 점검 레이더 차트">${g}</svg>`;
}

    if (window.claude) { toast("이 화면에서는 파일 저장을 쓸 수 없습니다."); return false; }
    const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); toast("저장했습니다: " + name); return true;
  }
  try { await AI.dl.save({filename:name, data:blob}); toast("저장했습니다: " + name); return true; }
  catch(e){ toast(e?.code === "declined" ? "저장을 취소했습니다." : e?.code === "rate_limited" ? "잠시 뒤 다시 눌러 주세요." : "파일을 저장하지 못했습니다."); return false; }
}

$("#xlsxFile").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { await loadScript(XLSX_URL); } catch(err){ toast("엑셀 도구를 불러오지 못했습니다."); return; }
  try {
    const X = window.XLSX; const wb = X.read(await f.arrayBuffer(), {type:"array"}); const p = {name:f.name, full:null, records:[], learners:[]};
    if (wb.Sheets["_data"]) { const rows = X.utils.sheet_to_json(wb.Sheets["_data"], {header:1}).slice(1).filter(r=>r.length>=2).sort((a,b)=>a[0]-b[0]); try { p.full = JSON.parse(rows.map(r=>r[1]).join("")); } catch(err){} }
    if (wb.Sheets["관찰기록"]) X.utils.sheet_to_json(wb.Sheets["관찰기록"]).forEach(r => { if (r["학습자ID"] || r["이름"]) p.records.push({sid:String(r["수업ID"]||r["날짜"]||""), date:String(r["날짜"]||""), title:String(r["수업명"]||""), lid:String(r["학습자ID"]||""), name:String(r["이름"]||""), cls:String(r["반"]||""), level:String(r["수준"]||""), iid:String(r["항목ID"]||""), item:String(r["항목"]||""), score:r["점수(0-2)"]===""||r["점수(0-2)"]==null?"":+r["점수(0-2)"], memo:String(r["메모"]||"")}); });
    const ls = wb.Sheets["학습자"] || (!p.full && wb.Sheets[wb.SheetNames[0]]);
    if (ls) X.utils.sheet_to_json(ls).forEach(r => { const name = String(r["이름"]||"").trim(); if (!name || name.startsWith("예:")) return; const lv = String(r["수준"]||"중").trim();
      p.learners.push({id:String(r["ID"]||uid()), name, cls:String(r["반"]||""), level:LEVELS.includes(lv)?lv:"중", traits:String(r["특성"]||"").split(/[,，]/).map(x=>x.trim()).filter(x=>x in TRAITS), disType:String(r["장애 유형"]||""), disLevel:String(r["장애 정도"]||""), aids:String(r["보조기기"]||""), strength:String(r["강점·관심"]||r["강점"]||""), needs:String(r["지원 요구"]||"")}); });
    p.summary = [p.full?"지도안 전체 포함":"지도안 데이터 없음", `관찰 기록 ${p.records.length}건`, `학습자 ${p.learners.length}명`].join(" · ");
    ui.pending = p; ui.step = "data"; render(); window.scrollTo({top:0});
  } catch(err){ toast("엑셀 파일을 읽지 못했습니다. .xlsx 파일인지 확인하세요."); }
});
async function exportWord(){

  const D = window.docx; const F = "맑은 고딕"; const W = 14838;
  const run = (t, o={}) => new D.TextRun({text:String(t??""), font:F, size:o.size||18, bold:!!o.b, color:o.c});

  const kv = rows => new D.Table({columnWidths:[2400, W-2400], width:{size:W,type:D.WidthType.DXA}, rows: rows.map(([k,v]) => new D.TableRow({children:[cell(k,2400,{b:true, fill:"EEF2F5"}), cell(v,W-2400)]}))});

  ch.push(h("학습자 실태"));
  ch.push(table(special() ? [1400,900,800,3600,2200,1000,2400,2538] : [1600,1000,900,4600,3200,3538],
    [special() ? ["이름","반","수준","특성","장애 유형","정도","보조기기","지원 요구"] : ["이름","반","수준","특성","강점·관심","지원 요구"],
     ...state.learners.map(l => special() ? [l.name,l.cls,l.level,l.traits.join(", "),l.disType,l.disLevel,l.aids,l.needs] : [l.name,l.cls,l.level,l.traits.join(", "),l.strength,l.needs])]));
