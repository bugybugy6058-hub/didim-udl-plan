2","국어","듣기⋅말하기","자신의 경험이나 생각을 바른 자세로 발표한다."],["2국01-05","2","국어","듣기⋅말하기","듣기와 말하기에 관심과 흥미를 가진다."],["2국02-01","2","국어","읽기","글자, 단어, 문장, 짧은 글을 정확하게 소리 내어 읽는다."],["2국02-02","2","국어","읽기","의미가 잘 드러나도록 문장과 짧은 글을 알맞게 띄어 읽는다."],["2국02-03","2","국어","읽기","글을 읽고 중심 내용을 확인한다."],["2국02-04","2","국어","읽기","인물의 마음이나 생각을 짐작하고 이를 자신과 비교하며 글을 읽는다."],["2국02-05","2","국어","읽기","읽기에 흥미를 가지고 즐겨 읽는 태도를 지닌다."],["2국03-01","2","국어","쓰기","글자와 단어를 바르게 쓴다."],["2국03-02","2","국어","쓰기","쓰기에 흥미를 가지며 자신의 생각이나 느낌을 문장으로 표현한다."],["2국03-03","2","국어","쓰기","주변 소재에 대해 소개하는 글을 쓴다."],["2국03-04","2","국어","쓰기","겪은 일을 표현하는 글을 자유롭게 쓰고, 쓴 글을 함께 읽고 생각이나 느낌을 나눈다."],["2국04-01","2","국어","문법","한글 자모의 이름과 소릿값을 알고 정확하게 발음하고 쓴다."],["2국04-02","2","국어","문법","소리와 표기가 다를 수 있음을 알고 단어를 바르게 읽고 쓴다."],["2국04-03","2","국어","문법","문장과 문장 부호를 알맞게 쓰고 한글에 호기심을 가진다."],["2국05-01","2","국어","문학","말놀이, 낭송 등을 통해 말의 재미와 즐거움을 느낀다."],["2국05-02","2","국어","문학","작품을 듣거나 읽으면서 느끼거나 생각한 점을 말한다."],["2국05-03","2","국어","문학","작품 속 인물의 모습, 행동, 마음을 상상하여 시, 노래, 이야기, 그림 등으로 표현한다."],["2국05-04","2","국어","문학","시나 노래, 이야기에 흥미를 가진다."],["2국06-01","2","국어","매체","일상의 다양한 매체와 매체 자료에 흥미와 관심을 가진다."],["2국06-02","2","국어","매체","일상의 경험과 생각을 글과 그림으로 표현한다."],["4국01-01","4","국어","듣기⋅말하기","중요한 내용과 주제를 파악하며 듣고 그 내용을 요약한다."],["4국01-02","4","국어","듣기⋅말하기","원인과 결과의 관계를 고려하여 내용을 예측하며 듣고 말한다."],["4국01-03","4","국어","듣기⋅말하기","상황에 적절한 준언어⋅비언어적 표현을 활용하여 듣고 말한다."],["4국01-04","4","국어","듣기⋅말하기","상황과 상대의 입장을 이해하고 예의를 지키며 대화한다."],["4국01-05","4","국어","듣기⋅말하기","목적과 주제에 알맞게 자료를 정리하여 자신감 있게 발표한다."],["4국01-06","4","국어","듣기⋅말하기","주제에 적절한 의견과 이유를 제시하고 서로의 생각을 교환하며 토의한다."],["4국02-01","4","국어","읽기","글의 의미를 파악하며 유창하게 글을 읽는다."],["4국02-02","4","국어","읽기","문단과 글에서 중심 생각을 파악하고 내용을 간추린다."],["4국02-03","4","국어","읽기","질문을 활용하여 글을 예측하며 읽고 자신의 읽기 과정을 점검한다."],["4국02-04","4","국어","읽기","글에 나타난 사실과 의견을 구분하고 필자와 자신의 의견을 비교한다."],["4국02-05","4","국어","읽기","글이나 자료의 출처가 믿을 만한지 판단한다."],["4국02-06","4","국어","읽기","바람직한 읽기 습관을 형성하고 읽기에 대한 자신감을 기른다."],["4국03-01","4","국어","쓰기","중심 문장과 뒷받침 문장을 갖추어 문단을 쓰고, 문장과 문단을 중심으로 고쳐 쓴다."],["4국03-02","4","국어","쓰기","절차와 결과가 드러나게 정확한 표현으로 보고하는 글을 쓴다."],["4국03-03","4","국어","쓰기","대상에 대한 자신의 의견과 그렇게 생각한 이유가 드러나게 글을 쓴다."],["4국03-04","4","국어","쓰기","목적과 주제를 고려하여 독자에게 마음을 전하는 글을 쓴다."],["4국03-05","4","국어","쓰기","자신의 쓰기 과정을 점검하며 쓰기에 자신감을 갖는다."],["4국04-01","4","국어","문법","단어와 단어 간의 의미 관계를 파악한다."],["4국04-02","4","국어","문법","단어를 분류하고 국어사전을 활용하여 능동적인 국어 활동을 한다."],["4국04-03","4","국어","문법","기본적인 문장의 짜임을 이해하고 적절하게 사용한다."],["4국04-04","4","국어","문법","글과 담화에 쓰인 높임 표현과 지시⋅접속 표현을 이해하고 상황에 맞게 표현한다."],["4국04-05","4","국어","문법","언어가 의사소통과 관계 형성의 수단임을 이해하고 국어를 소중히 여기는 태도를 지닌다."],["4국05-01","4","국어","문학","인물과 이야기의 흐름을 중심으로 작품을 감상한다."],["4국05-02","4","국어","문학","자신의 경험을 바탕으로 작품 속 세계와 현실 세계를 비교하여 작품을 감상한다."],["4국05-03","4","국어","문학","작품을 듣거나 읽고 마음에 드는 작품을 소개한다."],["4국05-04","4","국어","문학","감각적 표현에 유의하여 작품을 감상하고, 감각적 표현을 활용하여 자신의 생각이나 감정을 표현한다."],["4국05-05","4","국어","문학","재미나 감동을 느끼며 작품을 즐겨 감상하는 태도를 지닌다."],["4국06-01","4","국어","매체","인터넷에서 학습에 필요한 다양한 자료를 탐색하고 목적에 맞게 자료를 선택한다."],["4국06-02","4","국어","매체","매체를 활용하여 간단한 발표 자료를 만든다."],["4국06-03","4","국어","매체","매체 소통 윤리를 고려하여 매체 자료를 활용하고 공유한다."],["6국01-01","6","국어","듣기⋅말하기","대화에서 생략된 내용을 추론하며 듣는다."],["6국01-02","6","국어","듣기⋅말하기","주장을 파악하고 이유나 근거가 타당한지 평가하며 듣는다."],["6국01-03","6","국어","듣기⋅말하기","주제와 관련하여 궁금한 내용을 질문하며 적극적으로 듣고 말한다."],["6국01-04","6","국어","듣기⋅말하기","면담의 절차를 이해하고 상대와 매체를 고려하여 면담한다."],["6국01-05","6","국어","듣기⋅말하기","자료를 선별하여 핵심 정보를 중심으로 내용을 구성하고 매체를 활용하여 발표한다."],["6국01-06","6","국어","듣기⋅말하기","토의에 협력적으로 참여하며 서로의 의견을 비교하고 조정한다."],["6국01-07","6","국어","듣기⋅말하기","절차와 규칙을 지키고 타당한 이유와 근거를 제시하며 토론한다."],["6국02-01","6","국어","읽기","글의 구조를 고려하며 주제나 주장을 파악하고 글 내용을 요약한다."],["6국02-02","6","국어","읽기","글에서 생략된 내용이나 함축된 표현을 문맥을 고려하여 추론한다."],["6국02-03","6","국어","읽기","글이나 자료를 읽고 내용의 타당성과 표현의 적절성을 평가한다."],["6국02-04","6","국어","읽기","문제 상황과 관련된 다양한 관점의 글을 읽고 이를 문제 해결에 활용한다."],["6국02-05","6","국어","읽기","긍정적인 읽기 동기를 형성하고 적극적으로 읽기에 참여하는 태도를 기른다."],["6국03-01","6","국어","쓰기","알맞은 내용을 선정하여 대상의 특성이 나타나게 설명하는 글을 쓴다."],["6국03-02","6","국어","쓰기","적절한 근거를 사용하고 인용의 출처를 밝히며 주장하는 글을 쓴다."],["6국03-03","6","국어","쓰기","체험한 일에 대한 감상을 나타내는 글을 쓴다."],["6국03-04","6","국어","쓰기","독자와 매체를 고려하여 내용을 생성하고 표현하며 글을 쓴다."],["6국03-05","6","국어","쓰기","쓰기 과정을 점검⋅조정하며 글을 쓰고, 글 전체를 대상으로 통일성 있게 고쳐 쓴다."],["6국03-06","6","국어","쓰기","쓰기에 적극적으로 참여하며 자신의 글을 독자와 공유하는 태도를 지닌다."],["6국04-01","6","국어","문법","음성 언어 및 문자 언어의 특성을 이해하고 다양한 매체 자료에서 표현 효과를 평가한다."],["6국04-02","6","국어","문법","표준어와 방언의 기능을 파악하고 언어 공동체와 국어생활과의 관계를 이해한다."],["6국04-03","6","국어","문법","고유어와 관용 표현의 쓰임과 가치를 이해하고 상황에 맞게 표현한다."],["6국04-04","6","국어","문법","문장 성분을 이해하고 호응 관계가 올바른 문장을 구성한다."],["6국04-05","6","국어","문법","글과 담화에 쓰인 시간 표현을 이해하고 상황에 맞게 표현한다."],["6국04-06","6","국어","문법","글과 담화에 쓰인 단어 및 문장, 띄어쓰기를 민감하게 살펴 바르게 고치는 태도를 지닌다."],["6국05-01","6","국어","문학","작가의 의도를 생각하며 작품을 읽는다."],["6국05-02","6","국어","문학","비유적 표현의 효과에 유의하여 작품을 감상한다."],["6국05-03","6","국어","문학","소설이나 극을 읽고 인물, 사건, 배경을 파악한다."],["6국05-04","6","국어","문학","인상적인 부분을 중심으로 작품에 대한 의견을 나눈다."],["6국05-05","6","국어","문학","자신의 경험을 시, 소설, 극, 수필 등 적절한 갈래로 표현한다."],["6국05-06","6","국어","문학","작품을 읽고 자신의 삶과 연관 지어 성찰하는 태도를 지닌다."],["6국06-01","6","국어","매체","정보 검색 도구를 활용하여 자신의 목적에 맞는 매체 자료를 찾는다."],["6국06-02","6","국어","매체","뉴스 및 각종 정보 매체 자료의 신뢰성을 평가한다."],["6국06-03","6","국어","매체","적합한 양식과 수용자의 반응을 고려하여 복합양식 매체 자료를 제작하고 공유한다."],["6국06-04","6","국어","매체","자신의 매체 이용 양상에 대해 성찰한다."],["4사02-01","4","사회","일상에서 만나는 과거","일상 속에서 시간의 흐름을 경험할 수 있는 사례를 살펴보고, 이를 바탕으로 역사의 시간 개념을 이해한다."],["4사02-02","4","사회","일상에서 만나는 과거","오래된 물건이나 자료들을 주변에서 찾아보고, 이를 통해 과거의 모습을 살펴볼 수 있음을 이해한다."],["4사02-03","4","사회","일상에서 만나는 과거","지역의 변화상을 보여주는 역사 자료를 분석하여 지역 사람들의 달라진 생활 모습을 파악한다."],["4사03-01","4","사회","사회 변화와 다양한 문화","최근 사회 변화의 양상과 특징을 파악하고, 그로 인해 나타난 생활모습의 변화를 탐색한다."],["4사03-02","4","사회","사회 변화와 다양한 문화","우리 사회에 다양한 문화가 확산되면서 나타나는 긍정적 효과와 문제를 분석하고, 나와 다른 사람이나 집단의 문화를 존중하는 태도를 기른다."],["4사04-01","4","사회","옛날과 오늘날의 생활 모습","옛날 풍습에 대해 알아보고, 오늘날과 비교하여 변화상을 파악한다."],["4사04-02","4","사회","옛날과 오늘날의 생활 모습","옛날부터 오늘날까지 교통의 변화에 따른 이동과 생활 모습의 변화를 이해한다."],["4사04-03","4","사회","옛날과 오늘날의 생활 모습","옛날부터 오늘날까지 통신수단의 변화에 따른 정보 교류와 의사소통 방식의 변화를 설명한다."],["4사05-01","4","사회","지도로 만나는 우리 지역","우리 지역을 표현한 다양한 종류의 지도를 찾아보고, 지도의 요소를 이해한다."],["4사05-02","4","사회","지도로 만나는 우리 지역","지도에서 우리 지역의 위치를 파악하고, 우리 지역의 지리 정보를 탐색한다."],["4사06-01","4","사회","우리 지역의 문화유산","지역의 문화유산을 통해 문화유산의 의미와 유형을 알아보고, 문화유산의 가치를 탐색한다."],["4사06-02","4","사회","우리 지역의 문화유산","지역의 박물관, 기념관, 유적지 등을 체험하고 지역의 역사를 이해한다."],["4사07-01","4","사회","경제활동과 지역 간 교류","자원의 희소성으로 인해 경제활동에서 선택의 문제가 발생함을 이해하고, 경제활동에서 합리적 선택의 방법을 탐색한다."],["4사07-02","4","사회","경제활동과 지역 간 교류","생산과 소비 활동을 파악하고, 인적⋅물적 교류의 사례를 통해 각 지역 및 사람들이 상호의존 관계를 맺고 있음을 탐색한다."],["4사08-01","4","사회","민주주의와 자치","학교 자치 사례를 통하여 민주주의의 의미를 이해하고, 학교생활에서 민주주의를 실천하는 능력을 기른다."],["4사08-02","4","사회","민주주의와 자치","지역에서 이루어지는 민주주의 사례를 통해 주민 자치와 주민 참여의 중요성을 파악하고, 지역사회의 문제 해결에 참여하는 태도를 기른다."],["4사09-01","4","사회","지역문제를 해결하고 지역을 알리는 노력","생활 주변에서 찾을 수 있는 여러 가지 문제를 파악하고, 그 문제를 합리적으로 해결하는 능력을 기른다."],["4사09-02","4","사회","지역문제를 해결하고 지역을 알리는 노력","지역의 자연환경, 역사, 문화, 생산물 등을 알리려는 지역사회의 노력을 알고 관심을 갖는다."],["4사10-01","4","사회","다양한 환경과 삶의 모습","여러 지역의 자연환경과 인문환경의 특징을 살펴보고, 환경의 이용과 개발에 따른 변화를 탐구한다."],["4사10-02","4","사회","다양한 환경과 삶의 모습","사례에서 도시의 인구, 교통, 산업 등의 특징을 탐구하고, 도시에서의 삶의 모습을 이해한다."],["6사01-01","6","사회","우리나라 국토 여행","우리나라 산지, 하천, 해안 지형의 위치를 확인하고 지형의 분포 특징을 탐구한다."],["6사01-02","6","사회","우리나라 국토 여행","독도의 지리적 특성과 독도에 대한 역사 기록을 바탕으로 영토로서 독도의 중요성을 이해한다."],["6사02-01","6","사회","우리나라 지리 탐구","우리나라의 계절별 기후 특징을 자료에서 탐구하고, 기후변화로 인한 자연재해의 심각성을 이해한다."],["6사02-02","6","사회","우리나라 지리 탐구","우리나라의 지역별 인구 분포의 특징을 알아보고, 이에 따른 문제점과 해결 방안을 탐색한다."],["6사03-01","6","사회","법과 인권의 보장","일상 사례에서 법의 의미와 역할을 이해하고, 헌법에 규정된 인권이 일상생활에서 구현 되는 사례를 조사하여 인권 친화적 태도를 기른다."],["6사03-02","6","사회","법과 인권의 보장","일상생활에서 인권이 침해되는 사례를 찾아 그 해결 방안을 탐색하고, 인권을 보호하는 활동에 참여한다."],["6사04-01","6","사회","유적과 유물로 살펴본 옛 사람들의 생활","선사 시대와 고조선의 유적과 유물을 활용하여 당시 사람들의 생활을 추론한다."],["6사04-02","6","사회","유적과 유물로 살펴본 옛 사람들의 생활","역사 기록이나 유적과 유물에 나타난 고대 사람들의 생각과 생활을 추론한다."],["6사04-03","6","사회","유적과 유물로 살펴본 옛 사람들의 생활","다양한 역사 자료를 활용하여 고려 시대 사회 모습과 사람들의 생활을 추론한다."],["6사05-01","6","사회","달라지는 시대, 변화하는 생활 모습","조선 시대 사람들의 생각과 생활에 유교 문화가 미친 영향을 파악한다."],["6사05-02","6","사회","달라지는 시대, 변화하는 생활 모습","조선 후기 사회⋅문화적 변화와 개항기 근대 문물 수용 과정에서 달라진 사람들의 생활을 이해한다."],["6사06-01","6","사회","식민 통치와 저항, 전쟁이 바꾼 사회와 생활","일제의 식민 통치와 이에 대한 저항이 사회와 생활에 미친 영향을 이해한다."],["6사06-02","6","사회","식민 통치와 저항, 전쟁이 바꾼 사회와 생활","8⋅15 광복과 6⋅25 전쟁이 사회와 생활에 미친 영향을 파악한다."],["6사07-01","6","사회","평화 통일을 위한 노력, 민주화와 산업화","분단으로 나타난 문제점과 분단과 관련된 장소를 평화의 장소로 만들려는 노력 등을 알아보고, 평화 통일을 위해 우리가 할 수 있는 일을 탐색한다."],["6사07-02","6","사회","평화 통일을 위한 노력, 민주화와 산업화","민주화와 산업화로 인해 달라진 생활 문화를 사례를 들어 이해한다."],["6사08-01","6","사회","민주주의와 시민 참여","민주주의에서 선거의 의미와 역할을 파악하고, 시민의 주권 행사를 위해 선거에 참여하는 태도를 기른다."],["6사08-02","6","사회","민주주의와 시민 참여","민주 국가에서 국회, 행정부, 법원이 하는 일에 대해 이해하고, 각 국가기관의 권력을 분립 하는 이유를 탐색한다."],["6사08-03","6","사회","민주주의와 시민 참여","민주주의에서 미디어의 의미와 역할을 이해하고, 여러 가지 미디어의 내용을 비판적으로 분석하여 올바르게 이용하는 태도를 기른다."],["6사09-01","6","사회","지구, 대륙 그리고 국가들","세계를 표현하는 다양한 공간 자료의 특징을 이해하고, 지구본과 세계지도에서 위치를 표현하는 방법을 익힌다."],["6사09-02","6","사회","지구, 대륙 그리고 국가들","세계 주요 대륙과 대양을 파악하고, 우리나라 및 세계 여러 국가의 위치와 영토의 특징을 이해한다."],["6사10-01","6","사회","세계의 자연환경","세계의 여러 지역의 지형 경관을 살펴보고, 이를 통해 다양한 삶의 모습을 이해한다."],["6사10-02","6","사회","세계의 자연환경","세계의 다양한 기후를 알아보고 기후 환경과 인간생활 간의 관계를 탐구한다."],["6사11-01","6","사회","시장경제와 국가 간 거래","시장경제에서 가계와 기업의 역할을 이해하고, 근로자의 권리와 기업의 자유 및 사회적 책임을 탐색한다."],["6사11-02","6","사회","시장경제와 국가 간 거래","경제성장이 우리 생활에 미치는 영향을 파악하고, 빠른 경제성장으로 발생한 문제의 해결 방안을 탐색한다."],["6사11-03","6","사회","시장경제와 국가 간 거래","사례를 통해 무역의 의미를 이해하고, 국가 간 무역이 발생하는 이유를 탐구한다."],["6사12-01","6","사회","지구촌 사람들","세계의 인구 분포를 파악하고 여러 국가의 인구 특징을 탐구한다."],["6사12-02","6","사회","지구촌 사람들","지구촌을 위협하는 다양한 문제들을 파악하고, 지속가능한 미래를 위한 해결 방안을 탐색한다."],["4도01-01","4","도덕","자신과의 관계","자신의 감정을 소중히 여기며 존중하는 태도를 바탕으로 내가 누구인가를 탐구한다."],["4도01-02","4","도덕","자신과의 관계","정직의 의미를 알고 모범적인 사례를 탐색하여 바르게 행동하려는 태도를 기른다."],["4도01-03","4","도덕","자신과의 관계","성실한 생활의 모범 사례를 탐색하고 시간 관리를 위한 생활을 계획하여 지속적인 자기 성장을 모색한다."],["4도01-04","4","도덕","자신과의 관계","다른 사람의 관점을 수용할 수 있는지를 도덕적으로 검토하고 도덕규범을 내면화하여 도덕적으로 행동할 수 있는 자세를 기른다."],["6도01-01","6","도덕","자신과의 관계","자주적인 삶에 대한 이해를 바탕으로 자신의 생활계획을 세우고 실천하여 주체적인 삶의 태도를 기른다."],["6도01-02","6","도덕","자신과의 관계","생활 습관에 대한 성찰을 통해 자기 생활을 점검하고 올바른 계획을 세워 이를 실천한다."],["6도01-03","6","도덕","자신과의 관계","자기가 하고 싶은 일을 선택할 때 도덕적 고려의 필요성을 알고 자신의 특기와 적성을 탐색하여 진로계획을 수립한다."],["4도02-01","4","도덕","타인과의 관계","효, 우애의 의미와 필요성을 명료하게 이해하고 가족의 행복을 위해 할 수 있는 일을 탐색하여 실천 계획을 세운다."],["4도02-02","4","도덕","타인과의 관계","친구 사이의 배려에 대한 올바른 이해를 바탕으로 일상생활에서 배려에 기반한 도덕적 관계를 맺을 수 있는 방안을 탐색한다."],["4도02-03","4","도덕","타인과의 관계","공감의 태도가 필요한 이유를 이해하고 도덕적 상상력을 바탕으로 대상과 상황에 따라 감정을 나누는 방법을 탐구하여 실천한다."],["6도02-01","6","도덕","타인과의 관계","봉사의 의미와 중요성을 이해하고, 타인이 처한 상황과 환경에 대한 주의 깊은 관심을 바탕으로 봉사를 실천한다."],["6도02-02","6","도덕","타인과의 관계","편견이 발생하는 이유를 탐색하여 해결 방안을 살펴보고, 다양성 존중을 바탕으로 다른 사람과 올바른 관계를 맺기 위한 실천 방안을 탐구한다."],["6도02-03","6","도덕","타인과의 관계","인간과 인공지능 로봇 간의 다양한 관계를 파악하고 도덕에 기반을 둔 관계 형성의 필요성을 탐구한다."],["4도03-01","4","도덕","사회⋅공동체와의 관계","불공정의 사례를 탐구하고, 일상생활에서 공정의 가치를 추구하는 활동을 통해 실천 의지를 함양한다."],["4도03-02","4","도덕","사회⋅공동체와의 관계","디지털 사회에서 발생하는 다양한 문제를 살펴보고, 해결 방안을 탐구하여 정보통신 윤리에 대한 민감성을 기른다."],["4도03-03","4","도덕","사회⋅공동체와의 관계","통일의 필요성을 이해하고, 통일 감수성을 길러 바람직한 통일의 방향을 모색한다."],["6도03-01","6","도덕","사회⋅공동체와의 관계","인권과 관련된 다양한 사례를 살펴보고 인권에 관한 감수성을 길러 이를 실천하려는 의지를 함양한다."],["6도03-02","6","도덕","사회⋅공동체와의 관계","정의에 관한 관심을 토대로 공동체 규칙의 중요성을 살펴보고 직접 공정한 규칙을 고안 하며 기초적인 시민의식을 기른다."],["6도03-04","6","도덕","사회⋅공동체와의 관계","다른 나라 사람들이 처한 여러 가지 상황을 종합적으로 이해하고 해결 방안을 탐구하며 인류애를 기른다."],["4도04-01","4","도덕","자연과의 관계","생명 경시 사례를 조사하고 문제 해결 방법을 탐구함으로써 생명의 소중함을 이해한다."],["4도04-02","4","도덕","자연과의 관계","인간과 자연이 함께 살아야 하는 이유를 이해하고 공생을 위한 구체적인 실천 계획을 세우며 생태 감수성을 기른다."],["6도04-01","6","도덕","자연과의 관계","지구의 환경 위기 상황을 이해하고, 이를 극복하기 위한 다양한 방안을 찾아 자신의 일상에서 실천하고자 노력한다."],["6도04-02","6","도덕","자연과의 관계","지속가능한 삶의 의미를 탐구하고 미래 세대에 대한 책임을 강화하여 자연의 다양성을 존중하고 생산성을 유지할 수 있는 미래를 위한 실천 방안을 찾는다."],["2수01-01","2","수학","수와 연산","수의 필요성을 인식하면서 0과 100까지의 수 개념을 이해하고, 수를 세고 읽고 쓸 수 있다."],["2수01-02","2","수학","수와 연산","일, 십, 백, 천의 자릿값과 위치적 기수법을 이해하고, 네 자리 이하의 수를 읽고 쓸 수 있다."],["2수01-03","2","수학","수와 연산","네 자리 이하의 수의 범위에서 수의 계열을 이해하고, 수의 크기를 비교할 수 있다."],["2수01-04","2","수학","수와 연산","하나의 수를 두 수로 분해하고 두 수를 하나의 수로 합성하는 활동을 통하여 수 감각을 기른다."],["2수01-05","2","수학","수와 연산","덧셈과 뺄셈이 이루어지는 실생활 상황과 연결하여 덧셈과 뺄셈의 의미를 이해한다."],["2수01-06","2","수학","수와 연산","두 자리 수의 범위에서 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다."],["2수01-07","2","수학","수와 연산","덧셈과 뺄셈의 관계를 이해한다."],["2수01-08","2","수학","수와 연산","두 자리 수의 범위에서 세 수의 덧셈과 뺄셈을 할 수 있다."],["2수01-09","2","수학","수와 연산","□가 사용된 덧셈식과 뺄셈식을 만들고, □의 값을 구할 수 있다."],["2수01-10","2","수학","수와 연산","곱셈이 이루어지는 실생활 상황과 연결하여 곱셈의 의미를 이해한다."],["2수01-11","2","수학","수와 연산","곱셈구구를 이해하고, 한 자리 수의 곱셈을 할 수 있다."],["2수02-01","2","수학","변화와 관계","물체, 무늬, 수 등의 배열에서 규칙을 찾아 여러 가지 방법으로 표현할 수 있다."],["2수02-02","2","수학","변화와 관계","자신이 정한 규칙에 따라 물체, 무늬, 수 등을 배열할 수 있다."],["2수03-01","2","수학","도형과 측정","교실 및 생활 주변에서 여러 가지 물건을 관찰하여 직육면체, 원기둥, 구의 모양을 찾고, 이를 이용하여 여러 가지 모양을 만들 수 있다."],["2수03-02","2","수학","도형과 측정","쌓기나무를 이용하여 여러 가지 입체도형의 모양을 만들고, 그 모양에 대해 위치나 방향을 이용하여 말할 수 있다."],["2수03-03","2","수학","도형과 측정","교실 및 생활 주변에서 여러 가지 물건을 관찰하여 삼각형, 사각형, 원의 모양을 찾고, 이를 이용하여 여러 가지 모양을 만들 수 있다."],["2수03-04","2","수학","도형과 측정","삼각형, 사각형, 원을 직관적으로 이해하고, 그 모양을 그릴 수 있다."],["2수03-05","2","수학","도형과 측정","삼각형, 사각형에서 각각의 공통점을 찾아 말할 수 있다."],["2수03-06","2","수학","도형과 측정","구체물의 길이, 들이, 무게, 넓이를 비교하여 각각 ‘길다, 짧다’, ‘많다, 적다’, ‘무겁다, 가볍다’, ‘넓다, 좁다’ 등을 구별하여 말할 수 있다."],["2수03-07","2","수학","도형과 측정","시계를 보고 시각을 ‘몇 시 몇 분’까지 읽을 수 있다."],["2수03-08","2","수학","도형과 측정","1시간과 1분의 관계를 이해하고, 시간을 ‘시간’, ‘분’으로 표현할 수 있다."],["2수03-09","2","수학","도형과 측정","실생활 문제 상황과 연결하여 1분, 1시간, 1일, 1주일, 1개월, 1년 사이의 관계를 이해한다."],["2수03-10","2","수학","도형과 측정","길이 단위 1cm와 1m를 알고, 이를 이용하여 주변 사물의 길이를 측정할 수 있다."],["2수03-11","2","수학","도형과 측정","1m와 1cm의 관계를 이해하고, 길이를 ‘몇 m 몇 cm’와 ‘몇 cm’로 표현할 수 있다."],["2수03-12","2","수학","도형과 측정","여러 가지 물건의 길이를 어림하고, 길이에 대한 양감을 기른다."],["2수03-13","2","수학","도형과 측정","실생활 문제 상황과 연결하여 길이의 덧셈과 뺄셈을 할 수 있다."],["2수04-01","2","수학","자료와 가능성","여러 가지 사물을 정해진 기준 또는 자신이 정한 기준으로 분류하여 개수를 세어 보고, 기준에 따른 결과를 말할 수 있다."],["2수04-02","2","수학","자료와 가능성","자료를 분류하여 표로 나타내고, 자료를 표로 나타내면 편리한 점을 말할 수 있다."],["2수04-03","2","수학","자료와 가능성","자료를 분류하여 ○, ×, / 등을 이용한 그래프로 나타내고, 자료를 그래프로 나타내면 편리한 점을 말할 수 있다."],["4수01-01","4","수학","수와 연산","큰 수의 필요성을 인식하면서 10000 이상의 큰 수에 대한 자릿값과 위치적 기수법을 이해하고, 수를 읽고 쓸 수 있다."],["4수01-02","4","수학","수와 연산","다섯 자리 이상의 수의 범위에서 수의 계열을 이해하고, 수의 크기를 비교하며 그 방법을 설명할 수 있다."],["4수01-03","4","수학","수와 연산","세 자리 수의 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다."],["4수01-04","4","수학","수와 연산","곱하는 수가 한 자리 수 또는 두 자리 수인 곱셈의 계산 원리를 이해하고 그 계산을 할수 있다."],["4수01-05","4","수학","수와 연산","나눗셈이 이루어지는 실생활 상황과 연결하여 나눗셈의 의미를 알고, 곱셈과 나눗셈의 관계를 이해한다."],["4수01-06","4","수학","수와 연산","나누는 수가 한 자리 수인 나눗셈의 계산 원리를 이해하고 그 계산을 할 수 있으며, 나눗셈에서 몫과 나머지의 의미를 안다."],["4수01-07","4","수학","수와 연산","나누는 수가 두 자리 수인 나눗셈의 계산 원리를 이해하고 그 계산을 할 수 있다."],["4수01-08","4","수학","수와 연산","자연수의 덧셈, 뺄셈, 곱셈, 나눗셈과 관련한 여러 가지 상황에서 어림셈을 할 수 있다."],["4수01-09","4","수학","수와 연산","양의 등분할을 통하여 분수의 필요성을 인식하고, 분수를 이해하고 읽고 쓸 수 있다."],["4수01-10","4","수학","수와 연산","단위분수, 진분수, 가분수, 대분수를 알고, 그 관계를 이해한다."],["4수01-11","4","수학","수와 연산","분모가 같은 분수끼리, 단위분수끼리 크기를 비교하고 그 방법을 설명할 수 있다."],["4수01-12","4","수학","수와 연산","분모가 10인 진분수와 연결하여 소수 한 자리 수를 이해하고 읽고 쓸 수 있다."],["4수01-13","4","수학","수와 연산","자릿값의 원리를 바탕으로 소수 두 자리 수와 소수 세 자리 수를 이해하고 읽고 쓸 수 있다."],["4수01-14","4","수학","수와 연산","소수의 크기를 비교하고 그 방법을 설명할 수 있다."],["4수01-15","4","수학","수와 연산","분모가 같은 분수의 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다."],["4수01-16","4","수학","수와 연산","소수 두 자리 수의 범위에서 소수의 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다."],["4수02-01","4","수학","변화와 관계","다양한 변화 규칙을 찾아 설명하고, 그 규칙을 수나 식으로 나타낼 수 있다."],["4수02-02","4","수학","변화와 관계","계산식의 배열에서 규칙을 찾고, 계산 결과를 추측할 수 있다."],["4수02-03","4","수학","변화와 관계","등호를 사용하여 크기가 같은 두 양의 관계를 식으로 나타낼 수 있다."],["4수03-01","4","수학","도형과 측정","직선, 선분, 반직선을 이해하고 구별할 수 있다."],["4수03-02","4","수학","도형과 측정","각과 직각을 이해하고, 직각과 비교하는 활동을 통하여 예각과 둔각을 구별할 수 있다."],["4수03-03","4","수학","도형과 측정","직선의 수직 관계와 평행 관계를 이해한다."],["4수03-04","4","수학","도형과 측정","구체물이나 평면도형의 밀기, 뒤집기, 돌리기 활동을 통하여 그 변화를 이해한다."],["4수03-05","4","수학","도형과 측정","평면에서 점의 이동에 대해 위치와 방향을 이용하여 설명할 수 있다."],["4수03-06","4","수학","도형과 측정","원의 중심, 반지름, 지름을 이해하고, 그 성질을 안다."],["4수03-07","4","수학","도형과 측정","컴퍼스를 이용하여 여러 가지 크기의 원을 그릴 수 있다."],["4수03-08","4","수학","도형과 측정","여러 가지 모양의 삼각형에 대한 분류 활동을 통하여 이등변삼각형, 정삼각형을 이해하고, 그 성질을 탐구하고 설명할 수 있다."],["4수03-09","4","수학","도형과 측정","여러 가지 모양의 삼각형에 대한 분류 활동을 통하여 직각삼각형, 예각삼각형, 둔각 삼각형을 이해한다."],["4수03-10","4","수학","도형과 측정","여러 가지 모양의 사각형에 대한 분류 활동을 통하여 직사각형, 정사각형, 사다리꼴, 평행사변형, 마름모를 이해하고, 그 성질을 탐구하고 설명할 수 있다."],["4수03-11","4","수학","도형과 측정","다각형과 정다각형을 이해한다."],["4수03-12","4","수학","도형과 측정","주어진 도형을 이용하여 여러 가지 모양을 만들거나 채우고 설명할 수 있다."],["4수03-13","4","수학","도형과 측정","1분과 1초의 관계를 이해하고, 초 단위까지 시각을 읽을 수 있다."],["4수03-14","4","수학","도형과 측정","실생활 문제 상황과 연결하여 초 단위까지의 시간의 덧셈과 뺄셈을 할 수 있다."],["4수03-15","4","수학","도형과 측정","길이 단위 1mm와 1km를 알고, 이를 이용하여 길이를 측정하고 어림하며 수학의 유용성을 인식할 수 있다."],["4수03-16","4","수학","도형과 측정","1cm와 1mm, 1km와 1m의 관계를 이해하고, 길이를 ‘몇 cm 몇 mm’와 ‘몇 mm’, ‘몇 km 몇 m’와 ‘몇 m’로 다양하게 표현할 수 있다."],["4수03-17","4","수학","도형과 측정","들이 단위 1L와 1mL를 알고, 이를 이용하여 들이를 측정하고 어림하며 수학의 유용성을 인식할 수 있다."],["4수03-18","4","수학","도형과 측정","1L와 1mL의 관계를 이해하고, 들이를 ‘몇 L 몇 mL’와 ‘몇 mL’로 표현할 수 있다."],["4수03-19","4","수학","도형과 측정","실생활 문제 상황과 연결하여 들이의 덧셈과 뺄셈을 할 수 있다."],["4수03-20","4","수학","도형과 측정","실생활에서 무게를 나타낼 때 사용하는 단위 1g과 1kg을 알고, 이를 이용하여 무게를 측정하고 어림하며 수학의 유용성을 인식할 수 있다."],["4수03-21","4","수학","도형과 측정","1kg과 1g의 관계를 이해하고, 무게를 ‘몇 kg 몇 g’과 ‘몇 g’으로 표현할 수 있다."],["4수03-22","4","수학","도형과 측정","실생활에서 무게를 나타낼 때 사용하는 단위 1t을 알고, 1t과 1kg의 관계를 이해한다."],["4수03-23","4","수학","도형과 측정","실생활 문제 상황과 연결하여 무게의 덧셈과 뺄셈을 할 수 있다."],["4수03-24","4","수학","도형과 측정","각의 크기의 단위인 1도(°)를 알고, 각도기를 이용하여 각의 크기를 측정하고 어림할 수 있다."],["4수03-25","4","수학","도형과 측정","여러 가지 방법으로 삼각형과 사각형의 내각의 크기의 합을 추론하고, 자신의 추론 과정을 설명할 수 있다."],["4수04-01","4","수학","자료와 가능성","자료를 수집하여 그림그래프나 막대그래프로 나타내고 해석할 수 있다."],["4수04-02","4","수학","자료와 가능성","자료를 수집하여 꺾은선그래프로 나타내고 해석할 수 있다."],["4수04-03","4","수학","자료와 가능성","탐구 문제를 해결하기 위해 자료를 수집, 정리하여 막대그래프나 꺾은선그래프로 나타내고 해석할 수 있다."],["6수01-01","6","수학","수와 연산","덧셈, 뺄셈, 곱셈, 나눗셈의 혼합 계산에서 계산하는 순서를 알고, 혼합 계산을 할 수 있다."],["6수01-02","6","수학","수와 연산","실생활과 연결하여 이상, 이하, 초과, 미만의 의미와 쓰임을 알고, 이를 활용하여 수의 범위를 나타낼 수 있다."],["6수01-03","6","수학","수와 연산","어림값을 구하기 위한 방법으로 올림, 버림, 반올림의 의미와 필요성을 알고, 이를 실생활에 활용함으로써 수학의 유용성을 인식할 수 있다."],["6수01-04","6","수학","수와 연산","약수, 공약수, 최대공약수를 이해하고 구할 수 있다."],["6수01-05","6","수학","수와 연산","배수, 공배수, 최소공배수를 이해하고 구할 수 있다."],["6수01-06","6","수학","수와 연산","크기가 같은 분수를 만드는 방법을 이해하고, 분수를 약분, 통분할 수 있다."],["6수01-07","6","수학","수와 연산","분모가 다른 분수의 크기를 비교하고 그 방법을 설명할 수 있다."],["6수01-08","6","수학","수와 연산","분모가 다른 분수의 덧셈과 뺄셈의 계산 원리를 탐구하고 그 계산을 할 수 있다."],["6수01-09","6","수학","수와 연산","분수의 곱셈의 계산 원리를 탐구하고 그 계산을 할 수 있다."],["6수01-10","6","수학","수와 연산","‘(자연수)÷ (자연수)’에서 나눗셈의 몫을 분수로 나타낼 수 있다."],["6수01-11","6","수학","수와 연산","분수의 나눗셈의 계산 원리를 탐구하고 그 계산을 할 수 있다."],["6수01-12","6","수학","수와 연산","분수와 소수의 관계를 이해하고 크기를 비교하며 그 방법을 설명할 수 있다."],["6수01-13","6","수학","수와 연산","소수의 곱셈의 계산 원리를 탐구하고 그 계산을 할 수 있다."],["6수01-14","6","수학","수와 연산","‘(자연수)÷ (자연수)’에서 나눗셈의 몫을 소수로 나타낼 수 있다."],["6수01-15","6","수학","수와 연산","소수의 나눗셈의 계산 원리를 탐구하고 그 계산을 할 수 있다."],["6수02-01","6","수학","변화와 관계","한 양이 변할 때 다른 양이 그에 종속하여 변하는 대응 관계를 나타낸 표에서 규칙을 찾아 설명하고, □, △ 등을 사용하여 식으로 나타낼 수 있다."],["6수02-02","6","수학","변화와 관계","두 양의 크기를 비교하는 상황을 통해 비의 개념을 이해하고, 두 양의 관계를 비로 나타낼 수 있다."],["6수02-03","6","수학","변화와 관계","비율을 이해하고, 비율을 분수, 소수, 백분율로 나타낼 수 있다."],["6수02-04","6","수학","변화와 관계","비례식을 알고, 그 성질을 이해하며, 이를 활용하여 간단한 비례식을 풀 수 있다."],["6수02-05","6","수학","변화와 관계","비례배분을 알고, 주어진 양을 비례배분 할 수 있다."],["6수03-01","6","수학","도형과 측정","도형의 합동을 이해하고, 합동인 도형의 성질을 탐구하고 설명할 수 있다."],["6수03-02","6","수학","도형과 측정","실생활과 연결하여 선대칭도형과 점대칭도형을 이해하고 그릴 수 있다."],["6수03-03","6","수학","도형과 측정","직육면체와 정육면체를 이해하고, 구성 요소와 성질을 탐구하고 설명할 수 있다."],["6수03-04","6","수학","도형과 측정","직육면체와 정육면체의 겨냥도와 전개도를 그릴 수 있다."],["6수03-05","6","수학","도형과 측정","각기둥과 각뿔을 이해하고, 구성 요소와 성질을 탐구하고 설명할 수 있다."],["6수03-06","6","수학","도형과 측정","각기둥의 전개도를 그릴 수 있다."],["6수03-07","6","수학","도형과 측정","원기둥, 원뿔, 구를 이해하고, 구성 요소와 성질을 탐구하고 설명할 수 있다."],["6수03-08","6","수학","도형과 측정","원기둥의 전개도를 그릴 수 있다."],["6수03-09","6","수학","도형과 측정","쌓기나무로 만든 입체도형을 보고 사용된 쌓기나무의 개수를 구할 수 있다."],["6수03-10","6","수학","도형과 측정","쌓기나무로 만든 입체도형의 위, 앞, 옆에서 본 모양을 표현할 수 있고, 이러한 표현을 보고 입체도형의 모양을 추측할 수 있다."],["6수03-11","6","수학","도형과 측정","평면도형의 둘레를 이해하고, 기본적인 평면도형의 둘레를 구할 수 있다."],["6수03-12","6","수학","도형과 측정","넓이 단위 1cm², 1m², 1km²를 알며, 그 관계를 이해한다."],["6수03-13","6","수학","도형과 측정","직사각형과 정사각형의 넓이를 구하는 방법을 이해하고, 이를 구할 수 있다."],["6수03-14","6","수학","도형과 측정","평행사변형, 삼각형, 사다리꼴, 마름모의 넓이를 구하는 방법을 다양하게 추론하고, 이와 관련된 문제를 해결할 수 있다."],["6수03-15","6","수학","도형과 측정","여러 가지 원 모양 물체의 원주와 지름을 측정하는 활동을 통하여, 원주율이 일정한 값임을 알고 그 근삿값을 사용할 수 있다."],["6수03-16","6","수학","도형과 측정","원주와 원의 넓이를 구하는 방법을 이해하고, 이를 구할 수 있다."],["6수03-17","6","수학","도형과 측정","직육면체와 정육면체의 겉넓이를 구하는 방법을 이해하고, 이를 구할 수 있다."],["6수03-18","6","수학","도형과 측정","부피 단위 1cm³, 1m³를 알며, 그 관계를 이해한다."],["6수03-19","6","수학","도형과 측정","직육면체와 정육면체의 부피를 구하는 방법을 이해하고, 이를 구할 수 있다."],["6수04-01","6","수학","자료와 가능성","평균의 의미를 알고, 자료를 수집하여 평균을 구하고 해석할 수 있다."],["6수04-02","6","수학","자료와 가능성","자료를 수집하여 띠그래프나 원그래프로 나타내고 해석할 수 있다."],["6수04-03","6","수학","자료와 가능성","탐구 문제를 설정하고, 그에 맞는 자료를 수집, 정리하여 적절한 그래프로 나타내고 해석할 수 있다."],["6수04-04","6","수학","자료와 가능성","사건이 일어날 가능성을 말로 표현하고 비교할 수 있다."],["6수04-05","6","수학","자료와 가능성","사건이 일어날 가능성을 수로 나타낼 수 있다."],["6수04-06","6","수학","자료와 가능성","자료를 이용하여 가능성을 예상하고, 가능성에 근거하여 적절한 판단을 내릴 수 있다."],["4과01-01","4","과학","힘과 우리 생활","일상생활에서 힘과 관련된 현상에 흥미를 갖고, 물체를 밀거나 당길 때 나타나는 현상을 관찰할 수 있다."],["4과01-02","4","과학","힘과 우리 생활","수평잡기 활동을 통해 물체의 무게를 비교할 수 있다."],["4과01-03","4","과학","힘과 우리 생활","무게를 정확히 비교하기 위해서는 저울이 필요함을 알고, 저울을 사용해 무게를 비교할 수 있다."],["4과01-04","4","과학","힘과 우리 생활","지레, 빗면과 같은 도구를 이용하면 물체를 들어 올릴 때 드는 힘의 크기가 달라짐을 알고, 도구가 일상생활에서 어떻게 쓰이는지 조사하여 공유할 수 있다."],["4과02-01","4","과학","동물의 생활","여러 가지 동물을 관찰하여 특징에 따라 동물을 분류할 수 있다."],["4과02-02","4","과학","동물의 생활","다양한 환경에 서식하는 동물을 조사하여 동물의 생김새와 생활 방식이 환경과 관련되어 있음을 설명할 수 있다."],["4과02-03","4","과학","동물의 생활","동물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품을 설계하여 협력적으로 소통할 수 있다."],["4과03-01","4","과학","식물의 생활","여러 가지 식물을 관찰하여 특징에 따라 식물을 분류할 수 있다."],["4과03-02","4","과학","식물의 생활","다양한 환경에 서식하는 식물을 조사하여 식물의 생김새와 생활 방식이 환경과 관련되어 있음을 설명할 수 있다."],["4과03-03","4","과학","식물의 생활","식물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품을 설계하여 협력적으로 소통할 수 있다."],["4과04-01","4","과학","생물의 한살이","동물의 한살이를 직접 관찰하고, 관찰한 내용을 글과 그림으로 표현할 수 있다."],["4과04-02","4","과학","생물의 한살이","식물이 자라는 데 필요한 조건을 찾는 실험을 설계하여 수행할 수 있다."],["4과04-03","4","과학","생물의 한살이","생물의 한살이 과정을 조사하여 생물에 따라 한살이의 유형이 다양함을 소개하는 자료를 만들어 공유할 수 있다."],["4과05-01","4","과학","물체와 물질","물체를 이루는 여러 가지 물질의 성질을 비교하고, 물질의 종류에 따라 물체를 분류할 수 있다."],["4과05-02","4","과학","물체와 물질","물질의 세 가지 상태인 고체, 액체, 기체의 성질을 관찰하여 비교할 수 있다."],["4과05-03","4","과학","물체와 물질","다양한 물질의 성질을 이용하여 쓰임새 있는 물체를 설계할 수 있다."],["4과06-01","4","과학","지구와 바다","지구가 대기로 둘러싸여 있음을 알고, 지구 표면을 구성하는 육지와 바다의 특징을 비교할 수 있다."],["4과06-02","4","과학","지구와 바다","바닷물의 특징을 육지의 물과 비교하고, 바닷가에서 볼 수 있는 다양한 지형을 조사할 수 있다."],["4과06-03","4","과학","지구와 바다","밀물과 썰물의 차이를 알고, 갯벌의 가치와 보전의 필요성을 설득⋅홍보할 수 있다."],["4과07-01","4","과학","소리의 성질","여러 가지 물체를 이용하여 소리를 내보고, 소리가 나는 물체는 떨림이 있음을 설명할 수 있다."],["4과07-02","4","과학","소리의 성질","큰 소리와 작은 소리, 높은 소리와 낮은 소리를 구분하고, 세기와 높낮이가 다른 소리를 낼 수 있다."],["4과07-03","4","과학","소리의 성질","여러 가지 물질을 통하여 소리가 전달되는 것을 관찰하고, 소음을 줄이는 방법을 찾아 일상생활에서 실천할 수 있다."],["4과08-01","4","과학","감염병과 건강한 생활","생활 속 감염병의 사례를 알고, 다양한 질병과 그 위험성에 대해 토의할 수 있다."],["4과08-02","4","과학","감염병과 건강한 생활","감염병으로부터 안전한 사회에 관심을 가지고, 여러 감염 과정을 통해 생활 습관과 감염병 유행과의 연관성을 설명할 수 있다."],["4과08-03","4","과학","감염병과 건강한 생활","건강한 생활을 위해 필요한 감염병 예방 수칙을 공유하고, 생활 속에서 실천할 수 있다."],["4과09-01","4","과학","자석의 이용","자석과 여러 가지 물체를 가까이했을 때 나타나는 현상을 관찰하고, 자석과 자석에 붙는 물체 사이에 작용하는 힘의 특징을 말할 수 있다."],["4과09-02","4","과학","자석의 이용","자석과 자석을 가까이했을 때 나타나는 현상을 관찰하여 그 특징을 자석의 극과 관련지어 설명할 수 있다."],["4과09-03","4","과학","자석의 이용","자석을 이용하여 일상생활을 편리하게 하는 장치를 설계할 수 있다."],["4과10-01","4","과학","물의 상태 변화","물이 세 가지 상태로 변할 수 있음을 알고, 우리 주변에서 예를 찾을 수 있다."],["4과10-02","4","과학","물의 상태 변화","물이 얼 때, 얼음이 녹을 때, 물이 증발할 때와 끓을 때, 수증기가 응결할 때의 변화를 관찰할 수 있다."],["4과10-03","4","과학","물의 상태 변화","물의 상태 변화를 이용하여 물을 얻을 수 있는 장치를 설계하고 만들 수 있다."],["4과11-01","4","과학","땅의 변화","흐르는 물의 작용과 강 주변 지형의 특징을 관련지을 수 있다."],["4과11-02","4","과학","땅의 변화","화산의 의미와 화산 활동으로 나오는 물질을 알고, 화산 활동을 모형으로 표현할 수 있다."],["4과11-03","4","과학","땅의 변화","화성암을 관찰하고 분류할 수 있다."],["4과11-04","4","과학","땅의 변화","화산 활동과 지진이 우리 생활에 미치는 영향을 조사하여, 대처 방법을 실천할 수 있다."],["4과12-01","4","과학","다양한 생물과 우리 생활","균류⋅원생생물⋅세균을 관찰하여 특징과 사는 곳을 설명할 수 있다."],["4과12-02","4","과학","다양한 생물과 우리 생활","균류⋅원생생물⋅세균이 우리 생활에 미치는 영향을 조사하여 발표할 수 있다."],["4과12-03","4","과학","다양한 생물과 우리 생활","우리 생활에 생명과학이 이용되는 사례를 소개하는 자료를 만들어 공유할 수 있다."],["4과13-01","4","과학","밤하늘 관찰","달의 모양과 표면, 달의 위상변화를 관찰하여 밤하늘 관찰에 흥미를 가질 수 있다."],["4과13-02","4","과학","밤하늘 관찰","태양계 구성원을 알고, 태양과 행성을 조사할 수 있다."],["4과13-03","4","과학","밤하늘 관찰","별의 정의를 알고, 북극성 주변의 별자리를 관찰할 수 있다."],["4과14-01","4","과학","생물과 환경","생태계의 구성 요소를 조사하여 생물 요소와 비생물 요소로 분류할 수 있다."],["4과14-02","4","과학","생물과 환경","생물 요소들의 먹고 먹히는 관계를 조사하여 먹이그물로 표현할 수 있다."],["4과14-03","4","과학","생물과 환경","인간 활동이 생태계에 미치는 영향을 조사하고, 생태계 보전을 위해 우리가 할 수 있는 일을 토의하여 실천할 수 있다."],["4과15-01","4","과학","여러 가지 기체","실험을 통해 기체가 무게가 있음을 설명할 수 있다."],["4과15-02","4","과학","여러 가지 기체","온도나 압력에 따라 기체의 부피가 달라지는 현상을 관찰하고, 우리 주변에서 예를 찾을 수 있다."],["4과15-03","4","과학","여러 가지 기체","일상생활에서 이용되는 기체의 종류와 성질을 조사하고, 여러 가지 기체에 대해 흥미를 느낄 수 있다."],["4과15-04","4","과학","여러 가지 기체","기체의 성질을 이용하여 작동시킬 수 있는 장치를 설계하고 만들 수 있다."],["4과16-01","4","과학","기후변화와 우리 생활","기후변화 현상의 예를 알고, 기후변화가 인간의 활동과 관련되어 있음을 토의할 수 있다."],["4과16-02","4","과학","기후변화와 우리 생활","기후변화의 심각성에 관심을 가지고, 기후변화가 우리 생활과 환경에 미치는 영향을 설명할 수 있다."],["4과16-03","4","과학","기후변화와 우리 생활","기후변화 대응 방법을 조사하고, 생활 속에서 기후변화 대응 방법을 실천할 수 있다."],["6과01-01","6","과학","지층과 화석","지층의 특징을 알고, 지층의 형성 과정을 모형으로 표현할 수 있다."],["6과01-02","6","과학","지층과 화석","지층이 퇴적암으로 이루어짐을 알고, 퇴적암을 알갱이의 크기에 따라 분류할 수 있다."],["6과01-03","6","과학","지층과 화석","화석의 생성 과정을 모형으로 설명하고, 지구의 과거 생물과 환경을 추리하는 활동을 통해 화석의 가치를 인식할 수 있다."],["6과02-01","6","과학","빛의 성질","물체를 보기 위해서 빛이 있어야 함을 알고, 빛의 성질에 대해 흥미를 느낄 수 있다."],["6과02-02","6","과학","빛의 성질","빛이 나아가는 현상을 관찰하여 빛이 직진, 반사, 굴절하는 성질이 있음을 말할 수 있다."],["6과02-03","6","과학","빛의 성질","거울과 렌즈의 쓰임새를 조사하고 거울이나 렌즈를 이용한 장치를 창의적으로 만들 수 있다."],["6과03-01","6","과학","용해와 용액","용해 현상의 의미를 알고, 용질의 종류와 물의 온도에 따라 물에 녹는 용질의 양이 달라짐을 비교할 수 있다."],["6과03-02","6","과학","용해와 용액","용질이나 용매의 양에 따라 용액의 진하기가 달라짐을 관찰하고, 용액의 상대적인 진하기를 비교할 수 있다."],["6과03-03","6","과학","용해와 용액","일상생활에서 용액이 쓰이는 사례를 조사하여 용액의 필요성을 알리는 자료를 만들고 공유할 수 있다."],["6과04-01","6","과학","우리 몸의 구조와 기능","뼈와 근육의 생김새를 관찰하고 모형을 만들어 몸이 움직이는 원리를 설명할 수 있다."],["6과04-02","6","과학","우리 몸의 구조와 기능","소화, 순환, 호흡, 배설 기관의 구조와 기능을 알아보고, 우리 몸의 여러 기관이 서로 관련되어 있음을 설명할 수 있다."],["6과04-03","6","과학","우리 몸의 구조와 기능","우리 몸의 여러 기관과 관련된 질병을 조사하고, 건강을 유지하기 위한 생활 방식을 실천할 수 있다."],["6과05-01","6","과학","혼합물의 분리","알갱이의 크기가 다른 고체 혼합물과 골고루 섞이지 않는 액체 혼합물을 분리할 수 있다."],["6과05-02","6","과학","혼합물의 분리","물에 용해되는 성질을 이용하여 고체 혼합물을 분리하고, 물을 증발시켜 물에 용해된 고체 물질을 분리할 수 있다."],["6과05-03","6","과학","혼합물의 분리","지속가능한 삶을 위한 과학기술 사례 중 혼합물의 분리를 이용한 장치를 조사하여 공유할 수 있다."],["6과06-01","6","과학","날씨와 우리 생활","기상 요소를 조사하고, 날씨가 우리 생활에 주는 영향을 인식할 수 있다."],["6과06-02","6","과학","날씨와 우리 생활","이슬, 안개, 구름을 관찰하고, 공통점과 차이점을 찾을 수 있다."],["6과06-03","6","과학","날씨와 우리 생활","고기압과 저기압의 분포에 따른 날씨의 특징을 기상 요소로 표현할 수 있다."],["6과07-01","6","과학","열과 우리 생활","물체의 따뜻하고 차가운 정도를 온도로 표현함을 알고, 온도계를 이용하여 온도를 측정할 수 있다."],["6과07-02","6","과학","열과 우리 생활","온도가 다른 두 물체가 접촉했을 때 두 물체의 온도 변화를 관찰하고 그 원인을 추리할 수 있다."],["6과07-03","6","과학","열과 우리 생활","주위에서 열의 이동으로 나타나는 현상을 관찰하여 열의 이동 방식이 다양함을 설명할 수 있다."],["6과07-04","6","과학","열과 우리 생활","일상생활에서 단열을 이용하는 사례를 조사하고, 온도를 오랫동안 일정하게 유지할 수 있는 장치를 창의적으로 만들 수 있다."],["6과08-01","6","과학","자원과 에너지","우리가 생활에서 이용하는 다양한 자원을 조사하고, 자원의 유한함을 설명할 수 있다."],["6과08-02","6","과학","자원과 에너지","재생에너지의 종류를 조사하고, 에너지를 지속가능하게 이용하는 방법에 관심을 갖는다."],["6과08-03","6","과학","자원과 에너지","자원과 에너지의 효율적인 이용 방법에 대해 탐색하고, 생활 속에서 실천할 수 있는 다양한 사례를 공유할 수 있다."],["6과09-01","6","과학","산과 염기","여러 가지 용액에 지시약을 넣었을 때의 변화를 관찰하여 용액을 산성 용액과 염기성 용액으로 분류할 수 있다."],["6과09-02","6","과학","산과 염기","산성 용액과 염기성 용액의 성질을 관찰하고, 산성 용액과 염기성 용액을 섞을 때 용액의 성질 변화를 실험을 통해 추론할 수 있다."],["6과09-03","6","과학","산과 염기","우리 주변에서 산성 용액과 염기성 용액을 이용하는 예를 찾아서 설명할 수 있다."],["6과09-04","6","과학","산과 염기","산성화로 인한 환경의 피해 사례를 소개하는 자료를 만들고 공유할 수 있다."],["6과10-01","6","과학","물체의 운동","운동하는 물체는 시간에 따라 위치가 변화함을 알고 그 변화를 표현할 수 있다."],["6과10-02","6","과학","물체의 운동","물체의 이동 거리와 걸린 시간을 측정하여 속력을 구하고 빠르기를 비교할 수 있다."],["6과10-03","6","과학","물체의 운동","속력과 관련된 안전 수칙과 안전장치를 조사한 결과를 공유하고 일상생활에서 교통안전을 실천할 수 있다."],["6과11-01","6","과학","식물의 구조와 기능","생물을 이루고 있는 기본 단위인 세포를 현미경으로 관찰할 수 있다."],["6과11-02","6","과학","식물의 구조와 기능","식물의 각 기관의 구조를 관찰하고, 기능을 알아보는 실험을 수행하여 식물 각 기관의 구조와 기능을 설명할 수 있다."],["6과11-03","6","과학","식물의 구조와 기능","여러 가지 식물의 특징을 설명하는 자료를 만들어 공유할 수 있다."],["6과12-01","6","과학","지구의 운동","하루 동안 태양과 별을 관찰하여 위치 변화의 규칙성을 찾을 수 있다."],["6과12-02","6","과학","지구의 운동","지구의 자전을 알고, 낮과 밤이 생기는 이유를 설명할 수 있다."],["6과12-03","6","과학","지구의 운동","지구의 공전을 알고, 계절에 따라 달라지는 별자리를 관찰할 수 있다."],["6과13-01","6","과학","계절의 변화","태양 고도 측정기로 하루 동안 태양 고도, 그림자 길이, 기온을 측정하여 이들의 관계를 찾을 수 있다."],["6과13-02","6","과학","계절의 변화","계절에 따른 태양의 남중 고도와 낮의 길이 사이의 관계를 자료에 근거하여 추론할 수 있다."],["6과13-03","6","과학","계절의 변화","계절 변화의 원인을 지구의 자전축이 기울어진 채 공전하는 것으로 설명할 수 있다."],["6과14-01","6","과학","물질의 연소","물질의 성질이 달라지는 변화와 달라지지 않는 변화를 관찰하여 비교할 수 있다."],["6과14-02","6","과학","물질의 연소","물질이 연소할 때 나타나는 공통적인 현상을 관찰하고, 연소의 조건을 찾을 수 있다."],["6과14-03","6","과학","물질의 연소","연소 전과 후의 물질을 비교하여 연소 과정에서 물질의 성질이 달라짐을 설명할 수 있다."],["6과14-04","6","과학","물질의 연소","연소 과정에서 생성되는 물질로 인한 생태계의 피해 사례를 수집하고 분석하여 해결책을 제안하고 공유할 수 있다."],["6과15-01","6","과학","전기의 이용","전지와 전구, 전선을 연결하여 전구에 불을 켜보고, 불이 켜지는 전기 회로의 특징을 말할 수 있다."],["6과15-02","6","과학","전기의 이용","전지 한 개를 연결한 전기 회로와 전지 두 개를 직렬연결한 전기 회로의 특징을 비교할 수 있다."],["6과15-03","6","과학","전기의 이용","전자석을 만들어 전자석의 성질을 탐색하고 전자석이 사용되는 예를 조사할 수 있다."],["6과15-04","6","과학","전기의 이용","전기를 효율적이고 안전하게 사용하는 방법을 조사하여 실천 계획을 세우고 일상생활에서 실천할 수 있다."],["6과16-01","6","과학","과학과 나의 진로","미래 사회에 일어날 수 있는 문제를 조사하고, 문제를 해결하는 데 과학이 기여할 수 있는 방법을 토의할 수 있다."],["6과16-02","6","과학","과학과 나의 진로","다양한 진로가 과학과 관련됨을 알고, 자신의 진로를 과학과 관련지어 설명할 수 있다."],["6실01-01","6","실과","인간 발달과 주도적 삶","아동기의 발달 특징을 이해하고 성장발달에 필요한 조건과 방법을 탐색한다."],["6실01-02","6","실과","인간 발달과 주도적 삶","건강한 발달을 위한 자기 관리 방법을 탐색하고, 일상생활 속에서 올바른 생활습관과 태도를 갖도록 계획하여 실천한다."],["6실01-03","6","실과","인간 발달과 주도적 삶","건강한 가정생활을 위해 가족원 모두에게 다양한 요구가 있음을 이해하여 서로에 대한 배려와 돌봄을 실천한다."],["6실01-04","6","실과","인간 발달과 주도적 삶","균형 잡힌 식사의 중요성과 조건을 탐색하여 자신의 식습관을 검토해 보고 건강한 식습관 형성에 적용한다."],["6실01-05","6","실과","인간 발달과 주도적 삶","옷의 기능을 이해하여 평소 자신의 옷차림을 살펴보고 건강하고 적절한 옷 입기를 실천한다."],["6실01-06","6","실과","인간 발달과 주도적 삶","가정일을 수행하는 과정에서 일의 가치와 중요성을 이해하고, 가정생활을 유지하는 데 필요한 가정일의 종류를 탐색한다."],["6실01-07","6","실과","인간 발달과 주도적 삶","직업의 필요성을 이해하고 적성, 흥미, 성격에 따라 진로 발달 계획을 세우고 주도적으로 탐색한다."],["6실02-01","6","실과","생활환경과 지속가능한 선택","시간이나 용돈과 같은 생활자원이 제한되어 있음을 이해하고, 생활자원의 사용가치를 높이는 방법을 탐색한다."],["6실02-02","6","실과","생활환경과 지속가능한 선택","생활자원 관리의 필요성을 인식하고, 생활자원의 합리적인 보관과 활용방법을 익힌다."],["6실02-03","6","실과","생활환경과 지속가능한 선택","생활자원의 올바른 사용이 가정과 환경에 도움이 됨을 이해하고 재활용, 재사용 등 환경을 고려한 관리 방법을 실천한다."],["6실02-04","6","실과","생활환경과 지속가능한 선택","식재료 생산과 선택의 중요성을 인식하고 여러 식재료의 고유하고 다양한 맛을 경험하여 자신의 식사에 적용한다."],["6실02-05","6","실과","생활환경과 지속가능한 선택","음식의 조리과정을 체험하여 자기 간식이나 식사를 스스로 마련하는 식생활을 실천한다."],["6실02-06","6","실과","생활환경과 지속가능한 선택","우리나라 밥상차림을 이해하고, 함께 식사하는 즐거움을 경험하면서 이 과정에서 식사 예절을 실천한다."],["6실02-07","6","실과","생활환경과 지속가능한 선택","의생활 용품이 만들어지는 과정을 탐색하여 옷이나 생활용품이 어떻게 구성되는지를 설명한다."],["6실02-08","6","실과","생활환경과 지속가능한 선택","다양한 도구와 재료를 활용하여 간단한 생활용품을 만들어 보면서 직접 만들어 쓰는 즐거움과 창의적 태도를 가진다."],["6실02-09","6","실과","생활환경과 지속가능한 선택","간단한 옷의 수선 등 의생활과 관련된 문제를 스스로 해결하려는 태도를 가진다."],["6실02-10","6","실과","생활환경과 지속가능한 선택","자신의 생활공간을 쾌적하고 위생적으로 관리하는 것의 중요성을 알고, 정리정돈과 청소 및 쓰레기 처리의 방법을 익혀 실천한다."],["6실02-11","6","실과","생활환경과 지속가능한 선택","생태 지향적 삶을 위해 자신의 의식주 생활에서 할 수 있는 구체적인 행동을 계획하여 실천한다."],["6실03-01","6","실과","기술적 문제해결과 혁신","발명의 의미를 이해하고, 일상생활을 바꾼 발명품을 탐색하여 발명과 기술에 대한 중요성과 가치를 인식한다."],["6실03-02","6","실과","기술적 문제해결과 혁신","발명사고기법과 기술적 문제 해결 과정을 이해하고, 다양한 재료를 활용하여 생활 속 문제를 해결할 수 있는 창의적인 제품을 구상하고 만들어 봄으로써 실천적 태도를 갖는다."],["6실03-03","6","실과","기술적 문제해결과 혁신","발명과 특허의 관계를 이해하고, 특허 침해 사례를 통하여 지식재산권의 중요성을 인식하여 올바른 방법으로 활용한다."],["6실03-04","6","실과","기술적 문제해결과 혁신","수송의 의미와 수송 수단의 발달과정에 대한 이해를 바탕으로 생활 속 다양한 수송 수단을 탐색한다."],["6실03-05","6","실과","기술적 문제해결과 혁신","수송 수단의 구성 요소를 이해하고, 친환경 에너지를 적용한 다양한 수송 수단의 시제품을 만들어 수송기술의 가치를 인식한다."],["6실04-01","6","실과","지속가능한 기술과 융합","친환경 건설 구조물을 이해하고, 생활 속 건설 구조물을 탐색하여 간단한 구조물을 체험하면서 건설기술에 대한 가치를 인식한다."],["6실04-02","6","실과","지속가능한 기술과 융합","생활 속 디지털 기술의 중요성을 이해하고, 디지털 기기와 디지털 콘텐츠 저작 도구를 사용하여 발표 자료를 만들어 보면서 디지털 기기의 활용 능력을 기른다."],["6실04-03","6","실과","지속가능한 기술과 융합","제작한 발표 자료를 사이버 공간에 공유하고, 건전한 정보기기의 활용을 실천한다."],["6실04-04","6","실과","지속가능한 기술과 융합","로봇의 개념과 구조를 이해하고, 생활 속 로봇 기능을 체험하여 로봇의 중요성을 인식한다."],["6실04-05","6","실과","지속가능한 기술과 융합","로봇의 종류와 활용 사례를 통해 작동 원리를 이해하고, 로봇에 대한 관심과 흥미를 가진다."],["6실04-06","6","실과","지속가능한 기술과 융합","로봇의 융합 기술을 이해하고, 간단한 로봇을 만들어 코딩과 프로그램을 적용하여 동작 시키는 체험을 통해 융합 기술의 가치를 인식하다."],["6실04-07","6","실과","지속가능한 기술과 융합","생활 속 동식물 자원을 활용 목적에 따라 분류하고 이와 관련된 다양한 생명기술을 탐색한다."],["6실04-08","6","실과","지속가능한 기술과 융합","생활 속 동식물을 기르고 가꾸는 방법을 알고, 동식물을 기르고 가꾸는 체험을 통해 생태존중감을 가진다."],["6실04-09","6","실과","지속가능한 기술과 융합","동식물 자원의 친환경 농업 사례를 통해 지속가능한 농업이 순환되고 있음을 인식하고 농업의 미래가치를 인식한다."],["6실04-10","6","실과","지속가능한 기술과 융합","생활 속에서 농업활동과 관련된 모습을 분석하고 이에 따른 농업활동을 체험하여 농업에 대한 관심을 두고 이를 생활 속에서 실천한다."],["6실04-11","6","실과","지속가능한 기술과 융합","농업과 농촌의 다원적인 역할과 가치를 이해하고 미래 농업과 관련된 다양한 직업 세계를 탐색한다."],["6실05-01","6","실과","디지털 사회와 인공지능","컴퓨터를 활용한 생활 속 문제해결 사례를 탐색하고 일상생활 속 문제를 해결하기 위한 알고리즘을 다양한 방법으로 표현한다."],["6실05-02","6","실과","디지털 사회와 인공지능","컴퓨터에게 명령하는 방법을 체험하고, 주어진 문제를 해결하는 프로그램을 작성한다."],["6실05-03","6","실과","디지털 사회와 인공지능","실생활의 문제를 해결하는 프로그램을 협력하여 작성하고, 산출물을 타인과 공유한다."],["6실05-04","6","실과","디지털 사회와 인공지능","디지털 데이터와 아날로그 데이터의 특징을 이해하고, 인공지능에 활용할 수 있는 데이터의 유형이나 형태를 탐색한다."],["6실05-05","6","실과","디지털 사회와 인공지능","인공지능이 만들어지는 과정을 체험하고, 인공지능이 사회에 미치는 영향을 탐색한다."],["4체01-01","4","체육","운동","운동과 체력의 의미를 이해하고 관계를 파악한다."],["4체01-02","4","체육","운동","기본 체력운동의 방법과 절차를 익히며 자신의 수준에 맞는 운동을 시도한다."],["4체01-03","4","체육","운동","운동과 건강의 의미를 이해하고 관계를 파악한다."],["4체01-04","4","체육","운동","건강을 위한 바른 생활 습관을 이해하고 생활 속에서 규칙적으로 실천한다."],["4체01-05","4","체육","운동","자신의 신체적 특징을 긍정적으로 인식하고 운동 계획을 세워 안전하게 활동한다."],["4체01-06","4","체육","운동","운동과 건강한 생활 습관 형성에 관심을 갖고 적극적으로 실천한다."],["4체02-01","4","체육","스포츠","스포츠의 의미와 유형을 파악한다."],["4체02-02","4","체육","스포츠","기본 움직임 기술의 의미와 종류를 이해하고 스 1-09","6","영어","이해","시, 노래, 이야기를 공감하며 듣거나 읽는다."],["6영01-10","6","영어","이해","일상생활 주제나 문화에 관한 담화나 글을 포용의 태도로 듣거나 읽는다."],["6영02-01","6","영어","표현","간단한 단어, 어구, 문장을 강세, 리듬, 억양에 맞게 말한다."],["6영02-02","6","영어","표현","실물, 그림, 동작 등을 보고 간단한 단어, 어구, 문장으로 말하거나 쓴다."],["6영02-03","6","영어","표현","알파벳 대소문자와 문장 부호를 문장에서 바르게 사용한다."],["6영02-04","6","영어","표현","주변 사람이나 사물을 간단한 문장으로 소개하거나 묘사한다."],["6영02-05","6","영어","표현","주변 장소나 위치, 행동 순서나 방법을 간단한 문장으로 설명한다."],["6영02-06","6","영어","표현","자신의 감정이나 의견, 경험이나 계획을 간단한 문장으로 표현한다."],["6영02-07","6","영어","표현","일상생활 주제에 관한 담화나 글의 세부 정보를 간단한 문장으로 묻거나 답한다."],["6영02-08","6","영어","표현","예시문을 참고하여 목적에 맞는 간단한 글을 쓴다."],["6영02-09","6","영어","표현","적절한 매체와 전략을 활용하여 창의적으로 의미를 생성하고 표현한다."],["6영02-10","6","영어","표현","의사소통 활동에 흥미와 자신감을 가지고 참여하여 협력적으로 수행한다."],["9국01-01","9","국어","듣기⋅말하기","화자의 의도와 관점을 추론하며 듣는다."],["9국01-02","9","국어","듣기⋅말하기","설득 전략을 비판적으로 분석하며 듣는다."],["9국01-03","9","국어","듣기⋅말하기","담화 공동체에 따른 듣기⋅말하기 방식의 다양성을 고려하여 듣고 말한다."],["9국01-04","9","국어","듣기⋅말하기","상대의 말을 경청하고 상대의 감정과 입장에 공감하는 반응을 보이며 대화한다."],["9국01-05","9","국어","듣기⋅말하기","면담의 다양한 목적과 상대를 고려하여 질문을 점검하고 효과적으로 면담한다."],["9국01-06","9","국어","듣기⋅말하기","다양한 자료를 재구성하여 내용을 체계적으로 조직하고 청중이 이해하기 쉽게 발표한다."],["9국01-07","9","국어","듣기⋅말하기","토의에서 다양한 의견을 교환하여 대안을 마련하고 문제를 해결한다."],["9국01-08","9","국어","듣기⋅말하기","토론에서 반론을 고려하여 타당한 논증을 구성하고 논리적으로 반박한다."],["9국01-09","9","국어","듣기⋅말하기","서로의 감정이나 바라는 바를 진솔하게 표현하면서 갈등을 조정한다."],["9국01-10","9","국어","듣기⋅말하기","언어폭력의 문제점을 성찰하고, 서로를 존중하는 표현을 사용하여 말한다."],["9국01-11","9","국어","듣기⋅말하기","듣기⋅말하기 과정을 점검하고 듣기⋅말하기의 어려움을 효과적으로 조정한다."],["9국02-01","9","국어","읽기","읽기는 사회⋅문화적 맥락에서 의미를 구성하는 과정임을 이해하며 사회적 독서에 참여하고 사회적 독서 문화 형성에 기여한다."],["9국02-02","9","국어","읽기","읽기 목적과 글의 구조를 고려하며 글을 효과적으로 요약한다."],["9국02-03","9","국어","읽기","독자의 배경지식과 글에 나타난 정보 등을 활용하여 글에 드러나지 않은 의도나 관점을 추론하며 읽는다."],["9국02-04","9","국어","읽기","복합양식으로 구성된 글이나 자료의 내용 타당성과 신뢰성, 표현 방법의 적절성을 평가하며 읽는다."],["9국02-05","9","국어","읽기","글에 사용된 다양한 설명 방법과 논증 방법을 파악하고, 그 타당성을 평가하며 읽는다."],["9국02-06","9","국어","읽기","동일한 화제를 다룬 여러 글이나 자료를 주제 통합적으로 읽는다."],["9국02-07","9","국어","읽기","진로나 관심 분야에 대한 다양한 책이나 자료를 스스로 찾아 읽는다."],["9국02-08","9","국어","읽기","자신의 독서 상황과 수준에 맞는 글을 선정하고 읽기 과정을 점검⋅조정하며 읽는다."],["9국03-01","9","국어","쓰기","대상의 특성에 적합한 설명 방법을 활용하여 글을 쓴다."],["9국03-02","9","국어","쓰기","복수의 자료를 활용하여 다양한 형식으로 정보를 전달하는 글을 쓴다."],["9국03-03","9","국어","쓰기","주장을 뒷받침할 수 있는 타당한 근거를 들고 적절한 표현을 사용하여 주장하는 글을 쓴다."],["9국03-04","9","국어","쓰기","의견 차이가 있는 사안에 대해 자료를 수집하고 사회⋅문화적 맥락을 고려하며 주장하는 글을 쓴다."],["9국03-05","9","국어","쓰기","자신의 삶과 경험을 바탕으로 정서를 진솔하게 표현하는 글을 쓴다."],["9국03-06","9","국어","쓰기","다양한 표현을 활용하여 자신의 생각과 느낌이 드러나는 글을 쓰고 독자와 공유한다."],["9국03-07","9","국어","쓰기","복합양식 자료를 활용하여 내용을 생성하고 글의 유형을 고려하여 내용을 조직하며 글을 쓴다."],["9국03-08","9","국어","쓰기","쓰기 과정과 전략을 점검⋅조정하며 글을 쓰고, 독자를 고려하여 글을 고쳐 쓴다."],["9국03-09","9","국어","쓰기","언어 공동체의 구성원인 필자로서 자신에 대해 성찰하며, 윤리적 소통 문화를 형성하는 데에 기여한다."],["9국04-01","9","국어","문법","국어의 음운 체계와 문자 체계를 이해하고 국어생활에 활용한다."],["9국04-02","9","국어","문법","단어의 짜임을 분석하여 새말 형성의 원리를 이해한다."],["9국04-03","9","국어","문법","품사의 종류와 특성을 이해하고 국어 자료를 분석한다."],["9국04-04","9","국어","문법","문장의 짜임을 이해하고 표현 효과를 고려하여 문장을 구성한다."],["9국04-05","9","국어","문법","피동 표현과 인용 표현의 의도와 효과를 분석하고 상황에 맞게 활용한다."],["9국04-06","9","국어","문법","한글 맞춤법의 기본 원리와 내용을 이해하고 국어생활에 적용한다."],["9국04-07","9","국어","문법","세대⋅분야⋅매체에 따른 어휘의 양상과 쓰임을 분석하고 다양한 집단과 사회의 언어에 관용적 태도를 지닌다."],["9국04-08","9","국어","문법","자신과 주변의 다양한 국어 실천 양상을 비판적으로 분석하여 언어와 자아 및 세계 사이의 관계를 인식한다."],["9국05-01","9","국어","문학","운율, 비유, 상징의 특성과 효과에 유의하며 작품을 감상하고 창작한다."],["9국05-02","9","국어","문학","갈등의 진행과 해결 과정을 파악하며 작품을 감상한다."],["9국05-03","9","국어","문학","인간의 성장을 다룬 작품을 읽으며 문학의 가치를 내면화한다."],["9국05-04","9","국어","문학","보는 이나 말하는 이의 특성과 효과를 파악하며 작품을 감상한다."],["9국05-05","9","국어","문학","작품에 반영된 사회⋅문화적 상황을 이해하며 작품을 감상한다."],["9국05-06","9","국어","문학","자신의 경험을 개성적인 발상과 표현으로 형상화한다."],["9국05-07","9","국어","문학","연관성이 있는 다른 작품들과의 관계를 파악하며 작품을 감상한다."],["9국05-08","9","국어","문학","근거를 바탕으로 작품을 해석하고, 다른 해석들과 비교하여 자신의 해석을 평가한다."],["9국05-09","9","국어","문학","문학을 통해 타자를 이해하고 공동체의 문제에 참여하는 태도를 지닌다."],["9국06-01","9","국어","매체","대중매체와 개인 인터넷 방송의 특성과 영향력을 비교한다."],["9국06-02","9","국어","매체","소통 맥락과 수용자 참여 양상을 고려하여 상호 작용적 매체를 분석한다."],["9국06-03","9","국어","매체","복합양식성을 고려하여 영상 매체 자료를 제작하고 공유한다."],["9국06-04","9","국어","매체","매체 소통에서의 권리와 책임을 이해하고, 수용자의 반응을 고려하며 매체 자료의 제작 과정을 성찰한다."],["9국06-05","9","국어","매체","매체 자료의 재현 방식을 이해하고 광고나 홍보물을 분석한다."],["9국06-06","9","국어","매체","사회⋅문화적 맥락을 고려하여 매체 자료의 공정성을 평가한다."],["9사(지리)01-01","9","사회","세계화 시대, 지리의 힘","세계 여러 지역의 특성을 해당 지역의 위치와 자연⋅인문환경을 고려하여 추론한다."],["9사(지리)01-02","9","사회","세계화 시대, 지리의 힘","다양한 스케일에서 지역이 서로 연계되어 있음을 공간적 상호 작용의 사례를 통해 파악한다."],["9사(지리)01-03","9","사회","세계화 시대, 지리의 힘","세계의 변화가 지역에 영향을 미치고 지역의 변화가 세계에 영향을 미치는 사례를 조사한다."],["9사(지리)02-01","9","사회","아시아","다양한 지리 정보와 매체를 활용하여 아시아의 국가와 주요 도시의 위치를 파악하고 자연환경의 특성을 지도로 표현한다."],["9사(지리)02-02","9","사회","아시아","종교와 관련된 아시아의 다양한 문화경관과 생활양식을 파악하고, 세계시민으로서 문화 다양성에 대한 이해와 수용성을 높인다."],["9사(지리)02-03","9","사회","아시아","아시아의 인구 특징을 파악하고 지역별 인구 구조 변화를 비교하여 지역 발전의 가능성 및 변화 모습을 추론한다."],["9사(지리)02-04","9","사회","아시아","글로컬 관점에서 아시아의 산업 특징과 변화를 파악하고, 이것이 우리나라 산업에 미치는 영향을 탐색한다."],["9사(지리)03-01","9","사회","유럽","다양한 지리 정보와 매체를 활용하여 유럽의 국가와 주요 도시의 위치를 파악하고 자연환경의 특성을 지도로 표현한다."],["9사(지리)03-02","9","사회","유럽","다양한 유형의 유럽 도시를 탐색하고, 기후위기에 대응하여 지속가능한 도시를 만들기 위한 노력을 조사한다."],["9사(지리)03-03","9","사회","유럽","지역 간 역학관계에 따른 유럽의 통합과 분리의 움직임이 유럽연합의 변화와 주민 생활에 미치는 영향을 탐색한다."],["9사(지리)04-01","9","사회","아프리카","다양한 지리 정보와 매체를 활용하여 아프리카의 국가와 주요 도시의 위치를 파악하고 자연환경의 특성을 지도로 표현한다."],["9사(지리)04-02","9","사회","아프리카","아프리카의 지리적 특성에 기반한 다양한 문화와 지역 잠재력을 탐구하고, 아프리카에 대한 자신의 인식을 성찰한다."],["9사(지리)04-03","9","사회","아프리카","지속가능한 발전을 위한 아프리카 각 지역의 노력과 세계 다양한 주체들의 협력 사례를 조사하고, 세계시민으로서 우리가 참여할 수 있는 방안을 모색한다."],["9사(지리)05-01","9","사회","아메리카","다양한 지리 정보와 매체를 활용하여 아메리카의 국가와 주요 도시의 위치를 파악하고 자연환경의 특성을 지도로 표현한다."],["9사(지리)05-02","9","사회","아메리카","다양한 민족(인종)으로 구성된 아메리카의 인구 특징을 살펴보고, 사례를 들어 아메리카의 문화 혼종성을 설명한다."],["9사(지리)05-03","9","사회","아메리카","초국적 기업의 글로벌 생산체제에 대한 이해를 바탕으로, 초국적 기업의 아메리카 지역 내 입지와 해외 이전의 이유, 그에 따른 해당 지역의 변화를 분석한다."],["9사(지리)06-01","9","사회","오세아니아와 극지방","다양한 지리 정보와 매체를 활용하여 오세아니아의 국가와 주요 도시의 위치, 자연환경의 특성을 파악하고, 자원 수출을 중심으로 세계 다른 지역과의 상호연계성을 탐색한다."],["9사(지리)06-02","9","사회","오세아니아와 극지방","태평양 지역이 겪고 있는 환경 문제를 조사하고 그 해결에 참여할 수 있는 방안을 제안한다."],["9사(지리)06-03","9","사회","오세아니아와 극지방","극지방의 지리적 중요성과 지역 개발을 둘러싼 다양한 이해관계를 살펴보고, 이에 대한 자신과 상대방의 의견을 비판적으로 검토한다."],["9사(지리)07-01","9","사회","대한민국, 우리가 살아가는 곳","우리 국토의 위치와 영역에 대한 이해를 바탕으로 세계 속에서 우리나라의 위치를 지정학, 지경학적 측면에서 탐색한다."],["9사(지리)07-02","9","사회","대한민국, 우리가 살아가는 곳","우리나라 행정구역과 주요 도시의 위치를 파악하고, 자신이 살고 있는 곳의 장소성과 장소감을 표현한다."],["9사(지리)07-03","9","사회","대한민국, 우리가 살아가는 곳","다양한 지리 정보와 매체를 활용하여 우리 지역의 문제를 선정하고 지리적으로 시 각화한다."],["9사(지리)08-01","9","사회","우리나라의 자연환경과 인간 생활","우리나라 주요 산지⋅하천⋅해안 지형의 위치와 특성을 파악하고, 매력적인 지형 경관을 탐색하여 우리 국토의 아름다움을 느낀다."],["9사(지리)08-02","9","사회","우리나라의 자연환경과 인간 생활","우리나라의 계절별, 지역별 기후 특성 및 변화 양상을 파악하고, 기후변화에 대한 지역별 대응 노력을 조사한다."],["9사(지리)08-03","9","사회","우리나라의 자연환경과 인간 생활","우리나라 자연재해의 지리적 특성과 피해 최소화를 위한 노력을 파악하고, 일상생활 속 다양한 상황에서 자연재해 발생 시 자신의 대처 방안을 탐색한다."],["9사(지리)09-01","9","사회","중부 지역","다양한 지리 정보와 매체를 활용하여 중부 지역의 지리적 특성 및 매력적인 여행 장소들을 탐색한다."],["9사(지리)09-02","9","사회","중부 지역","수도권의 공간 구조를 파악하고, 인구⋅문화⋅경제적 측면을 중심으로 수도권의 변화 양상을 탐색한다."],["9사(지리)09-03","9","사회","중부 지역","강원⋅충청 지역의 변화를 교통 발달과 수도권과의 관계를 중심으로 파악하고, 강원⋅충청 지역의 산업 변화와 지역경제 활성화를 위한 노력을 조사한다."],["9사(지리)09-04","9","사회","중부 지역","수도권과 비수도권 간의 지역 불균형 실태를 지도로 표현하고, 지역 불균형을 완화하기 위한 방안들을 제안한다."],["9사(지리)10-01","9","사회","남부 지역","다양한 지리 정보와 매체를 활용하여 남부 지역의 지리적 특성 및 매력적인 여행 장소들을 탐색한다."],["9사(지리)10-02","9","사회","남부 지역","글로벌 경제와 우리나라 산업에서 영⋅호남 공업 지역의 위상을 파악하고, 영⋅호남 지역의 산업 변화와 당면 과제를 조사한다."],["9사(지리)10-03","9","사회","남부 지역","제주도의 지역 변화와 이를 둘러싼 다양한 가치를 살펴보고 이에 대한 자신과 상대방의 의견을 비판적으로 검토한다."],["9사(지리)11-01","9","사회","북부 지역","다양한 지리 정보와 매체를 활용하여 북한의 자연환경과 인문환경의 특징을 탐색한다."],["9사(지리)11-02","9","사회","북부 지역","분단이 우리의 일상생활에 미친 영향을 살펴보고, 분리와 연결의 공간으로서 접경지역의 다양한 모습을 세계 여러 지역의 사례를 통해 비교한다."],["9사(지리)11-03","9","사회","북부 지역","세계시민의 관점에서 한반도 평화의 중요성을 논의하고, 한반도 평화와 통일 환경 속에서 우리의 삶과 국토의 미래를 구상한다."],["9사(지리)12-01","9","사회","지속가능한 세계와 글로컬 시민","우리나라 주요 식량 자원 및 에너지 자원의 소비 현황과 수입국 현황을 분석하여 이와 관련된 문제를 파악하고, 자원의 지속가능한 확보 방안을 모색한다."],["9사(지리)12-02","9","사회","지속가능한 세계와 글로컬 시민","지역 개발과 환경 보존을 둘러싼 글로컬 환경 이슈에 관심을 가지고 자신의 웰빙 및 공동체의 지속가능한 발전을 위해 참여하고 실천한다."],["9사(지리)12-03","9","사회","지속가능한 세계와 글로컬 시민","더 나은 지역을 만들어 가는 사람들의 노력을 국내외 사례를 통해 살펴보고, 자신이 사는 지역의 문제를 해결하기 위한 방안을 모색하고 이를 실천한다."],["9사(일사)01-01","9","사회","인간과 사회생활","사회화의 의미를 일상생활의 사례를 들어 설명하고, 사회화 과정에서 형성되는 자아 정체성에 대해 성찰한다."],["9사(일사)01-02","9","사회","인간과 사회생활","사회적 지위와 역할의 의미를 설명하고, 일상생활에서 나타나는 역할 갈등 사례와 대응 방안을 탐색한다."],["9사(일사)01-03","9","사회","인간과 사회생활","우리 사회에 나타나는 다양한 갈등과 차별의 사례를 조사하고, 이에 대처하는 시민의 자질에 대해 토의한다."],["9사(일사)02-01","9","사회","다양한 문화의 이해","일상생활에서 접하는 문화의 사례를 탐색하고, 이를 바탕으로 문화의 의미와 특징을 도출한다."],["9사(일사)02-02","9","사회","다양한 문화의 이해","우리 주변에서 활용되는 미디어들을 탐색하고, 미디어를 통해 경험하는 다양한 문화와 정보들을 비판적으로 검토한다."],["9사(일사)02-03","9","사회","다양한 문화의 이해","여러 집단에서 나타나는 다양한 문화 사례들을 조사하고, 문화를 이해하는 바람직한 태도에 대하여 토의한다."],["9사(일사)03-01","9","사회","민주주의와 시민","공동체 생활에 필요한 정치의 역할을 탐색하고, 다양한 정치 사례를 통해 민주주의의 의미와 필요성을 도출한다."],["9사(일사)03-02","9","사회","민주주의와 시민","민주주의의 발전 과정을 검토하고, 이를 토대로 민주주의의 이념과 기본 원리를 도출한다."],["9사(일사)03-03","9","사회","민주주의와 시민","현대 민주주의의 특징과 과제를 검토하고, 우리나라 민주주의의 발전을 위한 제도적 방안과 시민의 역할에 대해 토의한다."],["9사(일사)04-01","9","사회","정치과정과 시민 참여","선거의 기능과 기본 원칙을 검토하고, 선거 과정에서 유권자와 정당이 수행하는 활동을 조사한다."],["9사(일사)04-02","9","사회","정치과정과 시민 참여","정치활동에 참여하는 다양한 정치 주체의 역할을 탐색하고, 정치과정의 의미를 설명한다."],["9사(일사)04-03","9","사회","정치과정과 시민 참여","민주주의의 발전을 위한 지방 자치의 중요성을 설명하고, 지역사회의 문제를 해결하기 위한 시민 참여 활동을 계획한다."],["9사(일사)05-01","9","사회","일상생활과 법","법의 의미와 특징을 설명하고, 일상생활에서 접하는 법의 사례를 통해 법의 목적을 도출한다."],["9사(일사)05-02","9","사회","일상생활과 법","우리의 일상을 규율하는 다양한 법을 탐색하고, 국내외 사례를 통해 사회법이 필요한 이유에 대해 토의한다."],["9사(일사)05-03","9","사회","일상생활과 법","재판의 의미와 종류를 설명하고, 공정한 재판의 중요성에 대해 토의한다."],["9사(일사)06-01","9","사회","인권과 기본권","일상생활에서 인권이 침해되는 사례를 조사하고, 우리 헌법에 보장된 기본권의 종류를 탐색한다."],["9사(일사)06-02","9","사회","인권과 기본권","기본권 제한의 요건과 한계가 헌법에 명시된 이유를 토의하고, 기본권 침해 시 구제 방법을 조사한다."],["9사(일사)06-03","9","사회","인권과 기본권","근로자에게 보장되는 권리를 조사하고, 이러한 권리의 침해에 대처하는 국가와 시민의 노력에 대해 토의한다."],["9사(일사)07-01","9","사회","헌법과 국가기관","우리나라의 정부 형태를 설명하고, 대통령과 행정부의 역할을 탐색한다."],["9사(일사)07-02","9","사회","헌법과 국가기관","국회에서 법률이 만들어지는 사례를 탐색하고, 입법기관으로서 국회의 역할을 조사한다."],["9사(일사)07-03","9","사회","헌법과 국가기관","사법기관으로서 법원의 역할을 검토하고, 헌법재판소의 성격에 대해 토의한다."],["9사(일사)08-01","9","사회","경제생활과 선택","경제생활에서 합리적 선택의 필요성에 대해 검토하고, 비용과 편익을 고려한 합리적 선택 방안을 탐색한다."],["9사(일사)08-02","9","사회","경제생활과 선택","일생 동안 이루어지는 경제생활을 분석하고, 안정적인 금융 생활을 위한 자산 및 신용 관리 방안을 계획한다."],["9사(일사)08-03","9","사회","경제생활과 선택","시장경제에서 기업의 역할과 사회적 책임을 설명하고, 우리 사회에 필요한 기업가 정신에 대해 토의한다."],["9사(일사)09-01","9","사회","시장과 가격","일상생활에서 접하는 다양한 시장의 사례를 조사하고, 이를 토대로 시장의 의미와 필요성을 설명한다."],["9사(일사)09-02","9","사회","시장과 가격","수요 법칙과 공급 법칙을 사례를 통해 도출하고, 이를 토대로 시장 가격이 결정되는 원리를 설명한다."],["9사(일사)09-03","9","사회","시장과 가격","시장경제에서 수요와 공급을 변화시키는 요인을 조사하고, 시장 가격의 변동에 대응하는 방안을 계획한다."],["9사(일사)10-01","9","사회","우리나라 경제와 세계화","우리나라의 경제 성장 전후 모습을 검토하고, 국내 총생산의 증가가 우리 생활에 미치는 영향에 대해 토의한다."],["9사(일사)10-02","9","사회","우리나라 경제와 세계화","물가 변동과 실업의 사례를 탐색하고 물가 변동과 실업이 우리 생활에 미치는 영향을 제시한다."],["9사(일사)10-03","9","사회","우리나라 경제와 세계화","세계화 시대에 국제 거래가 이루어지는 사례를 탐색하고, 환율 변동이 우리 생활에 미치는 영향을 조사한다."],["9사(일사)11-01","9","사회","국제 사회와 한반도","국제 사회를 구성하는 여러 행위 주체의 활동을 조사하고, 이를 토대로 국제 사회의 특징을 도출한다."],["9사(일사)11-02","9","사회","국제 사회와 한반도","국제 사회의 다양한 분쟁에 대해 조사하고, 지역, 국가, 세계의 시민으로서 우리의 역할에 대해 토의한다."],["9사(일사)11-03","9","사회","국제 사회와 한반도","우리나라가 직면하고 있는 국제 문제에 대해 조사하고, 이러한 문제에 대응하기 위한 방안에 대해 토론한다."],["9사(일사)12-01","9","사회","사회 변동과 사회문제","오늘날 우리 사회가 겪는 사회 변동에 대해 조사하고, 이러한 사회 변동이 우리 생활에 미치는 영향을 분석한다."],["9사(일사)12-02","9","사회","사회 변동과 사회문제","오늘날의 주요한 사회문제를 조사하고, 이러한 사회문제가 우리 생활에 미치는 영향에 대해 토의한다."],["9사(일사)12-03","9","사회","사회 변동과 사회문제","사회 변동과 사회문제에 대응하는 국내외의 사례들을 검토하고, 시민으로서 지녀야 할 태도와 실천 방안에 대해 토의한다."],["9역01-01","9","역사","역사 학습의 기초","역사와 역사 탐구의 의미를 파악하고, 역사 학습의 목적을 다각도로 탐색한다."],["9역01-02","9","역사","역사 학습의 기초","다양한 자료와 사례를 통해 역사 탐구 방법을 익힌다."],["9역02-01","9","역사","문명의 발생과 고대 세계의 형성","선사 문화 및 문명의 형성을 이해하고, 각 문명의 특징을 비교한다."],["9역02-02","9","역사","문명의 발생과 고대 세계의 형성","서아시아⋅지중해 세계에서 등장한 여러 정치체를 비교하고 종교 및 문화를 탐구한다."],["9역02-03","9","역사","문명의 발생과 고대 세계의 형성","중국과 인도의 정치적 변화와 종교⋅사상 성립의 관계를 이해하고, 유라시아의 상호 교류를 탐색한다."],["9역03-01","9","역사","세계 종교의 확산과 지역 문화의 발전","수⋅당 시기 동아시아 국제 질서의 특징을 이해하고, 동아시아 문화를 탐구한다."],["9역03-02","9","역사","세계 종교의 확산과 지역 문화의 발전","인도, 서아시아, 지중해에서 진행된 정치적 변동 과정과 각 종교의 특징 및 영향을 파악한다."],["9역03-03","9","역사","세계 종교의 확산과 지역 문화의 발전","크리스트교 세계의 정치와 종교의 상관성을 이해하고, 이슬람 세계와 크리스트교 세계의 충돌 및 교류의 결과를 탐구한다."],["9역04-01","9","역사","지역 세계의 교류와 변화","송과 몽골 제국 시기 유라시아⋅인도양 교역권의 성장을 경제⋅문화 자료를 통해 탐구한다."],["9역04-02","9","역사","지역 세계의 교류와 변화","명⋅청, 에도 막부, 무굴 제국의 정치⋅사회 변화를 비교한다."],["9역04-03","9","역사","지역 세계의 교류와 변화","오스만 제국의 성장과 유럽 사회의 근대적 변화를 조사한다."],["9역05-01","9","역사","제국주의와 국민 국가 건설 운동","시민 혁명을 국민 국가 형성과 연결하여 파악하고, 역사적 의의와 한계를 탐구한다."],["9역05-02","9","역사","제국주의와 국민 국가 건설 운동","서양의 산업화와 제국주의 정책을 이해하고, 사회와 생태환경에 미친 영향을 분석한다."],["9역05-03","9","역사","제국주의와 국민 국가 건설 운동","제국주의 열강의 침략에 대한 아시아의 대응 및 국민 국가 건설 노력을 이해하고, 그 성과와 한계를 평가한다."],["9역06-01","9","역사","세계 대전과 사회 변동","20세기 전반 세계 질서의 변화를 두 차례의 세계 대전을 중심으로 파악한다."],["9역06-02","9","역사","세계 대전과 사회 변동","세계 대전 중의 전쟁 범죄를 탐구하고, 인권 회복과 평화 실현을 위한 노력을 조사한다."],["9역06-03","9","역사","세계 대전과 사회 변동","아시아⋅아프리카 지역의 민족 운동을 이해하고, 그 특징을 비교한다."],["9역07-01","9","역사","현대 세계의 전개와 과제","냉전의 전개와 제3 세계 등장의 상관관계를 이해하고, 냉전 이후 국제 질서의 변화를 분석한다."],["9역07-02","9","역사","현대 세계의 전개와 과제","20세기 후반 민주주의와 인권의 신장을 위한 노력에 관심을 갖는다."],["9역07-03","9","역사","현대 세계의 전개와 과제","오늘날 세계화의 양상을 조사하고, 성과와 과제를 탐구한다."],["9역08-01","9","역사","국가의 형성과 발전","고조선과 여러 나라의 형성 과정 및 사회 모습을 탐구한다."],["9역08-02","9","역사","국가의 형성과 발전","삼국과 가야의 성장 과정을 파악한다."],["9역08-03","9","역사","국가의 형성과 발전","삼국과 가야가 남긴 문화의 특징을 분석한다."],["9역09-01","9","역사","통일신라와 발해","삼국 통일의 과정을 동아시아 국제 정세의 맥락에서 이해하고, 통일신라와 발해 성립의 역사적 의의를 추론한다."],["9역09-02","9","역사","통일신라와 발해","통일신라와 발해의 국가 체제 정비와 변동을 분석한다."],["9역09-03","9","역사","통일신라와 발해","통일신라와 발해 문화의 특징을 파악한다."],["9역10-01","9","역사","고려의 성립과 변천","후삼국 통일과 체제 정비 과정을 통해 고려 성립의 역사적 의미를 탐색한다."],["9역10-02","9","역사","고려의 성립과 변천","고려의 정치적 변동을 파악하고 주변국과의 관계를 이해한다."],["9역10-03","9","역사","고려의 성립과 변천","원 간섭기 고려 사회에 나타난 변화를 파악하고 개혁의 영향을 탐구한다."],["9역10-04","9","역사","고려의 성립과 변천","고려의 문화유산과 대외 교류의 사례를 조사하여 그 특징을 파악한다."],["9역11-01","9","역사","조선의 성립과 발전","조선 성립의 의의를 통치 체제의 특징을 통해 파악한다."],["9역11-02","9","역사","조선의 성립과 발전","사림 세력의 성장이 성리학적 질서 확산에 끼친 영향을 추론한다."],["9역11-03","9","역사","조선의 성립과 발전","왜란과 호란의 성격을 동아시아 국제 정세 속에서 분석한다."],["9역12-01","9","역사","조선 사회의 변동","왜란과 호란 이후 체제 재정비의 노력과 정치 변동의 모습을 파악한다."],["9역12-02","9","역사","조선 사회의 변동","조선 후기 문화에서 나타난 변화를 분석한다."],["9역12-03","9","역사","조선 사회의 변동","조선 후기 사회적 모순에 대한 여러 세력의 대응을 탐구한다."],["9역13-01","9","역사","근⋅현대 사회로의 전환","개항 이후 근대 국가를 건설하기 위한 노력을 파악한다."],["9역13-02","9","역사","근⋅현대 사회로의 전환","국권 피탈 이후 전개된 민족 운동을 세계사적 관점에서 이해한다."],["9역13-03","9","역사","근⋅현대 사회로의 전환","한국의 민주화 과정에서 나타난 성과와 과제를 탐구한다."],["9역13-04","9","역사","근⋅현대 사회로의 전환","지속가능한 사회를 위한 과제를 역사적 맥락에서 탐구하고, 과제 해결에 참여하는 자세를 갖는다."],["9도01-01","9","도덕","자신과의 관계","자신의 삶과 가치관에 대한 성찰을 통해 자아를 올바로 이해하고, 삶에서 도덕이 필요한 이유에 근거하여 도덕적인 삶에 대한 의지를 기른다."],["9도01-02","9","도덕","자신과의 관계","일상에서 발생하는 부도덕한 행동의 여러 원인을 분석하고, 도덕적 인격이 갖추어야 할 특성들을 파악하여 이를 내면화하는 의지를 기른다."],["9도01-03","9","도덕","자신과의 관계","행복에 관한 심리적, 사회적, 윤리적 접근 등을 통해 행복의 의미를 종합적으로 파악하고, 삶의 목적과 행복의 관계를 정립할 수 있다."],["9도01-04","9","도덕","자신과의 관계","옳고 그름을 분별할 수 있는 도덕적 기준을 탐구하고, 도덕적 상상력을 바탕으로 일상의 도덕 문제들에 도덕적 추론을 적용할 수 있다."],["9도01-05","9","도덕","자신과의 관계","삶의 유한함에 관한 성찰을 통해 생명의 소중함과 의미 있는 삶의 중요성을 인식하고, 자신의 미래 모습을 상상하며 삶을 계획하고 이를 실천하는 의지를 기른다."],["9도01-06","9","도덕","자신과의 관계","내면에 대한 성찰을 통해 심리적 고통과 불안, 우울감 등의 원인을 찾고, 마음의 평온을 얻을 수 있는 방안들을 다각적으로 모색하여 실천할 수 있다."],["9도01-07","9","도덕","자신과의 관계","삶에서 직업이 갖는 의미와 가치를 파악하며, 사례 탐구를 통해 직업적 양심과 직업윤리의 필요성을 정당화할 수 있다."],["9도02-01","9","도덕","타인과의 관계","정서적, 배려적 공동체로서 가정의 특성과 도덕적 기능을 파악하고, 가정에서 발생하는 갈등을 공감적인 소통과 민주적인 과정을 통해 해소하는 의지를 기른다."],["9도02-02","9","도덕","타인과의 관계","친구의 의미와 가치를 삶의 맥락 속에서 탐구하고, 서로를 인격적으로 존중하는 친구 관계를 상상하며 이를 실현하는 의지를 기른다."],["9도02-03","9","도덕","타인과의 관계","가상공간과 현실 세계에 대한 비교⋅분석을 바탕으로 가상공간에서 발생하는 도덕 문제들의 원인과 해결 방안을 제안하고, 타인을 존중하며 가상공간을 활용하는 태도를 함양한다."],["9도02-04","9","도덕","타인과의 관계","인간을 관계적 존재로 해석할 수 있는 이유에 근거하여 타인과의 관계에서 필요한 가치⋅ 덕목을 탐구하고, 타인의 생각과 감정에 공감하는 태도를 기른다."],["9도02-05","9","도덕","타인과의 관계","다양한 갈등 상황을 평화적으로 해결할 수 있는 방안을 모색하고, 폭력의 유형과 원인, 결과에 대한 분석을 바탕으로 일상의 폭력 상황에 대한 대처 능력을 기른다."],["9도02-06","9","도덕","타인과의 관계","청소년기의 바람직한 성윤리를 탐구하여 내면화하고, 사회⋅문화적 차원에서 성의 의미를 파악하여 성에 대한 편견의 문제점을 분석하고 이를 바로잡는 의지를 기른다."],["9도03-01","9","도덕","사회⋅공동체와의 관계","인권을 존중해야 하는 도덕적 이유를 정당화하고, 인권 침해 사례에 대한 탐구를 통해 그 원인과 해결 방안을 도출함으로써 인권 감수성을 기른다."],["9도03-02","9","도덕","사회⋅공동체와의 관계","외집단에 대한 편견을 비판적으로 분석하고, 타문화⋅타종교⋅타인종을 존중해야 하는 이유에 근거하여 차이와 다양성에 대한 열린 마음을 기른다."],["9도03-03","9","도덕","사회⋅공동체와의 관계","북한에 대한 이해를 바탕으로 분단의 문제점을 분석하고, 도덕적 가치에 기초하여 통일의 의미를 재구성함으로써 바람직한 남북관계 및 통일의 방향을 제안할 수 있다."],["9도03-04","9","도덕","사회⋅공동체와의 관계","정의로운 사회를 상상해보고, 이를 실현할 수 있는 정의의 원칙과 제도에 대한 다양한 의견들을 민주적인 방식으로 종합할 수 있다."],["9도03-05","9","도덕","사회⋅공동체와의 관계","국가와 시민 사이에서 발생하는 윤리적 쟁점들을 탐구하고, 국가와 시민 사이의 바람직한 관계에 기초하여 국가와 시민의 역할을 재구성할 수 있다."],["9도03-06","9","도덕","사회⋅공동체와의 관계","인류의 고통에 공감하며 지구적 차원의 다양한 도덕 문제들을 탐구하고, 해결 방안을 모색하여 실천하는 자세를 갖는다."],["9도03-07","9","도덕","사회⋅공동체와의 관계","현대 과학기술과 관련된 윤리적 쟁점의 분석을 통해 과학기술의 유용성과 한계를 인식하고, 과학기술의 바람직한 활용에 관한 관심과 책임 의식을 기른다."],["9도04-01","9","도덕","자연과의 관계","인간 이외의 생명체를 도덕적으로 고려해야 하는 이유를 정당화하고, 생명을 가진 존재 들이 겪는 고통에 공감하며 생명을 소중히 여기는 태도를 기른다."],["9도04-02","9","도덕","자연과의 관계","자연에 대한 동양과 서양의 주요 입장들을 토대로 인간과 자연의 바람직한 관계를 도출하고, 환경 위기에 대한 윤리적 책임을 구체화하여 실천할 수 있다."],["9수01-01","9","수학","수와 연산","소인수분해의 뜻을 알고, 자연수를 소인수분해 할 수 있다."],["9수01-02","9","수학","수와 연산","소인수분해를 이용하여 최대공약수와 최소공배수를 구할 수 있다."],["9수01-03","9","수학","수와 연산","다양한 상황을 이용하여 음수의 필요성을 인식하고, 양수와 음수, 정수와 유리수의 개념을 이해한다."],["9수01-04","9","수학","수와 연산","정수와 유리수의 대소 관계를 판단할 수 있다."],["9수01-05","9","수학","수와 연산","정수와 유리수의 사칙계산의 원리를 이해하고, 그 계산을 할 수 있다."],["9수01-06","9","수학","수와 연산","순환소수의 뜻을 알고, 유리수와 순환소수의 관계를 설명할 수 있다."],["9수01-07","9","수학","수와 연산","제곱근의 뜻과 성질을 알고, 제곱근의 대소 관계를 판단할 수 있다."],["9수01-08","9","수학","수와 연산","무리수의 개념을 이해하고, 무리수의 유용성을 인식할 수 있다."],["9수01-09","9","수학","수와 연산","실수의 대소 관계를 판단하고 설명할 수 있다."],["9수01-10","9","수학","수와 연산","근호를 포함한 식의 사칙계산의 원리를 이해하고, 그 계산을 할 수 있다."],["9수02-01","9","수학","변화와 관계","다양한 상황을 문자를 사용한 식으로 나타내어 그 유용성을 인식하고, 식의 값을 구할 수 있다."],["9수02-02","9","수학","변화와 관계","일차식의 덧셈과 뺄셈의 원리를 이해하고, 그 계산을 할 수 있다."],["9수02-03","9","수학","변화와 관계","방정식과 그 해의 뜻을 알고, 등식의 성질을 설명할 수 있다."],["9수02-04","9","수학","변화와 관계","일차방정식을 풀 수 있고, 이를 활용하여 문제를 해결할 수 있다."],["9수02-05","9","수학","변화와 관계","순서쌍과 좌표를 이해하고, 그 편리함을 인식할 수 있다."],["9수02-06","9","수학","변화와 관계","다양한 상황을 그래프로 나타내고, 주어진 그래프를 해석할 수 있다."],["9수02-07","9","수학","변화와 관계","정비례, 반비례 관계를 이해하고, 그 관계를 표, 식, 그래프로 나타낼 수 있다."],["9수02-08","9","수학","변화와 관계","지수법칙을 이해하고, 이를 이용하여 식을 간단히 할 수 있다."],["9수02-09","9","수학","변화와 관계","다항식의 덧셈과 뺄셈의 원리를 이해하고, 그 계산을 할 수 있다."],["9수02-10","9","수학","변화와 관계","‘(단항식)× (다항식)’, ‘(다항식)÷ (단항식)’과 같은 곱셈과 나눗셈의 원리를 이해하고, 그 계산을 할 수 있다."],["9수02-11","9","수학","변화와 관계","부등식과 그 해의 뜻을 알고, 부등식의 성질을 설명할 수 있다."],["9수02-12","9","수학","변화와 관계","일차부등식을 풀 수 있고, 이를 활용하여 문제를 해결할 수 있다."],["9수02-13","9","수학","변화와 관계","미지수가 2개인 연립일차방정식을 풀 수 있고, 이를 활용하여 문제를 해결할 수 있다."],["9수02-14","9","수학","변화와 관계","함수의 개념을 이해하고, 함숫값을 구할 수 있다."],["9수02-15","9","수학","변화와 관계","일차함수의 개념을 이해하고, 그 그래프를 그릴 수 있다."],["9수02-16","9","수학","변화와 관계","일차함수의 그래프의 성질을 이해하고, 이를 활용하여 문제를 해결할 수 있다."],["9수02-17","9","수학","변화와 관계","일차함수와 미지수가 2개인 일차방정식의 관계를 설명할 수 있다."],["9수02-18","9","수학","변화와 관계","두 일차함수의 그래프와 연립일차방정식의 관계를 설명할 수 있다."],["9수02-19","9","수학","변화와 관계","다항식의 곱셈과 인수분해를 할 수 있다."],["9수02-20","9","수학","변화와 관계","이차방정식을 풀 수 있고, 이를 활용하여 문제를 해결할 수 있다."],["9수02-21","9","수학","변화와 관계","이차함수의 개념을 이해한다."],["9수02-22","9","수학","변화와 관계","이차함수의 그래프를 그릴 수 있고, 그 성질을 설명할 수 있다."],["9수03-01","9","수학","도형과 측정","점, 선, 면, 각을 이해하고, 실생활 상황과 연결하여 점, 직선, 평면의 위치 관계를 설명할 수 있다."],["9수03-02","9","수학","도형과 측정","평행선에서 동위각과 엇각의 성질을 이해하고 설명할 수 있다."],["9수03-03","9","수학","도형과 측정","삼각형을 작도하고, 그 과정을 설명할 수 있다."],["9수03-04","9","수학","도형과 측정","삼각형의 합동 조건을 이해하고, 이를 이용하여 두 삼각형이 합동인지 판별할 수 있다."],["9수03-05","9","수학","도형과 측정","다각형의 성질을 이해하고 설명할 수 있다."],["9수03-06","9","수학","도형과 측정","부채꼴의 중심각과 호의 관계를 이해하고, 이를 이용하여 부채꼴의 호의 길이와 넓이를 구할 수 있다."],["9수03-07","9","수학","도형과 측정","구체적인 모형이나 공학 도구를 이용하여 다면체와 회전체의 성질을 탐구하고, 이를 설명할 수 있다."],["9수03-08","9","수학","도형과 측정","입체도형의 겉넓이와 부피를 구할 수 있다."],["9수03-09","9","수학","도형과 측정","이등변삼각형의 성질을 이해하고 정당화할 수 있다."],["9수03-10","9","수학","도형과 측정","삼각형의 외심과 내심의 성질을 이해하고 정당화할 수 있다."],["9수03-11","9","수학","도형과 측정","사각형의 성질을 이해하고 정당화할 수 있다."],["9수03-12","9","수학","도형과 측정","도형의 닮음의 뜻과 닮은 도형의 성질을 이해하고, 닮음비를 구할 수 있다."],["9수03-13","9","수학","도형과 측정","삼각형의 닮음 조건을 이해하고, 이를 이용하여 두 삼각형이 닮음인지 판별할 수 있다."],["9수03-14","9","수학","도형과 측정","평행선 사이의 선분의 길이의 비를 구할 수 있다."],["9수03-15","9","수학","도형과 측정","피타고라스 정리를 이해하고 정당화할 수 있다."],["9수03-16","9","수학","도형과 측정","삼각비의 뜻을 알고, 간단한 삼각비의 값을 구할 수 있다."],["9수03-17","9","수학","도형과 측정","삼각비를 활용하여 여러 가지 문제를 해결할 수 있다."],["9수03-18","9","수학","도형과 측정","원의 현에 관한 성질과 접선에 관한 성질을 이해하고 정당화할 수 있다."],["9수03-19","9","수학","도형과 측정","원주각의 성질을 이해하고 정당화할 수 있다."],["9수04-01","9","수학","자료와 가능성","중앙값, 최빈값의 뜻을 알고, 자료의 특성에 따라 적절한 대푯값을 선택하여 구할 수 있다."],["9수04-02","9","수학","자료와 가능성","자료를 줄기와 잎 그림, 도수분포표, 히스토그램, 도수분포다각형으로 나타내고 해석할 수 있다."],["9수04-03","9","수학","자료와 가능성","상대도수를 구하고, 상대도수의 분포를 표나 그래프로 나타내고 해석할 수 있다."],["9수04-04","9","수학","자료와 가능성","통계적 탐구 문제를 설정하고, 공학 도구를 이용하여 자료를 수집하여 분석하고, 그 결과를 해석할 수 있다."],["9수04-05","9","수학","자료와 가능성","경우의 수를 구할 수 있다."],["9수04-06","9","수학","자료와 가능성","확률의 개념과 그 기본 성질을 이해하고, 확률을 구할 수 있다."],["9수04-07","9","수학","자료와 가능성","분산과 표준편차를 구하고 자료의 분포를 설명할 수 있다."],["9수04-08","9","수학","자료와 가능성","공학 도구를 이용하여 자료를 상자그림으로 나타내고 분포를 비교할 수 있다."],["9수04-09","9","수학","자료와 가능성","자료를 산점도로 나타내고 상관관계를 말할 수 있다."],["9과01-01","9","과학","과학과 인류의 지속가능한 삶","과학적 탐구 방법을 이해하고, 일상생활의 문제에 대한 과학적 해결 방안을 제안할 수 있다."],["9과01-02","9","과학","과학과 인류의 지속가능한 삶","과학의 발전이 인류 문명에 미친 영향을 이해하고, 인공지능 등 첨단 과학기술이 가져올 미래 사회의 변화를 조사하여 발표할 수 있다."],["9과01-03","9","과학","과학과 인류의 지속가능한 삶","인류의 지속가능한 삶을 위한 과학기술의 중요성과 역할에 대해 토의하고, 개인과 사회 차원의 활동 방안을 찾아 실천할 수 있다."],["9과02-01","9","과학","생물의 구성과 다양성","세포는 생명 활동이 일어나는 기본 단위임을 이해하고, 세포의 구조와 기능의 관계를 추론할 수 있다."],["9과02-02","9","과학","생물의 구성과 다양성","생물의 유기적 구성 단계를 이해하고, 동물과 식물을 비교하여 분석할 수 있다."],["9과02-03","9","과학","생물의 구성과 다양성","생물다양성을 이해하고, 변이와 생물다양성의 관계를 추론할 수 있다."],["9과02-04","9","과학","생물의 구성과 다양성","종의 개념과 분류 체계를 이해하고, 생물을 계 수준에서 분류할 수 있다."],["9과02-05","9","과학","생물의 구성과 다양성","생물다양성 보전의 필요성을 이해하고, 생물다양성 유지를 위한 방안을 조사하고 실천할 수 있다."],["9과03-01","9","과학","열","온도와 열평형 과정을 물질을 구성하는 입자들의 배치나 움직임 등으로 설명할 수 있다."],["9과03-02","9","과학","열","열은 전도, 대류, 복사로 전달됨을 알고, 열전달 과정을 모형 등을 사용하여 다양하게 표현할 수 있다."],["9과03-03","9","과학","열","물질에 따라 비열과 열팽창 정도가 다름을 알고, 이러한 성질이 일상생활에서 유용하게 활용됨을 인식할 수 있다."],["9과04-01","9","과학","물질의 상태 변화","확산 및 증발 현상을 관찰하여 물질을 구성하는 입자가 운동하고 있음을 추론할 수 있다."],["9과04-02","9","과학","물질의 상태 변화","물질의 세 가지 상태의 특징을 설명하고, 이를 입자 모형으로 표현할 수 있다."],["9과04-03","9","과학","물질의 상태 변화","여러 가지 물질의 상태 변화를 관찰하고, 이를 입자 모형으로 설명할 수 있다."],["9과04-04","9","과학","물질의 상태 변화","물질의 상태 변화와 열에너지 출입 관계를 이해하고, 이를 실생활에 적용하여 과학의 유용성을 인식할 수 있다."],["9과05-01","9","과학","힘의 작용","물체에 작용하는 힘을 화살표를 이용하여 나타내고, 힘의 평형을 이루는 조건을 설명할 수 있다."],["9과05-02","9","과학","힘의 작용","중력, 탄성력, 마찰력, 부력을 이해하고, 각 힘의 특징을 크기와 방향으로 설명할 수 있다."],["9과05-03","9","과학","힘의 작용","알짜힘이 0이 아닐 때 물체의 운동 상태가 변함을 알고, 그 예를 조사하여 분류할 수 있다."],["9과05-04","9","과학","힘의 작용","다양한 사례에서 작용하는 힘과 힘의 평형 관계를 설명하고, 일상생활에서 힘의 특징을 이용한 기구나 장치를 설계할 수 있다."],["9과06-01","9","과학","기체의 성질","압력의 의미를 알고, 기체의 압력을 입자의 운동으로 설명할 수 있다."],["9과06-02","9","과학","기체의 성질","기체의 압력과 부피 관계를 실험 결과로부터 알아내고, 이를 입자 모형으로 해석할 수 있다."],["9과06-03","9","과학","기체의 성질","기체의 온도와 부피 관계를 실험 결과로부터 알아내고, 이를 입자 모형으로 해석할 수 있다."],["9과07-01","9","과학","태양계","태양계를 구성하는 천체의 특징을 알고, 행성을 목성형 행성과 지구형 행성으로 구분할 수 있다."],["9과07-02","9","과학","태양계","태양의 표면과 대기에서 일어나는 현상을 알고, 태양의 활동이 지구에 미치는 영향을 추론할 수 있다."],["9과07-03","9","과학","태양계","지구 자전에 의한 천체의 겉보기 운동과 지구 공전에 의한 별자리 변화를 이해하고, 밤하늘 천체에 호기심을 가진다."],["9과07-04","9","과학","태양계","달을 관측하여 달의 위상변화 원리를 이해하고, 일식과 월식을 설명할 수 있다."],["9과08-01","9","과학","물질의 특성","물질의 특성의 의미를 알고, 실험을 통해 밀도, 용해도, 녹는점, 끓는점 등을 설명할 수 있다."],["9과08-02","9","과학","물질의 특성","물질의 특성을 근거로 우리 주변의 물질을 순물질과 혼합물로 분류할 수 있다."],["9과08-03","9","과학","물질의 특성","물질의 특성을 이용하여 혼합물이 분리되는 원리를 이해하고, 이를 이용한 사례를 주변에서 찾을 수 있다."],["9과09-01","9","과학","지권의 변화","지구계의 구성 요소를 알고, 지권의 층상 구조와 그 특징을 조사⋅발표할 수 있다."],["9과09-02","9","과학","지권의 변화","조암 광물의 주요 특성을 관찰하고, 암석과 광물의 활용 방안 및 자원으로서 가치에 대해 조사할 수 있다."],["9과09-03","9","과학","지권의 변화","지각을 이루는 암석을 생성 과정에 따라 분류하고, 암석의 순환 과정을 설명할 수 있다."],["9과09-04","9","과학","지권의 변화","풍화 과정을 이해하고, 토양 생성 과정을 풍화 작용의 예로 설명할 수 있다."],["9과09-05","9","과학","지권의 변화","대륙이동설을 이해하고, 지진과 화산이 발생하는 지역의 분포를 판의 경계와 관련지어 설명할 수 있다."],["9과10-01","9","과학","빛과 파동","빛의 반사와 굴절의 원리를 이해하고, 물체를 보는 과정을 빛의 경로를 이용하여 표현할 수 있다."],["9과10-02","9","과학","빛과 파동","평면거울에서 상이 생기는 원리를 설명하고, 일상생활에서 사용되는 거울과 렌즈의 종류를 분류하고 상의 특징을 비교할 수 있다."],["9과10-03","9","과학","빛과 파동","물체의 색을 빛의 반사와 관련지어 설명하고, 영상 장치에서 빛의 합성을 이용하여 다양한 색이 표현되는 원리를 이해할 수 있다."],["9과10-04","9","과학","빛과 파동","파동의 발생과 전달 과정을 이해하고, 소리의 특성을 진폭, 진동수, 파형 등의 과학적 용어로 표현할 수 있다."],["9과11-01","9","과학","물질의 구성","원소와 화합물의 정의를 알고, 원소와 화합물을 화학식으로 표현할 수 있다."],["9과11-02","9","과학","물질의 구성","원소를 구성하는 입자인 원자는 양성자, 중성자, 전자로 구성되며, 양성자의 수에 따라 원소의 종류가 달라짐을 입자 모형을 활용하여 설명할 수 있다."],["9과11-03","9","과학","물질의 구성","원소는 양성자의 수에 따라 주기율표에 배치됨을 알고, 주기율표에서 성질이 유사한 원소를 찾을 수 있다."],["9과11-04","9","과학","물질의 구성","물질을 이루는 입자는 원자, 분자, 이온 등으로 존재할 수 있음을 알고, 이온은 전하를 띠고 있음을 설명할 수 있다."],["9과12-01","9","과학","식물과 에너지","광합성 과정을 이해하고, 환경 요인과 광합성의 관계를 탐구하는 실험을 설계할 수 있다."],["9과12-02","9","과학","식물과 에너지","식물의 호흡과 광합성의 관계를 이해하고, 호흡과 광합성 과정에서 출입하는 에너지와 물질의 변화를 분석할 수 있다."],["9과12-03","9","과학","식물과 에너지","광합성 산물의 저장과 이용 과정을 이해하고, 모형으로 설명할 수 있다."],["9과13-01","9","과학","동물과 에너지","소화계의 구조와 기능을 이해하고, 소화 과정을 소화 효소의 작용과 관련지어 추론할 수 있다."],["9과13-02","9","과학","동물과 에너지","순환계의 구조와 기능을 이해하고, 혈액의 순환 경로를 종합하여 발표할 수 있다."],["9과13-03","9","과학","동물과 에너지","호흡계의 구조와 기능을 이해하고, 호흡 운동의 원리를 나타내는 모형을 만들 수 있다."],["9과13-04","9","과학","동물과 에너지","배설계의 구조와 기능을 이해하고, 노폐물이 배설되는 과정을 모식도로 표현할 수 있다."],["9과13-05","9","과학","동물과 에너지","동물이 세포호흡을 통해 에너지를 얻는 과정을 소화, 순환, 호흡, 배설과 관련지어 통합적으로 설명할 수 있다."],["9과14-01","9","과학","전기와 자기","마찰 전기, 정전기 유도 현상을 관찰하고, 이를 전기력과 원자 모형을 이용하여 설명할 수 있다."],["9과14-02","9","과학","전기와 자기","전기 회로에서 전류를 모형으로 설명하고, 실험을 통해 저항, 전류, 전압 사이의 관계를 이끌어낼 수 있다."],["9과14-03","9","과학","전기와 자기","저항의 직렬연결과 병렬연결의 특징을 비교하고, 일상생활에서 전기 에너지가 다양한 형태의 에너지로 전환됨을 소비 전력과 관련지어 설명할 수 있다."],["9과14-04","9","과학","전기와 자기","자기장 안에 놓인 전류가 흐르는 코일이 받는 힘의 특성을 추리하고, 전동기 등 일상생활에서 활용한 예를 찾을 수 있다."],["9과15-01","9","과학","별과 우주","연주시차를 이용하여 별까지의 거리를 구할 수 있고, 별의 등급과 밝기의 관계 및 표면 온도와 색의 관계를 설명할 수 있다."],["9과15-02","9","과학","별과 우주","우리은하의 구조와 크기를 이해하고, 성운과 성단의 특징을 비교할 수 있다."],["9과15-03","9","과학","별과 우주","모형을 이용하여 우주가 팽창하고 있음을 설명할 수 있다."],["9과15-04","9","과학","별과 우주","우주탐사의 의의와 인류에게 미치는 영향을 조사하여 과학의 유용성을 인식할 수 있다."],["9과16-01","9","과학","화학 반응의 규칙성","물리 변화와 화학 변화의 의미를 알고, 화학 변화에서 새로운 물질이 생성됨을 관찰할 수 있다."],["9과16-02","9","과학","화학 반응의 규칙성","간단한 화학 반응을 화학 반응식으로 표현하고, 화학 반응식에서 계수의 비를 입자 수의 비로 해석할 수 있다."],["9과16-03","9","과학","화학 반응의 규칙성","화학 반응에서 질량이 보존됨을 실험을 통해 추론할 수 있다."],["9과16-04","9","과학","화학 반응의 규칙성","화합물을 구성하는 성분 원소의 질량비가 일정함을 실험 자료를 해석하여 설명할 수 있다."],["9과16-05","9","과학","화학 반응의 규칙성","기체 반응에서 기체 부피 사이의 비가 일정함을 실험 자료를 해석하여 설명할 수 있다."],["9과16-06","9","과학","화학 반응의 규칙성","화학 반응에서 열에너지가 출입함을 알고, 생활 속 사례를 조사하여 발표할 수 있다."],["9과17-01","9","과학","날씨와 기후변화","지구 대기권을 4개 권역으로 구분하며, 온실효과와 지구온난화를 복사 평형의 관점으로 설명할 수 있다."],["9과17-02","9","과학","날씨와 기후변화","대기 대순환에서 위도별 바람의 특성을 파악하고, 대기 대순환의 역할을 설명할 수 있다."],["9과17-03","9","과학","날씨와 기후변화","상대습도, 단열 팽창 및 응결 현상의 관계를 이해하고, 구름의 생성과 강수 과정을 설명할 수 있다."],["9과17-04","9","과학","날씨와 기후변화","기압, 기단, 전선의 개념을 이해하고, 일기도에서 저기압과 고기압의 분포에 따른 날씨를 해석할 수 있다."],["9과18-01","9","과학","수권과 해수의 순환","수권에서 해수, 담수, 빙하의 분포와 활용 사례를 조사하고, 자원으로서 물의 가치에 대해 토론할 수 있다."],["9과18-02","9","과학","수권과 해수의 순환","해수의 수온과 염분의 분포 및 변화를 해석하여 해수의 특성을 설명할 수 있다."],["9과18-03","9","과학","수권과 해수의 순환","대기 대순환과 해양 표층 순환과의 관계를 이해하고, 기후변화에 영향을 미치는 해류의 역할을 설명할 수 있다."],["9과19-01","9","과학","운동과 에너지","직선상에서 움직이는 물체의 운동을 그래프로 나타내고 해석할 수 있다."],["9과19-02","9","과학","운동과 에너지","자유 낙하하는 물체의 운동에서 시간에 따른 속력의 변화가 일정함을 분석할 수 있다."],["9과19-03","9","과학","운동과 에너지","일의 정의를 알고, 자유 낙하하는 물체의 운동에서 중력이 한 일을 위치 에너지와 운동 에너지로 표현할 수 있다."],["9과19-04","9","과학","운동과 에너지","물체의 운동에서 역학적 에너지의 전환과 보존을 이해하고, 이를 활용하여 일상생활 속 물체의 운동을 예측할 수 있다."],["9과20-01","9","과학","자극과 반응","감각기관의 구조와 기능을 이해하고, 실험을 통해 자극이 뇌로 전달되는 과정을 추론할 수 있다."],["9과20-02","9","과학","자극과 반응","뉴런과 신경계의 구조와 기능을 이해하고, 자극에서 반응이 일어나기까지의 과정을 모형으로 설명할 수 있다."],["9과20-03","9","과학","자극과 반응","우리 몸의 기능 조절에 호르몬이 관여함을 알고, 관련 자료를 조사하여 발표할 수 있다."],["9과21-01","9","과학","생식과 유전","개체의 생장에 세포분열이 필요한 이유를 세포의 표면적과 부피의 관계로 추론할 수 있다."],["9과21-02","9","과학","생식과 유전","염색체와 유전자의 관계를 이해하고, 체세포분열과 생식세포 형성과정의 특징을 염색체 행동을 중심으로 해석할 수 있다."],["9과21-03","9","과학","생식과 유전","수정란으로부터 개체가 발생하는 과정을 모형으로 표현할 수 있다."],["9과21-04","9","과학","생식과 유전","멘델 유전 실험의 의의와 원리를 이해하고, 멘델 유전 원리가 적용되는 유전 현상을 조사하여 협력적으로 소통할 수 있다."],["9과21-05","9","과학","생식과 유전","사람의 유전 형질과 유전 연구 방법을 알고, 가계도를 분석하여 사람의 유전 현상을 설명할 수 있다."],["9과22-01","9","과학","재해⋅재난과 안전","재해⋅재난 사례와 관련된 자료를 조사하고, 그 발생 원인과 피해에 대해 과학적으로 분석할 수 있다."],["9과22-02","9","과학","재해⋅재난과 안전","과학적 원리를 이용하여 재해⋅재난에 대한 대비 및 대처 방안을 세울 수 있다."],["9과23-01","9","과학","과학과 나의 미래","과학과 관련된 직업의 종류와 하는 일을 조사하고, 과학기술의 발달로 생기는 미래 사회의 직업 변화를 예상할 수 있다."],["9과23-02","9","과학","과학과 나의 미래","자신의 진로와 관련 있는 과학 분야를 조사하고, 진로 선택을 위하여 필요한 과학 학습을 계획할 수 있다."],["9기가01-01","9","기술·가정","인간 발달과 주도적 삶","자아 존중감을 향상시키고 긍정적인 자아 정체성을 형성하기 위해 청소년기의 발달 특징을 자신의 발달 특징과 연결 지어 자신을 총체적으로 이해한다."],["9기가01-02","9","기술·가정","인간 발달과 주도적 삶","의생활, 식생활이 청소년기 성장과 건강에 미치는 영향을 탐색하고 성장과 건강을 위해 바람직한 의생활과 식생활의 실천 방안을 탐색하여 이를 실천한다."],["9기가01-03","9","기술·가정","인간 발달과 주도적 삶","건강과 성장을 위한 청소년기 영양의 중요성을 이해하여 자신의 식생활을 평가하고, 식생활 문제를 개선하여 건강한 식생활을 실천한다."],["9기가01-04","9","기술·가정","인간 발달과 주도적 삶","의복디자인 요소를 고려한 자기이미지에 맞는 옷차림으로 자신을 긍정적으로 표현한다."],["9기가01-05","9","기술·가정","인간 발달과 주도적 삶","청소년기의 건강한 발달을 위협하는 스트레스, 분노, 우울 등의 여러 가지 행동 및 심리 문제의 원인을 분석하고, 적응 유연성을 기를 수 있는 다양한 예방 및 해결방안을 탐색하여 적용한다."],["9기가01-06","9","기술·가정","인간 발달과 주도적 삶","사회변화로 증가하는 여러 가지 청소년 중독의 유형을 탐색하여 이를 예방하고 대응할 수 있는 방안을 제안한다."],["9기가01-07","9","기술·가정","인간 발달과 주도적 삶","자기 이해를 기반으로 전 생애적 관점에서 진로 설계의 중요성을 인식하고, 자기 적성에 맞는 진로를 설계한다."],["9기가01-08","9","기술·가정","인간 발달과 주도적 삶","성적 자기 결정권의 중요성을 이해하고, 성인지 감수성과 건강한 성 가치관을 함양하여 상호 존중의 관계를 실천할 수 있는 방안을 탐색한다."],["9기가01-09","9","기술·가정","인간 발달과 주도적 삶","일상생활 및 가상공간에서 만나는 또래와 건강한 관계를 형성하고, 다양한 주변인들과 친밀한 세대 간 관계를 형성하는 방안을 탐색하여 실천한다."],["9기가01-10","9","기술·가정","인간 발달과 주도적 삶","다양한 현대 가족에 내재된 가족생활의 보편성과 고유한 가치를 존중하는 동시에 가족에 대한 유연한 태도를 길러, 뉴노멀 사회에서의 새로운 가족문화를 탐색한다."],["9기가01-11","9","기술·가정","인간 발달과 주도적 삶","대인 관계에서 발생하는 갈등의 원인과 배경을 분석하고, 효과적인 의사소통을 통해 갈등을 해결하는 방안을 탐색하여 이를 적용한다."],["9기가01-12","9","기술·가정","인간 발달과 주도적 삶","성폭력과 가정폭력의 사회⋅구조적인 원인과 영향을 분석하고, 다양한 문제 상황을 중심으로 이를 대처하고 지원하는 방안을 탐색한다."],["9기가02-01","9","기술·가정","생활환경과 지속가능한 선택","생활자원의 종류와 특성 및 순환과정을 이해하고, 의식주 자원관리의 중요성을 인식한다."],["9기가02-02","9","기술·가정","생활환경과 지속가능한 선택","한국인 영양소 섭취기준과 식사구성안을 바탕으로 균형 잡힌 식사를 계획한다."],["9기가02-03","9","기술·가정","생활환경과 지속가능한 선택","건강과 환경을 고려한 식품의 선택, 관리, 보관 방법을 탐색하여 실생활에 적용한다."],["9기가02-04","9","기술·가정","생활환경과 지속가능한 선택","개인과 가족의 영양 요구와 지속가능성을 충족하는 식사를 계획하고 조리한다."],["9기가02-05","9","기술·가정","생활환경과 지속가능한 선택","의복 재료의 특성을 이해하고 건강과 환경을 고려한 의복의 세탁과 관리 방안을 탐색하여 실천한다."],["9기가02-06","9","기술·가정","생활환경과 지속가능한 선택","지속가능성을 고려하여 의복 마련 계획을 세우고, 이를 창의적이고 친환경적인 의생활에 적용한다."],["9기가02-07","9","기술·가정","생활환경과 지속가능한 선택","주거의 의미와 가치가 변화함에 따라 나타나는 다양한 생활 양식을 탐색하고, 더불어 살아가는 주거 문화를 실천한다."],["9기가02-08","9","기술·가정","생활환경과 지속가능한 선택","생활공간으로서 주거환경의 조건을 분석하고, 쾌적하고 안전한 주거 관리 방안을 탐색하여 실생활에 적용한다."],["9기가02-09","9","기술·가정","생활환경과 지속가능한 선택","효율적인 주거 공간 구성 방안을 탐색하여 자신의 생활에 적합한 주거 공간 구성에 활용한다."],["9기가02-10","9","기술·가정","생활환경과 지속가능한 선택","의식주 생활자원의 생산과 폐기과정을 탐색하고, 일상생활에서 의식주 생활자원을 선택한 과정과 그 결과를 성찰한다."],["9기가02-11","9","기술·가정","생활환경과 지속가능한 선택","급변하는 소비환경의 변화를 이해하고, 다양한 소비자 정보를 비판적으로 분석하여 자신의 소비생활에 활용한다."],["9기가02-12","9","기술·가정","생활환경과 지속가능한 선택","청소년 소비자의 특성을 이해하고 소비자 의사 결정 과정을 통한 합리적인 소비생활을 실천한다."],["9기가02-13","9","기술·가정","생활환경과 지속가능한 선택","책임 있는 소비자로서 소비자의 권리와 역할을 인식하고, 소비생활에서 발생하는 소비자 문제와 해결 방안을 탐색하여 소비생활에 적용한다."],["9기가02-14","9","기술·가정","생활환경과 지속가능한 선택","디지털 생활환경으로 나타난 일상생활의 혁신과 변화를 비판적으로 분석한 결과를 삶의 질 향상에 활용할 수 있는 방안을 탐색하여 제안한다."],["9기가03-01","9","기술·가정","기술적 문제해결과 혁신","기술의 의미와 특성을 이해하고 기술의 발달에 따른 사회의 변화를 파악하며, 미래의 기술과 사회의 변화를 평가하고 예측함으로써 기술에 대한 가치를 인식한다."],["9기가03-02","9","기술·가정","기술적 문제해결과 혁신","기술의 표준화, 적정 기술과 같은 기술 활용 사례를 탐구하고, 기술이 사회에 미치는 영향을 바르게 인식하여 기술 혁신과 사회 발전에 참여하는 태도를 갖는다."],["9기가03-03","9","기술·가정","기술적 문제해결과 혁신","기술적 문제 해결 과정의 이해를 바탕으로 문제를 확인하고, 정보를 수집하며, 확산적 사고와 수렴적 사고를 통해 해결방안을 탐색하고 대안을 선정한다."],["9기가03-04","9","기술·가정","기술적 문제해결과 혁신","기술적 문제 해결 방안을 시각화하고 도면을 작성하며, 올바른 도구를 선택하여 시제품 또는 모형을 제작 및 평가하는 과정에서 협업 능력, 공감 능력과 의사소통 능력을 기른다."],["9기가03-05","9","기술·가정","기술적 문제해결과 혁신","발명의 개념을 이해하고, 발명 문제 해결 과정을 바탕으로 발명 활동을 체험하여 창조에 대한 자신감을 갖고 발명이 사회에 미친 영향과 가치를 인식한다."],["9기가03-06","9","기술·가정","기술적 문제해결과 혁신","지식재산권의 종류와 특징을 이해하고, 지식재산과 관련한 다양한 사례 조사 및 체험을 통해 지식재산권의 창출, 보호, 활용을 이해하고 실천한다."],["9기가03-07","9","기술·가정","기술적 문제해결과 혁신","재료의 종류와 특성을 이해하며, 목적에 맞는 재료를 선택하고, 안전한 가공 방법을 실천한다."],["9기가03-08","9","기술·가정","기술적 문제해결과 혁신","설계의 가치와 필요성을 인식하고, 제도의 기본 통칙에 따라 도면을 작성한다."],["9기가03-09","9","기술·가정","기술적 문제해결과 혁신","제품의 제작 순서를 이해하고 올바른 도구를 선택하여 제품을 안전하게 제작하고 평가한다."],["9기가03-10","9","기술·가정","기술적 문제해결과 혁신","친환경 에너지 자원의 특성을 이해하고, 종류와 활용 사례를 조사하여 친환경 에너지 개발의 중요성을 인식한다."],["9기가03-11","9","기술·가정","기술적 문제해결과 혁신","에너지와 관련된 문제를 발견하고 창의적인 해결방안을 탐색하여 실현하고 평가한다."],["9기가03-12","9","기술·가정","기술적 문제해결과 혁신","다양한 수송 수단과 물류 체제를 이해하고 발달과정 및 특징과 혁신적인 활용 사례를 조사하여 수송 분야의 발달을 전망한다."],["9기가03-13","9","기술·가정","기술적 문제해결과 혁신","수송 수단 및 물류 체제와 관련된 문제를 이해하고 해결방안을 탐색하여 실현하고 평가한다."],["9기가04-01","9","기술·가정","지속가능한 기술과 융합","건설기술의 개념 및 발달과정, 건설 구조물의 종류와 특성을 이해하고, 건설 구조물의 혁신사례를 탐구함으로써 건설기술의 중요성을 인식한다."],["9기가04-02","9","기술·가정","지속가능한 기술과 융합","건설 구조물의 종류에 따른 계획, 설계, 시공, 유지관리 방법을 탐구하고 건설과정의 중요성을 이해하며 건설 구조물의 가치를 인식한다."],["9기가04-03","9","기술·가정","지속가능한 기술과 융합","사용자 요구 및 주어진 환경과 조건을 충족하는 지속가능한 건설 구조물의 모형을 설계⋅제작 및 평가한다."],["9기가04-04","9","기술·가정","지속가능한 기술과 융합","전기⋅전자 부품의 종류와 기능을 이해하고 기능에 맞는 부품을 선택하여 문제를 해결하기 위한 간단한 회로를 구성하고 제작 및 평가한다."],["9기가04-05","9","기술·가정","지속가능한 기술과 융합","정보통신과 인공지능 기술의 활용 사례를 탐구하고, 정보통신과 인공지능 기술이 우리 삶에 미치는 영향을 다양한 관점에서 평가한다."],["9기가04-06","9","기술·가정","지속가능한 기술과 융합","정보통신과 인공지능 기술 관련 문제를 이해하고 해결 방안을 탐색, 실현, 평가함으로써 긍정적인 문제 해결 태도를 갖는다."],["9기가04-07","9","기술·가정","지속가능한 기술과 융합","기계의 구성 요소 및 동력 전달 장치의 종류와 특징을 이해하고, 작동 원리에 맞는 기계요소를 선택하여 평가한다."],["9기가04-08","9","기술·가정","지속가능한 기술과 융합","다양한 기계요소와 동력 전달 방법을 활용하여 주어진 문제를 해결할 수 있는 운동 물체를 안전하게 제작하고 평가한다."],["9기가04-09","9","기술·가정","지속가능한 기술과 융합","로봇에 활용되고 있는 제어 및 자동화 기술 등을 탐구하여 간단한 로봇을 제작하고 평가함으로써 창조에 대한 자신감을 갖는다."],["9기가04-10","9","기술·가정","지속가능한 기술과 융합","인간의 건강과 생명 연장을 위해 의료 분야에서 활용되는 생명기술 사례를 조사하고, 생명기술이 개인과 사회에 미친 영향을 평가한다."],["9기가04-11","9","기술·가정","지속가능한 기술과 융합","생명기술을 이해하며, 이와 관련된 문제의 해결 방안을 탐색, 실현, 평가하고, 생명 존중 및 윤리적 태도를 갖는다."],["9기가04-12","9","기술·가정","지속가능한 기술과 융합","기술적 문제에 대한 도전적 태도로 다양한 분야에 활용되고 있는 융합 기술의 사례를 탐구하고 미래의 기술 변화를 전망한다."],["9기가04-13","9","기술·가정","지속가능한 기술과 융합","긍정적이고 공감하는 문제 해결 태도를 바탕으로 지속가능한 발전과 혁신을 위해 융합기술 문제를 해결하고 과정과 결과를 평가한다."],["9정01-01","9","정보","컴퓨팅 시스템","컴퓨팅 시스템의 구성요소와 동작 원리를 이해하고, 운영 체제의 기능을 분석한다."],["9정01-02","9","정보","컴퓨팅 시스템","피지컬 컴퓨팅의 개념을 이해하고, 생활 속에서 적용된 사례 조사를 통해 컴퓨팅 시스템의 필요성과 가치를 판단한다."],["9정01-03","9","정보","컴퓨팅 시스템","문제 해결 목적에 맞는 피지컬 컴퓨팅 구성요소를 선택하여 시스템을 구상한다."],["9정02-01","9","정보","데이터","실생활의 데이터가 디지털 형태로 변환되어 활용되는 긍정적 가치를 탐색하고, 다양한 데이터를 디지털 형태로 표현한다."],["9정02-02","9","정보","데이터","문제 해결에 적합한 데이터를 수집하고, 목적에 맞게 구분하여 관리한다."],["9정02-03","9","정보","데이터","실생활의 데이터를 표, 다이어그램 등 다양한 형태로 구조화한다."],["9정02-04","9","정보","데이터","사례를 중심으로 데이터 간의 관계를 파악하고, 데이터에 기반하여 의미를 해석한다."],["9정02-05","9","정보","데이터","여러 학문 분야의 사례를 중심으로 데이터를 수집⋅분석하여 융합적으로 문제를 해결한다."],["9정03-01","9","정보","알고리즘과 프로그래밍","문제의 상태를 정의하고 수행 가능한 형태로 구조화한다."],["9정03-02","9","정보","알고리즘과 프로그래밍","문제 해결을 위한 추상화의 중요성을 이해하고, 핵심요소를 중심으로 알고리즘을 표현한다."],["9정03-03","9","정보","알고리즘과 프로그래밍","알고리즘의 중요성을 이해하고, 문제를 해결하는 다양한 알고리즘을 비교⋅분석한다."],["9정03-04","9","정보","알고리즘과 프로그래밍","사례를 중심으로 문제 해결에 적합한 전략을 선택하여 알고리즘을 설계한다."],["9정03-05","9","정보","알고리즘과 프로그래밍","데이터를 순차적으로 저장할 수 있는 구조를 활용하여 문제 해결 프로그램을 작성한다."],["9정03-06","9","정보","알고리즘과 프로그래밍","논리 연산과 중첩 제어 구조를 활용하여 문제를 해결하는 프로그램을 작성한다."],["9정03-07","9","정보","알고리즘과 프로그래밍","프로그램 작성에서 함수를 활용하고, 프로그램 수행 결과를 디버거로 분석하여 오류를 수정한다."],["9정03-08","9","정보","알고리즘과 프로그래밍","실생활의 문제를 탐색하여 발견하고, 프로그래밍을 통해 해결한다."],["9정03-09","9","정보","알고리즘과 프로그래밍","다양한 학문 분야의 문제 해결을 위해 협력하여 소프트웨어를 개발한다."],["9정04-01","9","정보","인공지능","인공지능의 개념과 특성을 설명하고 인공지능 소프트웨어를 구별한다."],["9정04-02","9","정보","인공지능","인공지능 학습에서 데이터의 중요성을 이해하고, 학습에 필요한 데이터를 수집하여 분류한다."],["9정04-03","9","정보","인공지능","다양한 데이터를 활용하여 인공지능 시스템을 구성하고 적용한다."],["9정04-04","9","정보","인공지능","인공지능 시스템으로 해결 가능한 문제를 발견하고, 문제 해결에 적합한 인공지능 시스템을 적용한다."],["9정04-05","9","정보","인공지능","인공지능 학습에 필요한 데이터의 수집과 활용에서 발생하는 윤리적인 문제의 해결 방안을 구상한다."],["9정05-01","9","정보","디지털 문화","디지털 사회의 특성을 탐구하고, 사회 변화에 따른 직업의 변화를 탐구한다."],["9정05-02","9","정보","디지털 문화","디지털 사회의 구성원으로서 편리하고 안전한 생활을 위한 규칙에 대해 민주적으로 논의하고 실천 방안을 수립한다."],["9정05-03","9","정보","디지털 문화","사례를 중심으로 디지털 공간에서 함께 살아가기 위해 개인 정보 및 권리와 저작권을 보호하는 실천 방법을 탐구한다."],["9체01-01","9","체육","운동","체력 증진의 의미를 이해하고 원리를 분석한다."],["9체01-02","9","체육","운동","자신의 체력 수준에 맞는 체력 증진 운동을 실천한다."],["9체01-03","9","체육","운동","체력 관리의 의미를 이해하고 원리를 분석한다."],["9체01-04","9","체육","운동","자신의 체력을 진단하고 적합한 체력 관리 방법을 실천한다."],["9체01-05","9","체육","운동","운동 처방의 의미를 이해하고 원리를 분석한다."],["9체01-06","9","체육","운동","자신의 신체 조건이나 체력에 맞게 운동 처방 계획을 수립하고 안전하게 실천한다."],["9체01-07","9","체육","운동","신체 건강의 의미를 이해하고 신체 건강 활동의 종류와 특성을 분석한다."],["9체01-08","9","체육","운동","자신에게 적합한 신체 건강 활동 방법을 실천한다."],["9체01-09","9","체육","운동","정신 건강의 의미를 이해하고 정신 건강 활동의 종류와 특성을 분석한다."],["9체01-10","9","체육","운동","자신에게 적합한 정신 건강 활동 방법을 실천한다."],["9체01-11","9","체육","운동","사회적 건강의 의미를 이해하고 사회적 건강을 위한 활동의 종류와 특성을 분석한다."],["9체01-12","9","체육","운동","사회적으로 적합한 건강 활동 방법을 실천한다."],["9체01-13","9","체육","운동","체력 운동을 하며 실천 의지와 인내심을 보이고 자기 주도적으로 문제를 해결한다."],["9체01-14","9","체육","운동","건강 활동을 자율적으로 실천하며 자신과 공동체에 대한 안전을 추구한다."],["9체02-01","9","체육","스포츠","동작형 스포츠의 역사와 특성을 탐색하고 비교한다."],["9체02-02","9","체육","스포츠","동작형 스포츠의 수행 원리를 적용하여 경기 기능을 수련하고 향상한다."],["9체02-03","9","체육","스포츠","동작형 스포츠의 경기 방법을 이해하고 경기 전략을 상황에 맞게 활용하며 안전하게 경기한다."],["9체02-04","9","체육","스포츠","기록형 스포츠의 역사와 특성을 탐색하고 비교한다."],["9체02-05","9","체육","스포츠","기록형 스포츠의 수행 원리를 적용하여 경기 기능을 수련하고 향상한다."],["9체02-06","9","체육","스포츠","기록형 스포츠의 경기 방법을 이해하고 경기 전략을 상황에 맞게 활용하며 안전하게 경기한다."] ,["9영01-02","9","영어","이해","친숙한 주제에 관한 담화나 글에서 세부 정보를 파악한다."],["9영01-03","9","영어","이해","친숙한 주제에 관한 담화나 글의 중심 내용을 파악한다."],["9영01-04","9","영어","이해","친숙한 주제에 관한 담화나 글에서 일이나 사건의 논리적 관계를 파악한다."],["9영01-05","9","영어","이해","친숙한 주제에 관한 담화나 글에서 인물의 기분이나 감정을 추론한다."],["9영01-06","9","영어","이해","친숙한 주제에 관한 담화나 글에서 화자나 필자의 의도나 목적을 추론한다."],["9영01-07","9","영어","이해","단어, 어구, 문장의 함축적 의미를 추론한다."],["9영01-08","9","영어","이해","적절한 전략을 활용하여 다양한 매체로 표현된 담화나 글을 듣거나 읽는다."],["9영01-09","9","영어","이해","다양한 관점을 존중하는 태도로 듣거나 읽는다."],["9영01-10","9","영어","이해","자신의 관심사에 관한 다양한 담화나 글을 선택하여 적극적으로 듣거나 읽는다."],["9영02-01","9","영어","표현","연음이나 축약된 소리를 활용하여 단어, 어구, 문장을 말한다."],["9영02-02","9","영어","표현","대상이나 인물의 감정을 묘사한다."],["9영02-03","9","영어","표현","친숙한 주제에 관해 사실적 정보를 설명한다."],["9영02-04","9","영어","표현","친숙한 주제에 관해 경험이나 계획을 설명한다."],["9영02-05","9","영어","표현","친숙한 주제에 관해 일이나 사건의 논리적 관계를 설명한다."],["9영02-06","9","영어","표현","친숙한 주제에 관해 자신의 의견을 주장한다."],["9영02-07","9","영어","표현","친숙한 주제에 관해 듣거나 읽고 내용을 요약한다."],["9영02-08","9","영어","표현","간단한 일기, 편지, 이메일 등의 글을 쓴다."],["9영02-09","9","영어","표현","적절한 매체를 활용하여 정보 윤리를 준수하며 말하거나 쓴다."],["9영02-10","9","영어","표현","적절한 전략을 활용하여 상황이나 목적에 맞게 말하거나 쓴다."],["9영02-11","9","영어","표현","상대방을 배려하는 태도로 말하거나 쓴다."],["9한01-01","9","한문","한자와 어휘","한자의 모양⋅음⋅뜻을 구별한다."],["9한01-02","9","한문","한자와 어휘","한자가 만들어진 원리를 구별한다."],["9한01-03","9","한문","한자와 어휘","단어의 짜임을 구별한다."],["9한01-04","9","한문","한자와 어휘","단어와 성어를 읽고 풀이한다."],["9한01-05","9","한문","한자와 어휘","단어와 성어를 맥락에 맞게 활용하여 소통하는 태도를 기른다."],["9한01-06","9","한문","한자와 어휘","한자 문화권의 문화에 대한 지식을 익혀 이해와 교류 증진에 참여하려는 태도를 기른다."],["9한02-01","9","한문","문장","문장의 구조를 구별한다."],["9한02-02","9","한문","문장","글을 의미에 맞게 읽는다."],["9한02-03","9","한문","문장","글을 바르게 풀이한다."],["9한02-04","9","한문","문장","글의 내용을 이해하고 주제를 파악한다."],["9한02-05","9","한문","문장","글에 담긴 선인들의 지혜를 이해하여 미래 사회에 필요한 인성을 함양한다."],["9한02-06","9","한문","문장","글에 담긴 전통문화의 의미와 가치를 알고 소중하게 여기는 태도를 기른다."],["9환01-01","9","환경","환경과 인간","일상생활이 환경에 미치는 영향과 환경이 일상생활에 미치는 영향을 조사하여 인간과 환경의 관계를 탐색하고, 환경에 대한 우리의 역할과 책임을 인식한다."],["9환01-02","9","환경","환경과 인간","환경 갈등 상황에서 환경에 대한 자신의 관점과 의견을 제시하고, 환경을 바라보는 다양한 관점을 비교하여 환경과 인간의 관계를 탐색한다."],["9환01-03","9","환경","환경과 인간","오감을 활용해 자연을 체험하고, 자연의 아름다움이나 변화, 훼손 등에 대한 생각과 감정을 다양한 방법으로 표현한다."],["9환01-04","9","환경","환경과 인간","학교나 지역 환경 탐사를 통해 지역과 나의 관계를 이해하고, 탐사 결과를 다양한 매체와 방법으로 제시한다."],["9환02-01","9","환경","환경 체계","생태계 구성 요소인 물, 대기, 토양, 생물이 지구 생태계의 유지에 기여하는 역할과 특징을 살펴보고, 이를 통해 지구 생태계 구성 요소의 상호 작용을 파악한다."],["9환02-02","9","환경","환경 체계","지구 생태계 구성 요소와 인간 사회의 상호 작용 사례를 지역적, 지구적 차원에서 찾아보고, 환경의 다양한 수준에 미치는 영향과 시간의 흐름에 따른 변화를 추론한다."],["9환02-03","9","환경","환경 체계","환경은 물, 대기, 토양, 생물로 구성된 지구 생태계와 정치⋅경제⋅문화⋅법과 제도 등 인간 사회의 상호 작용을 기반으로 다양성과 복잡성을 가진 시스템임을 탐구한다."],["9환03-01","9","환경","환경 문제와 쟁점","지구 생태계의 구성 요소와 관련된 환경 문제를 조사하여 그 문제의 특성을 파악하고, 환경 문제의 발생 원인과 영향을 사회, 문화, 경제 등 여러 측면을 고려하여 분석하고 추론한다."],["9환03-02","9","환경","환경 문제와 쟁점","신⋅재생 에너지, 핵발전, 자원 재활용과 쓰레기 처리 등 에너지 이용 및 자원 순환과 관련된 문제를 탐구하는 과정을 계획하여 수행하고, 관련된 요소 간의 상호 작용을 분석한다."],["9환03-03","9","환경","환경 문제와 쟁점","환경 문제의 원인과 영향을 데이터를 기반으로 조사하고, 관련 쟁점과 해결 방안을 탐구한다."],["9환03-04","9","환경","환경 문제와 쟁점","지역 환경 문제가 지구 환경 문제와 어떻게 연결되어 있으며, 지구 생태계의 구성 요소 중 어떤 것과 관련이 있는지 파악하고, 지속가능성과 형평성을 고려하여 해결 방안을 제시한다."],["9환04-01","9","환경","기후위기와 기후행동","지구 역사와 함께 기후가 어떻게 변화해 왔고 전망되는지 이해하고 현재의 기후위기 상황을 인식한다."],["9환04-02","9","환경","기후위기와 기후행동","생물다양성 감소 등 기후변화의 영향과 피해, 갈등과 불평등에 관한 사례를 탐구하고, 사람과 자연이 겪는 고통에 공감하며 지구 공동체의 관점에서 기후변화 피해를 줄이는 방법을 토의한다."],["9환04-03","9","환경","기후위기와 기후행동","온실가스의 종류와 특성을 알아보고, 온실가스 배출원과 배출량을 비교하여 인간 활동이 기후변화에 끼친 영향을 파악한다."],["9환04-04","9","환경","기후위기와 기후행동","지속가능한 미래를 위한 기후위기 대응 방향을 토의하고, 개인적⋅지역적⋅국가적 차원의 기후행동 사례를 탐구한다."],["9환04-05","9","환경","기후위기와 기후행동","학교와 지역에서 실천할 수 있는 기후행동을 계획하고 참여하며 그 결과를 성찰한다."],["9환05-01","9","환경","지속가능성과 시민 참여","지속가능성의 의미를 이해하여 주거, 교통, 먹거리, 소비 등 일상생활에서 지속가능발전의 사례를 찾아보고, 창의적⋅개방적 태도로 지속가능한 미래 모습을 구상해 보며 자신의 견해를 제시한다."],["9환05-02","9","환경","지속가능성과 시민 참여","생태시민의 의미와 역할을 이해하여 미래 세대와 비인간 존재에 대한 배려와 존중이 필요함을 인식하고 배려의 대상과 범위에 대해 토의한다."],["9환05-03","9","환경","지속가능성과 시민 참여","환경 정의 측면에서 자신이 살고 있는 마을이나 지역에 적용할 수 있는 지속가능한 사회를 위한 개인적⋅사회적 실천 방안을 조사하여 참여해 보고,
