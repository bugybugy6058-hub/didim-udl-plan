<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>디딤을 위한 UDL 3.0 지도안 설계기</title>
<meta name="description" content="2022 개정 교육과정 성취기준을 바탕으로 디딤 활용 UDL 3.0 공통 지도안을 설계합니다.">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* Layout: sticky document header, numbered step rail on the left, one working panel at a time. UDL principle colors (참여·표상·행동표현) encode meaning everywhere. */
:root{
  --bg:#F1F4F6; --surface:#FFFFFF; --surface-2:#E8EDF1; --ink:#16212A; --ink-2:#4B5966; --ink-3:#6F7C88; --line:#D3DBE1;
  --accent:#1E5A84; --accent-ink:#FFFFFF; --accent-soft:#DCE9F3;
  --e:#2C7A57; --e-soft:#DDEFE5; --r:#6A4D9E; --r-soft:#ECE5F6; --a:#2A62A6; --a-soft:#DFE9F7;
  --ok:#2C7A57; --warn:#A8690F; --warn-soft:#FBEFD9; --bad:#B0412C; --bad-soft:#F8E1DB;
  --hi:#FFF4C8;
  --f-display:'Noto Serif KR', 'Apple SD Gothic Neo', serif; --f-body:'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --r-s:6px; --r-m:10px;
  /* Darcy Hong Factory 문양: 청록(운동장 잔디·안전) · 오렌지(디딤의 빛·즐거움, 기준색) · 남색(함께 지키는 약속·신뢰) */
  --mk-1:#2A9D8F; --mk-2:#F2862E; --mk-3:#2B4C7E; --mk-ink:#B4560F;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10161B; --surface:#172028; --surface-2:#1F2A33; --ink:#E5ECF1; --ink-2:#A9B6C1; --ink-3:#8796A3; --line:#2C3A45;
  --accent:#78B0DD; --accent-ink:#0E1A24; --accent-soft:#1D3242;
  --e:#6CC69B; --e-soft:#1B3428; --r:#B59BE6; --r-soft:#2B2340; --a:#7EADEB; --a-soft:#1C2C42;
  --ok:#6CC69B; --warn:#E3AC57; --warn-soft:#3A2D16; --bad:#EE8B76; --bad-soft:#3D221C; --hi:#3A3418; --mk-1:#4CC2B3; --mk-2:#F79A4A; --mk-3:#7599D6; --mk-ink:#F7A863; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10161B; --surface:#172028; --surface-2:#1F2A33; --ink:#E5ECF1; --ink-2:#A9B6C1; --ink-3:#8796A3; --line:#2C3A45;
  --accent:#78B0DD; --accent-ink:#0E1A24; --accent-soft:#1D3242;
  --e:#6CC69B; --e-soft:#1B3428; --r:#B59BE6; --r-soft:#2B2340; --a:#7EADEB; --a-soft:#1C2C42;
  --ok:#6CC69B; --warn:#E3AC57; --warn-soft:#3A2D16; --bad:#EE8B76; --bad-soft:#3D221C; --hi:#3A3418; --mk-1:#4CC2B3; --mk-2:#F79A4A; --mk-3:#7599D6; --mk-ink:#F7A863; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;min-width:0;flex:1 1 380px}
.factory{display:flex;align-items:center;gap:10px;flex:none}
.factory svg{width:34px;height:34px;flex:none;display:block}
.wm{display:flex;flex-direction:column;line-height:1.15}
.wm-1{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.wm-2{font-size:19px;font-weight:700;letter-spacing:-.015em}
.brand-div{width:1px;height:44px;background:var(--line);flex:none}
.prog{display:flex;flex-direction:column;min-width:0;flex:0 1 auto}
.prog b{font-family:var(--f-display);font-size:21px;font-weight:700;line-height:1.25;letter-spacing:-.015em}
.prog .tagline{font-size:12.5px;font-weight:600;color:var(--mk-ink);line-height:1.4;margin-top:2px}
.credit{display:flex;flex-direction:column;justify-content:center;gap:1px;align-self:stretch;padding-left:14px;border-left:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink-2);line-height:1.5;white-space:nowrap}
@media (max-width:560px){ .brand-div{display:none} .prog{flex-basis:100%} .prog b{font-size:19px} .credit{flex-direction:row;flex-wrap:wrap;gap:0 10px;padding-left:0;border-left:0} }
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:5px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.top-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.saved{font-size:12px;color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:7px 12px;cursor:pointer;font-weight:500;font-size:14px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ai{border-color:var(--r);color:var(--r);background:var(--r-soft)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.shell{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:236px minmax(0,1fr);gap:22px;
  padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);align-self:start;display:flex;flex-direction:column;gap:2px}
.steps .grp{font-size:11.5px;letter-spacing:.08em;color:var(--ink-3);margin:12px 10px 4px;font-weight:600}
.step-btn{display:grid;grid-template-columns:28px 1fr;gap:0 8px;align-items:center;text-align:left;border:0;background:transparent;border-radius:var(--r-s);padding:7px 10px;cursor:pointer}
.step-btn .n{grid-row:span 2;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;background:var(--surface-2);color:var(--ink-2);font-variant-numeric:tabular-nums}
.step-btn .t{font-weight:600;font-size:14px}
.step-btn .s{font-size:12px;color:var(--ink-3)}
.step-btn[aria-current="page"]{background:var(--surface)}
.step-btn[aria-current="page"] .n{background:var(--accent);color:var(--accent-ink)}
.step-btn .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-left:6px;vertical-align:middle}
main{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:22px clamp(16px,3vw,28px);display:flex;flex-direction:column;gap:18px}
.ph{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--accent);font-weight:700}
.ph h2{font-size:24px}
.ph p{margin:0;color:var(--ink-2);max-width:70ch}
.banner{background:var(--hi);border-radius:var(--r-s);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:14px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.form-grid.two{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12.5px;font-weight:600;color:var(--ink-2)}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:7px 9px;font-size:14.5px}
textarea{resize:vertical;line-height:1.55}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
.actions-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.status{font-size:13px;color:var(--ink-2)}
.status.err{color:var(--bad)}
.note{font-size:12.5px;color:var(--ink-3);margin:0}
.sub{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.sub h3{font-size:17px}
.sub-head{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.std-row{display:grid;grid-template-columns:140px minmax(0,1fr) auto;gap:8px;align-items:start}
.std-item{display:flex;flex-direction:column;gap:4px}
.std-chk{font-size:12.5px;margin:0;padding:5px 10px;border-radius:var(--r-s);line-height:1.55}
.std-chk.ok{background:var(--e-soft)} .std-chk.ok .mark{color:var(--ok);font-weight:700}
.std-chk.warn{background:var(--warn-soft)} .std-chk.warn .mark{color:var(--warn);font-weight:700}
.std-chk.bad{background:var(--bad-soft)} .std-chk.bad .mark{color:var(--bad);font-weight:700}
.std-chk.muted{color:var(--ink-3);padding-left:2px}
.std-chk .btn{margin-left:6px}
.std-chk q{font-style:normal;color:var(--ink-2)}
.cur-tag{vertical-align:middle;background:var(--mk-2);color:#fff;font-family:var(--f-body);font-size:11.5px;margin-left:6px}
.cur-pick{border:1px solid var(--line);border-radius:var(--r-m);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.cur-head{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.cur-filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cur-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:360px;overflow:auto}
.cur-list li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px;font-size:13.5px;line-height:1.5}
.cur-list code{font-weight:700;margin-right:4px}
@media (max-width:760px){.cur-filters{grid-template-columns:1fr 1fr}}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer;line-height:1.4}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.lv{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 6px;border-radius:5px;font-size:12.5px;font-weight:700;color:#fff}
.lv-상{background:#2A62A6}.lv-중{background:#2C7A57}.lv-하{background:#A8690F}
:root[data-theme="dark"] .lv, :root:not([data-theme="light"]) .lv{color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.lcard{border:1px solid var(--line);border-radius:var(--r-m);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface);min-width:0}
.lrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr) 74px 32px;gap:6px;align-items:center}
.lrow.dis{grid-template-columns:minmax(0,1fr) minmax(0,.8fr) minmax(0,1fr)}
.lrow.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.icon-btn{border:1px solid var(--line);background:transparent;border-radius:var(--r-s);height:32px;cursor:pointer;color:var(--ink-3);font-size:17px;line-height:1}
.icon-btn:hover{color:var(--bad);border-color:var(--bad)}
details.pick summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600;list-style:none}
details.pick summary::-webkit-details-marker{display:none}
details.pick summary::before{content:"＋ "}
details.pick[open] summary::before{content:"－ "}
details.pick .chips{margin-top:8px}
.trait-sel{font-size:13px;color:var(--ink-2)}
.trait-sel b{color:var(--ink)}
.matrix{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.matrix th,.matrix td{border:1px solid var(--line);padding:5px 9px;text-align:center}
.matrix th{background:var(--surface-2);font-weight:600}
.scroll{overflow-x:auto;max-width:100%}
.goal-common{border:2px solid var(--accent);border-radius:var(--r-m);padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--accent-soft)}
.goal-common textarea{font-size:15.5px;font-weight:500}
.lvcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lvcard{border:1px solid var(--line);border-top:4px solid var(--c);border-radius:var(--r-m);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lvcard h3{font-size:16px;display:flex;align-items:center;gap:8px}
.lvcard .who{display:flex;flex-wrap:wrap;gap:4px}
.mods{font-size:12.5px;color:var(--ink-2)}
.edited{font-size:11.5px;color:var(--warn);font-weight:600}
.timebar{display:flex;height:30px;border-radius:var(--r-s);overflow:hidden;border:1px solid var(--line)}
.timebar div{display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;min-width:0;overflow:hidden;white-space:nowrap;padding:0 4px}
.st-도입{background:#4E7FA8}.st-전개{background:#2E5E7E}.st-정리{background:#7A6A9E}
.acard{border:1px solid var(--line);border-radius:var(--r-m);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ahead{display:grid;grid-template-columns:96px minmax(0,1fr) 84px auto;gap:8px;align-items:center}
.agrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.lvgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lvgrid .fld>span{display:flex;align-items:center;gap:6px}
.udl-chip{display:inline-flex;gap:5px;align-items:center;border-radius:999px;padding:2px 9px 2px 3px;font-size:12.5px;cursor:pointer;border:1px solid transparent;line-height:1.45}
.udl-chip code{font-family:var(--f-body);font-weight:700;font-size:11.5px;border-radius:999px;padding:0 6px;color:#fff}
.udl-chip[data-p="E"]{background:var(--e-soft)} .udl-chip[data-p="E"] code{background:var(--e)}
.udl-chip[data-p="R"]{background:var(--r-soft)} .udl-chip[data-p="R"] code{background:var(--r)}
.udl-chip[data-p="A"]{background:var(--a-soft)} .udl-chip[data-p="A"] code{background:var(--a)}
:root[data-theme="dark"] .udl-chip code{color:#10161B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .udl-chip code{color:#10161B}}
.udl-chip.off{background:transparent;border-color:var(--line);color:var(--ink-3)}
.udl-chip.off code{background:var(--surface-2)!important;color:var(--ink-3)!important}
.picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px}
.picker .col{display:flex;flex-direction:column;gap:5px;min-width:0}
.picker h4{margin:6px 0 0;font-size:12.5px;color:var(--ink-2)}
.env-list{display:flex;flex-direction:column;gap:6px}
.env-item{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center}
.env-item input[type=checkbox]{width:18px;height:18px}
.src{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.beh-cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.beh-col{border:1px solid var(--line);border-radius:var(--r-m);padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.beh-col h3{font-size:15px}
.beh-opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:7px 9px;font-size:13px;cursor:pointer;line-height:1.45}
.beh-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.beh-opt[aria-pressed="true"]::before{content:"✓ ";font-weight:700;color:var(--accent)}
.sel-list{display:flex;flex-direction:column;gap:6px}
.sel-item{display:grid;grid-template-columns:62px minmax(0,1fr) 32px;gap:8px;align-items:start}
/* map */
.tree{display:flex;flex-direction:column;align-items:center;gap:0}
.root{border:2px solid var(--accent);background:var(--accent-soft);border-radius:var(--r-m);padding:12px 16px;max-width:760px;text-align:center;font-weight:600}
.root small{display:block;font-weight:600;font-size:11.5px;letter-spacing:.08em;color:var(--accent)}
.stem{width:2px;height:18px;background:var(--line)}
.branches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;position:relative;padding-top:18px;border-top:2px solid var(--line)}
.branch{position:relative;border:1px solid var(--line);border-top:4px solid var(--c);border-radius:var(--r-m);padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;min-width:0}
.branch::before{content:"";position:absolute;top:-24px;left:50%;width:2px;height:20px;background:var(--line)}
.lmatrix{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;min-width:720px;font-size:12.5px}
.lmatrix>div{background:var(--surface);padding:7px 8px;min-width:0}
.lmatrix .hd{background:var(--surface-2);font-weight:600}
.lmatrix .rowhd{display:flex;align-items:center;justify-content:center}
.udlmap{display:grid;grid-template-columns:92px repeat(3,minmax(0,1fr));gap:6px}
.udlmap .hd{font-weight:700;font-size:13px;padding:6px;border-radius:var(--r-s);text-align:center}
.udlmap .rh{font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center}
.cell{border-radius:var(--r-s);padding:8px;display:flex;flex-direction:column;gap:5px;min-height:92px;border:1px solid transparent}
.cell b{font-size:13px}
.cell.empty{border:1px dashed var(--line);background:transparent!important;color:var(--ink-3)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* report */
.rep-top{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:18px;align-items:center}
.big-score{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.big-score .num{font-family:var(--f-display);font-size:42px;font-weight:700;line-height:1}
.radar text{fill:var(--ink-2);font-size:12px;font-family:var(--f-body)}
.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.mcard{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--r-m);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mhead{display:flex;gap:12px;align-items:center}
.mhead h3{font-size:15.5px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px}
.pill.ok{background:var(--e-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.effect{font-size:13.5px;color:var(--ink-2);margin:0}

다."],["12수학05-04","12","수학","자료와 가능성","생활 속 그래프를 보고 필요한 정보를 찾는다."],["12수학05-05","12","수학","자료와 가능성","생활 속에서 여러 가지 가능성을 경험한다."],["4과학01-01","4","과학","운동과 에너지","자석과 여러 가지 물체를 가까이했을 때 나타나는 현상을 관찰하고, 자석에 붙는 물체와 붙지 않는 물체를 분류한다."],["4과학01-02","4","과학","운동과 에너지","자석과 자석을 가까이했을 때 나타나는 현상을 관찰하고, 자석의 성질에 흥미를 갖는다."],["4과학01-03","4","과학","운동과 에너지","물체의 차가운 정도와 따뜻한 정도를 다양하게 표현하고, 차갑거나 뜨거운 물체를 다룰 때 주의할 점을 실천한다."],["4과학01-04","4","과학","운동과 에너지","소리가 나는 물체는 떨림이 있음을 알고, 생활 주변의 소리를 듣고 큰 소리와 작은 소리, 높은 소리와 낮은 소리로 구분한다."],["4과학01-05","4","과학","운동과 에너지","물체를 밀거나 당겼을 때 나타나는 현상을 관찰하여 힘을 이해한다."],["4과학01-06","4","과학","운동과 에너지","힘을 받은 물체의 위치 변화를 관찰하여 운동을 이해한다."],["4과학02-01","4","과학","물질","여러 가지 물질로 이루어진 물체를 감각기관을 통해 관찰한다."],["4과학02-02","4","과학","물질","생활 주변의 물체를 형태나 종류 등에 따라 분류한다."],["4과학02-03","4","과학","물질","생활 주변의 물체를 장소와 용도에 따라 분류한다."],["4과학02-04","4","과학","물질","생활 주변의 물체를 질감의 특성에 따라 분류한다."],["4과학03-01","4","과학","생명","우리 몸 각 부위의 생김새와 움직임을 관찰한다."],["4과학03-02","4","과학","생명","여러 가지 동물을 관찰하고 특징을 표현한다."],["4과학03-03","4","과학","생명","여러 가지 식물을 관찰하고 특징을 표현한다."],["4과학03-04","4","과학","생명","생물의 특징을 관찰하고 생물을 소중하게 여기는 태도를 기른다."],["4과학04-01","4","과학","지구","생활 주변 자연환경의 다양한 모습을 관찰하고, 지구의 자연환경에 흥미를 갖는다."],["4과학04-02","4","과학","지구","지구 모양이 둥글다는 것을 알고, 지구 표면을 구성하는 육지와 바다를 구분한다."],["4과학04-03","4","과학","지구","날씨와 이에 따른 생활 모습을 관찰하고, 날씨가 우리 생활에 중요함을 인식한다."],["4과학04-04","4","과학","지구","태양, 달, 별을 관찰하여 낮과 밤하늘의 특징을 구분하고, 하늘 관찰에 흥미를 갖는다."],["6과학01-01","6","과학","운동과 에너지","전기가 통하는 물질과 통하지 않는 물질을 분류하고, 그 특성을 이해한다."],["6과학01-02","6","과학","운동과 에너지","물체의 차가운 정도와 따뜻한 정도를 온도로 표현함을 알고, 온도계를 이용하여 물체의 온도를 정확하게 측정한다."],["6과학01-03","6","과학","운동과 에너지","물체를 보기 위해서 빛이 있어야 함을 알고 빛이 직진하는 성질을 관찰하여 흥미를 갖는다."],["6과학01-04","6","과학","운동과 에너지","거울에 비친 모습과 실제 모습을 비교하고, 생활 속 여러 가지 거울의 특징을 관찰한다."],["6과학01-05","6","과학","운동과 에너지","여러 가지 물체의 운동을 관찰하여 속력을 비교하고, 속력과 관련된 안전 수칙을 알고 교통안전을 실천한다."],["6과학02-01","6","과학","물질","생활 주변의 물체를 물질의 종류에 따라 분류한다."],["6과학02-02","6","과학","물질","생활 주변의 물질을 고체, 액체, 기체로 분류한다."],["6과학02-03","6","과학","물질","생활 주변의 고체 물질을 녹여 여러 가지 용액을 만든다."],["6과학02-04","6","과학","물질","물에 녹는 물질과 녹지 않는 물질을 분류한다."],["6과학03-01","6","과학","생명","새끼를 낳는 동물과 알을 낳는 동물의 한살이를 다양하게 표현한다."],["6과학03-02","6","과학","생명","식물의 한살이를 다양하게 표현한다."],["6과학03-03","6","과학","생명","여러 가지 동물의 생활 모습을 분류하고 동물을 소중히 여기는 방법을 실천한다."],["6과학03-04","6","과학","생명","여러 가지 식물을 뿌리, 줄기, 잎, 꽃과 열매의 특징에 따라 분류하고 식물을 소중히 여기는 방법을 실천한다."],["6과학04-01","6","과학","지구","여러 가지 흙의 종류를 관찰하고, 흙의 형성과정을 모형 실험을 통해 이해한다."],["6과학04-02","6","과학","지구","지표가 물과 바람에 의해 변화함을 알고, 지표가 변화하는 여러 모습을 관찰한다."],["6과학04-03","6","과학","지구","날씨에 영향을 미치는 여러 가지 기상요소를 관찰하고, 우리 생활에 미치는 영향을 안다."],["6과학04-04","6","과학","지구","기온, 강수량, 습도, 바람의 측정을 통해 기상요소의 변화를 이해한다."],["6과학04-05","6","과학","지구","일기 예보를 통해 날씨를 예상하고, 생활 속에서 대응 방법을 조사한다."],["6과학04-06","6","과학","지구","인간 활동이 지구 환경에 미치는 영향을 알고, 환경보호를 위해 우리가 할 수 있는 일을 조사하여 실천한다."],["9과학01-01","9","과학","운동과 에너지","전기로 작동되는 여러 가지 전기기구를 관찰하여 에너지 변환을 이해하고, 전기기구의 편리함을 안다."],["9과학01-02","9","과학","운동과 에너지","고체, 액체, 기체에서의 열의 이동을 알고, 열의 이동이 나타나는 일상생활 사례를 관찰한다."],["9과학01-03","9","과학","운동과 에너지","실험을 통하여 소리의 발생과 전달 그리고 반사 현상을 관찰한다."],["9과학01-04","9","과학","운동과 에너지","수평 잡기 활동을 통해 물체의 무게를 비교하고, 여러 가지 무게 측정 방법에 흥미를 갖는다."],["9과학01-05","9","과학","운동과 에너지","무게를 정확히 측정하려면 저울이 필요함을 알고, 저울을 사용해 무게를 측정하고 비교한다."],["9과학02-01","9","과학","물질","물질의 성질을 이용하여 여러 가지 혼합물을 분리한다."],["9과학02-02","9","과학","물질","일상생활에서 이용하는 액체의 성질을 조사한다."],["9과학02-03","9","과학","물질","용질의 종류와 물의 온도에 따라 물에 녹는 용질의 양이 달라짐을 비교한다."],["9과학02-04","9","과학","물질","우리 주변에서 물의 세 가지 상태와 상태 변화의 예를 찾는다."],["9과학03-01","9","과학","생명","감각기관의 구조와 기능을 관찰한다."],["9과학03-02","9","과학","생명","우리 몸을 구성하는 뼈와 근육의 생김새와 기능을 관찰한다."],["9과학03-03","9","과학","생명","다양한 환경에 서식하는 동물을 관찰하고, 동물의 생김새와 생활 방식이 환경과 관련되어 있음을 인식한다."],["9과학03-04","9","과학","생명","다양한 환경에 서식하는 식물을 관찰하고, 식물의 생김새와 생활 방식이 환경과 관련되어 있음을 인식한다."],["9과학03-05","9","과학","생명","식물의 생장에 환경이 중요함을 알고, 실험을 통해 식물의 생장 조건을 찾는다."],["9과학03-06","9","과학","생명","생태계를 생물 요소와 비생물 요소로 분류한다."],["9과학04-01","9","과학","지구","육지의 물과 비교하여 바닷물의 특징을 알고, 밀물과 썰물에 따른 바닷가의 모습을 관찰한다."],["9과학04-02","9","과학","지구","바닷물의 작용으로 만들어진 바닷가 주변 지형을 관찰한다."],["9과학04-03","9","과학","지구","계절별로 달라지는 날씨의 특징을 알고, 날씨에 따른 생활 모습을 비교한다."],["9과학04-04","9","과학","지구","기후변화 현상의 예를 알고, 생활 속에서 대응 방법을 조사한다."],["9과학04-05","9","과학","지구","자연재해의 피해 사례를 조사하고, 자연재해에 대한 생활 속 대응 방법을 실천한다."],["12과학01-01","12","과학","운동과 에너지","전기기구를 안전하게 사용하는 방법과 전기를 절약하는 방법을 조사하고 실천한다."],["12과학01-02","12","과학","운동과 에너지","열의 이동을 막는 단열의 원리를 알고, 단열을 이용하는 일상생활 사례를 관찰한다."],["12과학01-03","12","과학","운동과 에너지","볼록렌즈와 오목렌즈로 물체를 관찰하고, 생활에서 렌즈가 이용되는 예를 조사한다."],["12과학01-04","12","과학","운동과 에너지","물체에 중력과 마찰력이 작용하여 나타나는 현상을 관찰하고 그 특성을 이해한다."],["12과학02-01","12","과학","물질","여러 가지 기체의 성질을 관찰하고, 일상생활에서 기체가 활용되는 경우를 조사한다."],["12과학02-02","12","과학","물질","여러 가지 용액의 상대적인 진하기를 비교한다."],["12과학02-03","12","과학","물질","물이 얼 때, 얼음이 녹을 때의 변화에 따른 무게와 부피를 비교한다."],["12과학02-04","12","과학","물질","물질이 연소하기 전과 후의 상태를 비교한다."],["12과학02-05","12","과학","물질","연소와 소화 조건을 알고, 소화 방법에 따른 화재 안전을 실천한다."],["12과학03-01","12","과학","생명","소화·배설 기관의 구조와 기능을 관찰한다."],["12과학03-02","12","과학","생명","순환·호흡 기관의 구조와 기능을 관찰한다."],["12과학03-03","12","과학","생명","인간의 탄생과 성장 과정에서 나타나는 신체 변화를 구분한다."],["12과학03-04","12","과학","생명","인간의 유전 현상을 관찰하고 가계도를 이용하여 표현한다."],["12과학03-05","12","과학","생명","식물 각 기관의 구조와 기능을 관찰한다."],["12과학03-06","12","과학","생명","우리 생활에서 동물과 식물의 특징을 활용한 사례를 조사한다."],["12과학03-07","12","과학","생명","생태계 구성요소가 서로 영향을 미침을 알고, 생태계 보전을 위해 우리가 할 수 있는 일을 조사하여 실천한다."],["12과학04-01","12","과학","지구","지층의 여러 가지 모양을 관찰한다."],["12과학04-02","12","과학","지구","모형을 통하여 화석 생성과정을 관찰하고, 지구의 과거 생물과 환경을 추리한다."],["12과학04-03","12","과학","지구","화산 활동과 지진으로 인한 지각의 변화를 관찰한다."],["12과학04-04","12","과학","지구","화산 활동과 지진이 우리 생활에 미치는 영향을 알고, 대처 방법을 조사하여 실천한다."],["12과학04-05","12","과학","지구","달의 특징과 별자리의 여러 모양을 알고, 밤하늘 관찰에 호기심과 즐거움을 느낀다."],["6실과01-01","6","실과","기본생활","건강을 위한 식생활의 중요성을 알고, 올바른 식습관을 실천한다."],["6실과01-02","6","실과","기본생활","조리 도구를 바르게 사용하여 간단한 음식을 만든다."],["6실과01-03","6","실과","기본생활","계절, 상황 등에 알맞은 옷차림을 알고, 단정한 의생활을 실천한다."],["6실과01-04","6","실과","기본생활","세탁 과정을 알고, 간단한 의복을 세탁한다."],["6실과01-05","6","실과","기본생활","쾌적한 생활환경의 필요성을 알고, 생활공간을 정리 정돈하며 청소한다."],["6실과01-06","6","실과","기본생활","환경 보호를 위해 바른 쓰레기 분리배출 습관을 갖는다."],["6실과01-07","6","실과","기본생활","이웃과 더불어 살아가기 위해 지켜야 하는 규칙과 예절을 실천한다."],["6실과01-08","6","실과","기본생활","다양한 여가활동을 탐색하고 나에게 맞는 여가생활을 즐긴다."],["6실과02-01","6","실과","기술·정보","공구의 올바른 사용 방법을 익혀 용도에 맞게 공구를 사용한다."],["6실과02-02","6","실과","기술·정보","생활용품을 만드는 활동을 통해 작업의 즐거움과 가치를 경험한다."],["6실과02-03","6","실과","기술·정보","일상생활을 편리하게 하는 정보통신 기기의 기초적인 기능을 익혀 실생활에서 활용한다."],["6실과02-04","6","실과","기술·정보","올바른 정보통신 기기 사용 습관을 기르고, 정보통신 예절을 실천한다."],["6실과02-05","6","실과","기술·정보","언플러그드 놀이 활동을 통해 일상생활 속 문제를 절차적 사고로 해결하는 태도를 갖는다."],["6실과03-01","6","실과","생명·안전","생활 속 동물을 돌보는 방법을 익히고, 생명을 존중하는 태도를 기른다."],["6실과03-02","6","실과","생명·안전","생활 속 식물 가꾸기를 통해 자연 친화적 태도를 기른다."],["6실과03-03","6","실과","생명·안전","가정에서 일어나는 위험 상황을 인식하고, 대처하는 방법을 익혀 안전한 생활 태도를 갖는다."],["6실과03-04","6","실과","생명·안전","학교에서 발생할 수 있는 안전사고의 대처 방법을 알고 실천한다."],["6실과03-05","6","실과","생명·안전","지역사회에서 안전의 중요성을 인식하고 안전사고를 예방하는 습관을 기른다."],["6실과04-01","6","실과","진로 인식","나의 꿈, 좋아하는 것, 잘하는 것 등 자신의 특성을 탐색한다."],["6실과04-02","6","실과","진로 인식","자신의 흥미와 적성을 바탕으로 다양한 직업의 종류를 탐색한다."],["6실과04-03","6","실과","진로 인식","일의 가치와 소중함을 알고 직업에 대한 긍정적인 태도를 기른다."],["6실과04-04","6","실과","진로 인식","진학할 수 있는 중학교 유형을 살펴보고 중학교 선택 과정에 참여한다."],["6실과04-05","6","실과","진로 인식","진학에 따른 교육 환경의 변화를 알아보고 진학을 준비한다."],["9진로01-01","9","진로와 직업","자기 인식","자신의 기본 정보를 파악한다."],["9진로01-02","9","진로와 직업","자기 인식","흥미, 적성, 장점과 단점, 성격 등 자신의 특성을 파악하여 자신을 소개한다."],["9진로01-03","9","진로와 직업","자기 인식","자신의 장점을 부각시키는 방법을 실천하며, 나를 소중히 여기는 마음을 기른다."],["9진로01-04","9","진로와 직업","자기 인식","자신의 특성과 관련 있는 진로와 직업 성향을 탐색한다."],["9진로01-05","9","진로와 직업","자기 인식","삶이 변화하는 과정을 이해하고 나의 과거, 현재를 파악하여 미래 모습을 표현한다."],["9진로02-01","9","진로와 직업","직업의 세계","직업의 사회적･경제적 의미를 알고 일에 대한 소중한 마음을 갖는다."],["9진로02-02","9","진로와 직업","직업의 세계","직업의 세계에 관심을 가지고 가족, 이웃 등 주변 사람들의 직업에 대하여 탐색한다."],["9진로02-03","9","진로와 직업","직업의 세계","학교 및 지역사회의 직군을 탐색하여 각 직군의 정보를 수집한다."],["9진로02-04","9","진로와 직업","직업의 세계","직군 체험을 통해 자신의 직업적 흥미나 관심이 있는 직군을 찾는다."],["9진로03-01","9","진로와 직업","작업 기초 능력","직군별 작업 과정의 순서를 익힌다."],["9진로03-02","9","진로와 직업","작업 기초 능력","직군에 따라 올바른 방법으로 작업에 참여한다."],["9진로03-03","9","진로와 직업","작업 기초 능력","직군에 적합한 도구를 사용하여 작업의 효율을 높인다."],["9진로03-04","9","진로와 직업","작업 기초 능력","직군별 작업 과정에서 안전에 유의한다."],["9진로04-01","9","진로와 직업","직업 태도","용모, 복장, 위생, 금전 등에 대한 기본적인 자기 관리 능력을 기른다."],["9진로04-02","9","진로와 직업","직업 태도","등하교, 수업, 점심, 쉬는 시간 등 시간에 대한 관리 능력을 기른다."],["9진로04-03","9","진로와 직업","직업 태도","집에서 학교까지 통학 수단을 활용하여 이동한다."],["9진로04-04","9","진로와 직업","직업 태도","간단한 지시에 따라 과제를 수행한다."],["9진로04-05","9","진로와 직업","직업 태도","인사를 하고 예절을 지키며 원만한 대인 관계를 형성한다."],["9진로04-06","9","진로와 직업","직업 태도","학교에서 요구되는 안전 규칙을 지킨다."],["9진로05-01","9","진로와 직업","진로 설계","자신의 흥미·적성, 작업 기능, 전환 능력 등의 직업적 잠재력을 파악한다."],["9진로05-02","9","진로와 직업","진로 설계","특수학교, 일반고, 특성화고 등에 대한 진학 정보를 수집한다."],["9진로05-03","9","진로와 직업","진로 설계","자신의 특성과 진학 정보를 연계하여 주요 관계자와 함께 진학 의사 결정에 참여한다."],["9진로05-04","9","진로와 직업","진로 설계","진학 결정에 능동적으로 참여하고 진학 계획을 점검하는 태도를 갖춘다."],["9진로06-01","9","진로와 직업","진로 준비","자신이 선택한 고등학교에 대한 위치와 환경 등의 정보를 수집한다."],["9진로06-02","9","진로와 직업","진로 준비","자신이 선택한 고등학교 교육과정의 변화되는 점을 알아보고 준비하는 과정에 참여한다."],["9진로06-03","9","진로와 직업","진로 준비","자신이 선택한 고등학교의 현장실습 유형과 방법을 알아보는 과정에 참여한다."],["9진로06-04","9","진로와 직업","진로 준비","진로 관련 교내 체험 및 지역사회 기관 탐방 등에 능동적인 자세로 참여한다."],["12진로01-01","12","진로와 직업","자기 인식","자신의 신체적 특성을 파악한다."],["12진로01-02","12","진로와 직업","자기 인식","자신의 심리·태도적 특성 등을 파악한다."],["12진로01-03","12","진로와 직업","자기 인식","자신의 특성을 직업과 연결하여 강점을 찾고 꿈을 표현한다."],["12진로01-04","12","진로와 직업","자기 인식","자신의 강점을 발전시키는 방법을 찾아 실천하여 자기개발에 주체적인 자세를 갖춘다."],["12진로01-05","12","진로와 직업","자기 인식","졸업 후 삶의 모습을 구체적으로 구상하며 미래에 대한 긍정적 태도를 기른다."],["12진로02-01","12","진로와 직업","직업의 세계","직업을 통해 얻을 수 있는 기쁨과 보람을 찾는다."],["12진로02-02","12","진로와 직업","직업의 세계","미래 사회에 적합한 새로운 직종의 정보를 수집하고 관심을 갖는 태도를 기른다."],["12진로02-03","12","진로와 직업","직업의 세계","학교 및 지역사회의 직종을 탐색하여 각 직종에 대한 정보를 수집한다."],["12진로02-04","12","진로와 직업","직업의 세계","직종 체험을 통해 흥미나 관심이 있는 직종을 찾는다."],["12진로03-01","12","진로와 직업","작업 기초 능력","직종에 따라 작업 단계와 절차를 확인한다."],["12진로03-02","12","진로와 직업","작업 기초 능력","직종에 따라 필요한 올바른 작업 기술을 익힌다."],["12진로03-03","12","진로 결과의 관계를 고려하여 내용을 예측하며 듣고 말한다."],["4국01-03","4","국어(청각장애)","듣기⋅말하기","상황에 적절한 준언어⋅비언어적 표현을 활용하여 듣고 말한다."],["4국01-04","4","국어(청각장애)","듣기⋅말하기","상황과 상대의 입장을 이해하고 예의를 지키며 대화한다."],["4국01-05","4","국어(청각장애)","듣기⋅말하기","목적과 주제에 알맞게 자료를 정리하여 자신감 있게 발표한다."],["4국01-06","4","국어(청각장애)","듣기⋅말하기","주제에 적절한 의견과 이유를 제시하고 서로의 생각을 교환하며 토의한다."],["4국01-07","4","국어(청각장애)","듣기⋅말하기","말⋅수어로 듣거나 본 내용에서 주제나 의견을 찾아내어 대화를 나눈다."],["4국02-01","4","국어(청각장애)","읽기","글의 의미를 파악하며 유창하게 글을 읽는다."],["4국02-02","4","국어(청각장애)","읽기","문단과 글에서 중심 생각을 파악하고 내용을 간추린다."],["4국02-03","4","국어(청각장애)","읽기","질문을 활용하여 글을 예측하며 읽고 자신의 읽기 과정을 점검한다."],["4국02-04","4","국어(청각장애)","읽기","글에 나타난 사실과 의견을 구분하고 필자와 자신의 의견을 비교한다."],["4국02-05","4","국어(청각장애)","읽기","글이나 자료의 출처가 믿을 만한지 판단한다."],["4국02-06","4","국어(청각장애)","읽기","바람직한 읽기 습관을 형성하고 읽기에 대한 자신감을 기른다."],["4국02-07","4","국어(청각장애)","읽기","글 또는 수어 영상 자료를 보고 주요한 내용을 파악하여 말⋅수어로 표현한다."],["4국03-01","4","국어(청각장애)","쓰기","중심 문장과 뒷받침 문장을 갖추어 문단을 쓰고, 문장과 문단을 중심으로 고쳐 쓴다."],["4국03-02","4","국어(청각장애)","쓰기","절차와 결과가 드러나게 정확한 표현으로 보고하는 글을 쓴다."],["4국03-03","4","국어(청각장애)","쓰기","대상에 대한 자신의 의견과 그렇게 생각한 이유가 드러나게 글을 쓴다."],["4국03-04","4","국어(청각장애)","쓰기","목적과 주제를 고려하여 독자에게 마음을 전하는 글을 쓴다."],["4국03-05","4","국어(청각장애)","쓰기","자신의 쓰기 과정을 점검하며 쓰기에 자신감을 갖는다."],["4국03-06","4","국어(청각장애)","쓰기","자막이나 수어를 포함하는 시각적 영상 자료를 보고 마음을 표현하는 글을 쓴다."],["4국03-07","4","국어(청각장애)","쓰기","작문 활동 시 이어 주는 말을 적절하게 사용하여 문장을 쓰려는 태도를 함양한다."],["4국04-01","4","국어(청각장애)","문법","단어와 단어 간의 의미 관계를 파악한다."],["4국04-02","4","국어(청각장애)","문법","단어를 분류하고 국어사전을 활용하여 능동적인 국어 활동을 한다."],["4국04-03","4","국어(청각장애)","문법","기본적인 문장의 짜임을 이해하고 적절하게 사용한다."],["4국04-04","4","국어(청각장애)","문법","글과 담화에 쓰인 높임 표현과 지시⋅접속 표현을 이해하고 상황에 맞게 표현한다."],["4국04-05","4","국어(청각장애)","문법","언어가 의사소통과 관계 형성의 수단임을 이해하고 국어 및 수어를 소중히 여기는 태도를 지닌다."],["4국05-01","4","국어(청각장애)","문학","인물과 이야기의 흐름을 중심으로 작품을 감상한다."],["4국05-02","4","국어(청각장애)","문학","자신의 경험을 바탕으로 작품 속 세계와 현실 세계를 비교하여 작품을 감상한다."],["4국05-03","4","국어(청각장애)","문학","작품을 듣거나 읽고 마음에 드는 작품을 소개한다."],["4국05-04","4","국어(청각장애)","문학","감각적 표현에 유의하여 작품을 감상하고, 감각적 표현을 활용하여 자신의 생각이나 감정을 표현한다."],["4국05-05","4","국어(청각장애)","문학","재미나 감동을 느끼며 작품을 즐겨 감상하는 태도를 지닌다."],["4국05-06","4","국어(청각장애)","문학","작품의 이야기 흐름을 말⋅글⋅수어 등의 적절한 의사소통 양식으로 표현한다."],["4국06-01","4","국어(청각장애)","매체","인터넷에서 학습에 필요한 다양한 자료를 탐색하고 목적에 맞게 자료를 선택한다."],["4국06-02","4","국어(청각장애)","매체","매체를 활용하여 간단한 발표 자료를 만든다."],["4국06-03","4","국어(청각장애)","매체","매체 소통 윤리를 고려하여 매체 자료를 활용하고 공유한다."],["4국06-04","4","국어(청각장애)","매체","인터넷 수어 사전을 활용하여 다양한 어휘를 탐색하고 익힌다."],["6국01-01","6","국어(청각장애)","듣기⋅말하기","대화에서 생략된 내용을 추론하며 듣는다."],["6국01-02","6","국어(청각장애)","듣기⋅말하기","주장을 파악하고 이유나 근거가 타당한지 평가하며 듣는다."],["6국01-03","6","국어(청각장애)","듣기⋅말하기","주제와 관련하여 궁금한 내용을 질문하며 적극적으로 듣고 말한다."],["6국01-04","6","국어(청각장애)","듣기⋅말하기","면담의 절차를 이해하고 상대와 매체를 고려하여 면담한다."],["6국01-05","6","국어(청각장애)","듣기⋅말하기","자료를 선별하여 핵심 정보를 중심으로 내용을 구성하고 매체를 활용하여 발표한다."],["6국01-06","6","국어(청각장애)","듣기⋅말하기","토의에 협력적으로 참여하며 서로의 의견을 비교하고 조정한다."],["6국01-07","6","국어(청각장애)","듣기⋅말하기","절차와 규칙을 지키고 타당한 이유와 근거를 제시하며 토론한다."],["6국01-08","6","국어(청각장애)","듣기⋅말하기","대화, 토의, 토론, 의견 발표 등의 상황에서 말과 수어를 함께 사용하여 표현하려는 태도를 기른다."],["6국02-01","6","국어(청각장애)","읽기","글의 구조를 고려하며 주장이나 주제를 파악하고 글 내용을 요약한다."],["6국02-02","6","국어(청각장애)","읽기","글에서 생략된 내용이나 함축된 표현을 문맥을 고려하여 추론한다."],["6국02-03","6","국어(청각장애)","읽기","글이나 자료를 읽고 내용의 타당성과 표현의 적절성을 평가한다."],["6국02-04","6","국어(청각장애)","읽기","문제 상황과 관련된 다양한 관점의 글을 읽고 이를 문제 해결에 활용한다."],["6국02-05","6","국어(청각장애)","읽기","긍정적인 읽기 동기를 형성하고 적극적으로 읽기에 참여하는 태도를 기른다."],["6국02-06","6","국어(청각장애)","읽기","글의 내용과 어울리는 다양한 시각적 영상 자료를 스스로 찾아 활용하며 글의 내용을 파악한다."],["6국03-01","6","국어(청각장애)","쓰기","알맞은 내용을 선정하여 대상의 특성이 나타나게 설명하는 글을 쓴다."],["6국03-02","6","국어(청각장애)","쓰기","적절한 근거를 사용하고 인용의 출처를 밝히며 주장하는 글을 쓴다."],["6국03-03","6","국어(청각장애)","쓰기","체험한 일에 대한 감상을 나타내는 글을 쓴다."],["6국03-04","6","국어(청각장애)","쓰기","독자와 매체를 고려하여 내용을 생성하고 표현하며 글을 쓴다."],["6국03-05","6","국어(청각장애)","쓰기","쓰기 과정을 점검⋅조정하며 글을 쓰고, 글 전체를 대상으로 통일성 있게 고쳐 쓴다."],["6국03-06","6","국어(청각장애)","쓰기","쓰기에 적극적으로 참여하며 자신의 글을 독자와 공유하는 태도를 지닌다."],["6국03-07","6","국어(청각장애)","쓰기","청각장애 학생 특성에 따라 개별화하여 제공된 시각적 영상 자료를 보고 주어진 글의 특성과 내용을 파악하여 글로 표현한다."],["6국04-01","6","국어(청각장애)","문법","음성 언어 및 문자 언어의 특성을 이해하고 다양한 매체 자료에서 표현 효과를 평가한다."],["6국04-02","6","국어(청각장애)","문법","표준어와 방언의 기능을 파악하고 언어 공동체와 국어생활과의 관계를 이해한다."],["6국04-03","6","국어(청각장애)","문법","고유어와 관용 표현의 쓰임과 가치를 이해하고 상황에 맞게 표현한다."],["6국04-04","6","국어(청각장애)","문법","문장 성분을 이해하고 호응 관계가 올바른 문장을 구성한다."],["6국04-05","6","국어(청각장애)","문법","글과 담화에 쓰인 시간 표현을 이해하고 상황에 맞게 표현한다."],["6국04-06","6","국어(청각장애)","문법","글과 담화에 쓰인 단어 및 문장, 띄어쓰기를 민감하게 살펴 바르게 고치는 태도를 지닌다."],["6국04-07","6","국어(청각장애)","문법","바른 수어 사용의 필요성을 알고, 수어를 정확하게 사용한다."],["6국05-01","6","국어(청각장애)","문학","작가의 의도를 생각하며 작품을 읽는다."],["6국05-02","6","국어(청각장애)","문학","비유적 표현의 효과에 유의하여 작품을 감상한다."],["6국05-03","6","국어(청각장애)","문학","소설이나 극을 읽고 인물, 사건, 배경을 파악한다."],["6국05-04","6","국어(청각장애)","문학","인상적인 부분을 중심으로 작품에 대한 의견을 나눈다."],["6국05-05","6","국어(청각장애)","문학","자신의 경험을 시, 소설, 극, 수필 등 적절한 갈래로 표현한다."],["6국05-06","6","국어(청각장애)","문학","작품을 읽고 자신의 삶과 연관 지어 성찰하는 태도를 지닌다."],["6국05-07","6","국어(청각장애)","문학","말⋅수어 비유 표현으로 동시, 이야기를 창작한다."],["6국06-01","6","국어(청각장애)","매체","정보 검색 도구를 활용하여 자신의 목적에 맞는 매체 자료를 찾는다."],["6국06-02","6","국어(청각장애)","매체","수어, 자막이 사용된 뉴스 및 각종 정보 매체 자료의 신뢰성을 평가한다."],["6국06-03","6","국어(청각장애)","매체","적합한 양식과 수용자의 반응을 고려하여 복합양식 매체 자료를 제작하고 공유한다."],["6국06-04","6","국어(청각장애)","매체","자신의 매체 이용 양상에 대해 성찰한다."],["9국01-01","9","국어(청각장애)","듣기⋅말하기","화자의 의도와 관점을 추론하며 듣는다."],["9국01-02","9","국어(청각장애)","듣기⋅말하기","설득 전략을 비판적으로 분석하며 듣는다."],["9국01-03","9","국어(청각장애)","듣기⋅말하기","담화 공동체에 따른 듣기⋅말하기 방식의 다양성을 고려하여 듣고 말한다."],["9국01-04","9","국어(청각장애)","듣기⋅말하기","상대의 말을 경청하고 상대의 감정과 입장에 공감하는 반응을 보이며 대화한다."],["9국01-05","9","국어(청각장애)","듣기⋅말하기","면담의 다양한 목적과 상대를 고려하여 질문을 점검하고 효과적으로 면담한다."],["9국01-06","9","국어(청각장애)","듣기⋅말하기","다양한 자료를 재구성하여 내용을 체계적으로 조직하고 청중이 이해하기 쉽게 발표한다."],["9국01-07","9","국어(청각장애)","듣기⋅말하기","토의에서 다양한 의견을 교환하여 대안을 마련하고 문제를 해결한다."],["9국01-08","9","국어(청각장애)","듣기⋅말하기","토론에서 반론을 고려하여 타당한 논증을 구성하고 논리적으로 반박한다."],["9국01-09","9","국어(청각장애)","듣기⋅말하기","서로의 감정이나 바라는 바를 진솔하게 표현하면서 갈등을 조정한다."],["9국01-10","9","국어(청각장애)","듣기⋅말하기","언어폭력의 문제점을 성찰하고, 서로를 존중하는 표현을 사용하여 말한다."],["9국01-11","9","국어(청각장애)","듣기⋅말하기","듣기⋅말하기 과정을 점검하고 듣기⋅말하기의 어려움을 효과적으로 조정한다."],["9국01-12","9","국어(청각장애)","듣기⋅말하기","그림, 영상, 수어 영상 도서 등 다양한 시각적 영상 자료를 보고 자신의 의견이나 주장을 적절한 의사소통 전략을 사용하여 말⋅수어로 표현한다."],["9국02-01","9","국어(청각장애)","읽기","읽기는 사회⋅문화적 맥락에서 의미를 구성하는 과정임을 이해하며 사회적 독서에 참여하고 사회적 독서 문화 형성에 기여한다."],["9국02-02","9","국어(청각장애)","읽기","읽기 목적과 글의 구조를 고려하며 글을 효과적으로 요약한다."],["9국02-03","9","국어(청각장애)","읽기","독자의 배경지식과 글에 나타난 정보 등을 활용하여 글에 드러나지 않은 의도나 관점을 추론하며 읽는다."],["9국02-04","9","국어(청각장애)","읽기","복합양식으로 구성된 글이나 자료의 내용 타당성과 신뢰성, 표현 방법의 적절성을 평가하며 읽는다."],["9국02-05","9","국어(청각장애)","읽기","글에 사용된 다양한 설명 방법과 논증 방법을 파악하고, 그 타당성을 평가하며 읽는다."],["9국02-06","9","국어(청각장애)","읽기","동일한 화제를 다룬 여러 글이나 자료를 주제 통합적으로 읽는다."],["9국02-07","9","국어(청각장애)","읽기","진로나 관심 분야에 대한 다양한 책이나 자료를 스스로 찾아 읽는다."],["9국02-08","9","국어(청각장애)","읽기","자신의 독서 상황과 수준에 맞는 글을 선정하고 읽기 과정을 점검⋅조정하며 읽는다."],["9국02-09","9","국어(청각장애)","읽기","동일 화제를 다룬 글과 수어 영상 도서 등 다양한 시각적 영상 자료를 통해 자신의 삶과 연관성을 성찰하며 읽는다."],["9국03-01","9","국어(청각장애)","쓰기","대상의 특성에 적합한 설명 방법을 활용하여 글을 쓴다."],["9국03-02","9","국어(청각장애)","쓰기","복수의 자료를 활용하여 다양한 형식으로 정보를 전달하는 글을 쓴다."],["9국03-03","9","국어(청각장애)","쓰기","주장을 뒷받침할 수 있는 타당한 근거를 들고 적절한 표현을 사용하여 주장하는 글을 쓴다."],["9국03-04","9","국어(청각장애)","쓰기","의견 차이가 있는 사안에 대해 자료를 수집하고 사회⋅문화적 맥락을 고려하며 주장하는 글을 쓴다."],["9국03-05","9","국어(청각장애)","쓰기","자신의 삶과 경험을 바탕으로 정서를 진솔하게 표현하는 글을 쓴다."],["9국03-06","9","국어(청각장애)","쓰기","다양한 표현을 활용하여 자신의 생각과 느낌이 드러나는 글을 쓰고 독자와 공유한다."],["9국03-07","9","국어(청각장애)","쓰기","복합양식 자료를 활용하여 내용을 생성하고 글의 유형을 고려하여 내용을 조직하며 글을 쓴다."],["9국03-08","9","국어(청각장애)","쓰기","쓰기 과정과 전략을 점검⋅조정하며 글을 쓰고, 독자를 고려하여 글을 고쳐 쓴다."],["9국03-09","9","국어(청각장애)","쓰기","언어 공동체의 구성원인 필자로서 자신에 대해 성찰하며, 윤리적 소통 문화를 형성하는 데에 기여한다."],["9국03-10","9","국어(청각장애)","쓰기","그림, 영상, 수어 영상 도서 등 다양한 시각적 영상 자료를 보고 자신의 경험과 관련된 글을 쓰고, 독자와 공유한다."],["9국04-01","9","국어(청각장애)","문법","국어의 음운 체계와 문자 체계를 이해하고 국어생활에 활용한다."],["9국04-02","9","국어(청각장애)","문법","단어의 짜임을 분석하여 새말 형성의 원리를 이해한다."],["9국04-03","9","국어(청각장애)","문법","품사의 종류와 특성을 이해하고 국어 자료를 분석한다."],["9국04-04","9","국어(청각장애)","문법","문장의 짜임을 이해하고 표현 효과를 고려하여 문장을 구성한다."],["9국04-05","9","국어(청각장애)","문법","피동 표현과 인용 표현의 의도와 효과를 분석하고 상황에 맞게 활용한다."],["9국04-06","9","국어(청각장애)","문법","한글 맞춤법의 기본 원리와 내용을 이해하고 국어생활에 적용한다."],["9국04-07","9","국어(청각장애)","문법","세대⋅분야⋅매체에 따른 어휘의 양상과 쓰임을 분석하고 다양한 집단과 사회의 언어에 관용적 태도를 지닌다."],["9국04-08","9","국어(청각장애)","문법","자신과 주변의 다양한 국어 실천 양상을 비판적으로 분석하여 언어와 자아 및 세계 사이의 관계를 인식한다."],["9국04-09","9","국어(청각장애)","문법","수어의 문법 요소 표현을 이해하고, 상황에 따라 적절하게 활용한다."],["9국05-01","9","국어(청각장애)","문학","운율, 비유, 상징의 특성과 효과에 유의하며 작품을 감상하고 창작한다."],["9국05-02","9","국어(청각장애)","문학","갈등의 진행과 해결 과정을 파악하며 작품을 감상한다."],["9국05-03","9","국어(청각장애)","문학","인간의 성장을 다룬 작품을 읽으며 문학의 가치를 내면화한다."],["9국05-04","9","국어(청각장애)","문학","보는 이나 말하는 이의 특성과 효과를 파악하며 작품을 감상한다."],["9국05-05","9","국어(청각장애)","문학","작품에 반영된 사회⋅문화적 상황을 이해하며 작품을 감상한다."],["9국05-06","9","국어(청각장애)","문학","자신의 경험을 개성적인 발상과 표현으로 형상화한다."],["9국05-07","9","국어(청각장애)","문학","연관성이 있는 다른 작품들과의 관계를 파악하며 작품을 감상한다."],["9국05-08","9","국어(청각장애)","문학","근거를 바탕으로 작품을 해석하고, 다른 해석들과 비교하여 자신의 해석을 평가한다."],["9국05-09","9","국어(청각장애)","문학","문학을 통해 타자를 이해하고 공동체의 문제에 참여하는 태도를 지닌다."],["9국05-10","9","국어(청각장애)","문학","작품의 생각과 느낌을 말⋅글⋅수어 등의 적절한 의사소통 양식으로 비교 해석한다."],["9국06-01","9","국어(청각장애)","매체","대중매체와 개인 인터넷 방송의 특성과 영향력을 비교한다."],["9국06-02","9","국어(청각장애)","매체","소통 맥락과 수용자 참여 양상을 고려하여 상호 작용적 매체를 분석한다."],["9국06-03","9","국어(청각장애)","매체","복합양식성을 고려하여 수어나 자막을 사용한 영상 매체 자료를 제작하고 공유한다."],["9국06-04","9","국어(청각장애)","매체","매체 소통에서의 권리와 책임을 이해하고, 수용자의 반응을 고려하며 매체 자료의 제작과정을 성찰한다."],["9국06-05","9","국어(청각장애)","매체","매체 자료의 재현 방식을 이해하고 수어나 자막이 사용된 광고나 홍보물을 분석한다."],["9국06-06","9","국어(청각장애)","매체","사회⋅문화적 맥락을 고려하여 매체 자료의 공정성을 평가한다."],["4체01-01","4","체육(시각·지체장애)","운동","운동과 체력의 의미를 이해하고 관계를 파악한다."],["4체01-02","4","체육(시각·지체장애)","운동","기본 체력운동의 방법과 절차를 익히며 자신의 수준에 맞는 운동을 시도한다."],["4체01-03","4","체육(시각·지체장애)","운동","자신의 시각 정도와 특성에 적합한 운동을 탐색하여 안전하게 운동을 시도한다."],["4체01-04","4","체육(시각·지체장애)","운동","운동과 건강의 의미를 이해하고 관계를 파악한다."],["4체01-05","4","체육(시각·지체장애)","운동","건강을 위한 바른 생활 습관을 이해하고 생활 속에서 규칙적으로 실천한다."],["4체01-06","4","체육(시각·지체장애) 있다."],["4미03-04","4","미술(시각장애)","감상","작품 감상에 흥미를 가지고 참여하며 작품에 대한 자신의 감상 관점을 존중할 수 있다."],["6미01-01","6","미술(시각장애)","미적 체험","다양한 감각과 매체를 활용하여 자신과 대상을 탐색할 수 있다."],["6미01-02","6","미술(시각장애)","미적 체험","자신이나 대상에서 찾은 감각적 특징, 느낌, 생각 등을 관련지어 나타낼 수 있다."],["6미01-03","6","미술(시각장애)","미적 체험","주변 환경에 대한 민감한 태도로 대상과 상호 작용하며 새로운 의미를 발견할 수 있다."],["6미01-04","6","미술(시각장애)","미적 체험","이미지가 나타내는 의미를 비판적으로 이해하고 느낌과 생각을 전달하는 데 활용할 수 있다."],["6미02-01","6","미술(시각장애)","표현","다양한 방법으로 아이디어를 연결하여 확장된 표현 주제로 발전시킬 수 있다."],["6미02-02","6","미술(시각장애)","표현","디지털 매체 등 다양한 표현 재료와 용구를 탐색하여 작품 제작에 활용할 수 있다."],["6미02-03","6","미술(시각장애)","표현","조형 요소의 어울림을 통해 조형 원리를 이해하고 주제 표현에 연결할 수 있다."],["6미02-04","6","미술(시각장애)","표현","주제 표현에 의지를 갖고 표현 과정을 돌아보며 작품을 발전시킬 수 있다."],["6미02-05","6","미술(시각장애)","표현","미술과 타 교과의 내용과 방법을 융합하는 활동을 자유롭게 시도할 수 있다."],["6미03-01","6","미술(시각장애)","감상","미술 작품을 작품이 만들어진 시대적, 지역적 배경 등과 연결하여 이해할 수 있다."],["6미03-02","6","미술(시각장애)","감상","미술 작품의 내용(소재, 주제 등)과 형식(재료와 용구, 표현 방법, 조형 요소와 원리 등)을 분석하여 작품의 특징을 설명할 수 있다."],["6미03-03","6","미술(시각장애)","감상","공동체의 미술 문화 활동에 관심을 가지고 참여하며 경험을 공유할 수 있다."],["6미03-04","6","미술(시각장애)","감상","다양한 방법을 활용하여 작품을 감상하며 작품에 관한 서로 다른 관점을 존중할 수 있다."],["9미01-01","9","미술(시각장애)","미적 체험","감각을 활용하여 대상과 현상을 탐색하고 자신과 환경에 대한 감수성을 확장할 수 있다."],["9미01-02","9","미술(시각장애)","미적 체험","시각 문화의 의미와 역할을 알고 이미지를 비판적으로 해석할 수 있다."],["9미01-03","9","미술(시각장애)","미적 체험","다양한 문화를 존중하며 이미지를 활용하여 소통할 수 있다."],["9미01-04","9","미술(시각장애)","미적 체험","삶과 미술의 관계를 이해하고 다양한 분야와의 연결 방안을 모색할 수 있다."],["9미02-01","9","미술(시각장애)","표현","주제를 탐구하고 의도를 반영하여 적합한 표현을 계획할 수 있다."],["9미02-02","9","미술(시각장애)","표현","주도적이고 도전적인 태도로 다양한 미술 표현을 실험하고 작품에 적용할 수 있다."],["9미02-03","9","미술(시각장애)","표현","조형 요소와 원리, 표현 재료와 방법, 디지털 매체를 포함한 다양한 매체를 활용하여 주제를 효과적으로 표현할 수 있다."],["9미02-04","9","미술(시각장애)","표현","자신과 타인의 작품을 존중하며, 다양한 방법으로 공유하고 소통할 수 있다."],["9미02-05","9","미술(시각장애)","표현","미술 표현 과정에서의 경험을 성찰하고 삶의 문제 해결에 활용할 수 있다."],["9미03-01","9","미술(시각장애)","감상","미술의 시대적, 지역적, 사회적 맥락을 이해하고 설명할 수 있다."],["9미03-02","9","미술(시각장애)","감상","작품의 내용과 형식을 분석하고 미술 용어와 지식을 활용하여 설명할 수 있다."],["9미03-03","9","미술(시각장애)","감상","다양한 감상 방법과 관점을 활용하여 작품을 해석할 수 있다."],["9미03-04","9","미술(시각장애)","감상","미술의 다원성에 대한 존중을 바탕으로 미술 감상 경험을 삶과 연결하고 공동체 문화에 기여할 수 있다."],["6시자01-01","6","시각장애인 자립생활","보행","공간을 나타내는 용어를 알고, 공간에서 자신의 위치를 파악한다."],["6시자01-02","6","시각장애인 자립생활","보행","보행 환경에서 랜드마크와 단서를 설정하고 방향정위에 활용한다."],["6시자01-03","6","시각장애인 자립생활","보행","보행 장소와 상황에 적합한 안내 보행 방법을 선택하여 이동한다."],["6시자01-04","6","시각장애인 자립생활","보행","실내 환경에서 적절한 보행 기술을 사용하여 안전하게 이동한다."],["6시자01-05","6","시각장애인 자립생활","보행","적응 보행 기구의 기본 사용법을 알고, 친숙한 장소에서 사용하여 이동한다."],["6시자01-06","6","시각장애인 자립생활","보행","흰지팡이 기초 기술의 종류를 알고, 보행 장소에 맞는 기술을 선택하여 사용한다."],["6시자01-07","6","시각장애인 자립생활","보행","학교 통학버스와 자가용의 구조를 알고, 안전하게 승하차한다."],["6시자01-08","6","시각장애인 자립생활","보행","인도에서 직선 보행과 기준선 보행 기술을 사용하여 이동한다."],["6시자02-01","6","시각장애인 자립생활","일상생활","신체 청결 도구의 종류와 기능을 알고, 신체를 청결하게 관리한다."],["6시자02-02","6","시각장애인 자립생활","일상생활","이차 성징의 신체 변화를 알고, 생리와 몽정을 적절하게 처리한다."],["6시자02-03","6","시각장애인 자립생활","일상생활","의복의 종류와 형태를 구별하고, 옷을 바르게 입고 벗는다."],["6시자02-04","6","시각장애인 자립생활","일상생활","의복을 효율적으로 관리하는 방법을 알고, 의복을 옷장에 정리⋅정돈한다."],["6시자02-05","6","시각장애인 자립생활","일상생활","바른 식사 자세와 예절을 알고, 바른 식생활 습관을 실천한다."],["6시자02-06","6","시각장애인 자립생활","일상생활","식사 도구의 종류와 기능을 탐색하고, 음식 종류에 따라 바르게 사용한다."],["6시자02-07","6","시각장애인 자립생활","일상생활","방을 깨끗하게 청소하고, 개인용품을 정리⋅정돈한다."],["6시자02-08","6","시각장애인 자립생활","일상생활","용돈을 안전하게 관리하고 사용한다."],["6시자03-01","6","시각장애인 자립생활","대인 관계","자신의 신체상에 대한 태도를 분석하고, 긍정적인 신체상을 갖는다."],["6시자03-02","6","시각장애인 자립생활","대인 관계","자신의 강점과 바람직한 장애관을 바탕으로 자신을 긍정적으로 인식하고 표현한다."],["6시자03-03","6","시각장애인 자립생활","대인 관계","바른 자세와 적절한 인사 표현으로 상대방에게 긍정적인 인식을 준다."],["6시자03-04","6","시각장애인 자립생활","대인 관계","다양한 신체 접촉 방법을 알고, 상대에 따라 적절한 신체 접촉을 사용한다."],["6시자03-05","6","시각장애인 자립생활","대인 관계","상호 작용을 촉진하는 방법과 표현을 알고, 친구 간의 상호 작용에 사용한다."],["6시자03-06","6","시각장애인 자립생활","대인 관계","대인 간 거리가 주는 느낌과 감정을 알고, 상대에 따라 대인 간 거리를 조절한다."],["6시자04-01","6","시각장애인 자립생활","감각 활용","생활 주변의 시각 정보를 변별하고, 학습과 생활에 잔존 시각을 활용한다."],["6시자04-02","6","시각장애인 자립생활","감각 활용","저시력 기구의 종류와 기능을 탐색하고, 학습과 생활에 기구를 사용한다."],["6시자 ","2","수어","교과 수어","사계절을 수어로 표현하고 식물과 동물의 성장을 일상 대화에서 수어로 설명한다."],["2수어03-01","2","수어","수어 문법","수어소(수형, 수위, 수동, 수향, 비수지)가 달라짐에 따라 다른 의미가 있다는 것을 이해한다."],["2수어03-02","2","수어","수어 문법","긍정과 부정을 나타내는 비수지 표현의 차이를 인식하고 다양한 사람의 비수지 표현에 관심을 가진다."],["2수어03-03","2","수어","수어 문법","단어의 개념을 알고 문장 구성 방법을 이해하며 대화 상황에 따라 의미 변화가 있다는 것에 관심을 가진다."],["2수어03-04","2","수어","수어 문법","단문과 복문을 구성하며 의사소통하는 즐거움을 느낀다."],["2수어03-05","2","수어","수어 문법","대화 속에서 화행적 특성을 발견하고 상황에 맞는 수지와 비수지 표현을 한다."],["4수어01-01","4","수어","수어 이해⋅표현","수어 단어에서 수어소의 정확한 표현을 익혀 하루 일과를 수어로 표현하고 능동적으로 대화에 참여한다."],["4수어01-02","4","수어","수어 이해⋅표현","수어 단어 수준에서 수지(수형, 수위, 수동, 수향)에 따른 수어 의미의 변화를 활용하여 수어로 사건의 순서와 비교를 표현한다."],["4수어01-03","4","수어","수어 이해⋅표현","감정 변화에 따른 단어 수준의 비수지 변화를 이해하고 대화에서 이를 활용하여 표현한다."],["4수어01-04","4","수어","수어 이해⋅표현","친숙한 주제로 시사 표현 방법을 익혀 자신의 취향과 생각을 수어 단문으로 표현함으로써 의사소통의 가치를 안다."],["4수어01-05","4","수어","수어 이해⋅표현","사람이나 사물의 움직임을 나타내는 수어 단문을 이해하여 자신의 생각을 수어로 표현함으로써 능동적으로 대화에 참여한다."],["4수어02-01","4","수어","교과 수어","교통수단을 안전하게 이용하는 방법을 일상생활 맥락에서 이해하고 수어로 설명한다."],["4수어02-02","4","수어","교과 수어","생존 수영법을 일상 대화에서 적절하게 이해하고 수어로 설명한다."],["4수어02-03","4","수어","교과 수어","다양한 매체를 활용하여 음악의 요소를 수어로 표현하고 설명한다."],["4수어02-04","4","수어","교과 수어","다양한 매체를 활용하여 우리나라의 지리와 지형적 환경을 이해하고 표현하며 일상 대화에서 수어로 효율적으로 설명한다."],["4수어02-05","4","수어","교과 수어","수의 체계와 사칙연산 습득의 필요성을 이해하고 수어로 자유롭게 표현한다."],["4수어02-06","4","수어","교과 수어","일상생활의 맥락에서 활용되는 여러 가지 도형과 시간, 길이, 들이, 무게, 각도의 기본단위 개념을 수어로 효율적으로 표현한다."],["4수어02-07","4","수어","교과 수어","일상 대화에서 의미를 전달하고자 물질의 상태에 대해 다양한 매체를 활용하여 익히고 수어로 표현한다."],["4수어03-01","4","수어","수어 문법","수어 단어 표현에서 수어소(수형, 수위, 수동, 수향, 비수지)가 같은 표현을 찾아 분류한다."],["4수어03-02","4","수어","수어 문법","수어 문장 속에서 굴절 표현과 복수 표현에 따른 의미 변화를 이해하며 의사소통 상황에 맞게 적용한다."],["4수어03-03","4","수어","수어 문법","수어 높임법을 나타내는 수지와 비수지 표현을 알고 수어 공동체 속에서 상황에 맞게 표현한다."],["4수어03-04","4","수어","수어 문법","수어 어휘를 기준에 따라 상의어/하의어, 유의어/반의어, 다의어로 분류해 보고 의미 관계를 탐색한다."],["4수어03-05","4","수어","수어 문법","수어 문장의 기본 구조를 알고 활용된 단어는 문맥과 상황에 따라 의미 변화가 있음을 이해한다."],["6수어01-01","6","수어","수어 이해⋅표현","수어 문장의 정확한 표현과 쓰임을 익혀 수어로 제시되는 중문의 내용을 이해하고 핵심 내용을 구체적으로 표현한다."],["6수어01-02","6","수어","수어 이해⋅표현","수어 문장에서 문법적 요소를 이해하고 공간을 분리하여 두 가지 특징적 사물을 비교 설명한다."],["6수어01-03","6","수어","수어 이해⋅표현","수어 문장의 정확한 표현과 쓰임을 익혀 시사 뉴스의 핵심 내용과 문장 수준의 비수지를 활용하여 자신의 의견을 표현한다."],["6수어01-04","6","수어","수어 이해⋅표현","다수의 인물이나 사물이 표현되는 수어를 보고 특징을 분석하고 상대방 이야기에 공감을 나타내며 다양성을 존중하는 능력을 기른다."],["6수어01-05","6","수어","수어 이해⋅표현","수어로 이야기의 핵심 내용을 구체적으로 표현하고 수어 표현과 다양한 양식의 의사소통 방법과의 차이점을 파악한다."],["6수어02-01","6","수어","교과 수어","기사를 활용하여 아동 학대와 성폭력의 유형을 알고 예방법을 수어로 표현한다."],["6수어02-02","6","수어","교과 수어","일상생활에서 자주 사용하는 통신기기와 컴퓨터 통신망의 건전한 사용 방법을 수어로 토론한다."],["6수어02-03","6","수어","교과 수어","수어의 심미적 표현력을 높이기 위해 다양한 문화권의 예술 활동을 비교하고 수어로 설명한다."],["6수어02-04","6","수어","교과 수어","일상생활에서 접할 수 있는 다양한 장르의 음악을 감상하고 수어로 자유롭게 표현한다."],["6수어02-05","6","수어","교과 수어","민주적 의사 결정 과정을 일상 대화의 의미 전달 개념으로 표현하고 수어로 자유롭게 토론한다."],["6수어02-06","6","수어","교과 수어","일상생활의 맥락에서 활용되는 수와 연산, 여러 가지 입체 도형을 수어로 표현하고 그래프가 의미하는 내용을 수어로 설명한다."],["6수어02-07","6","수어","교과 수어","수어 응용 능력을 향상시키기 위해 일상생활 맥락에서 활용되는 열과 에너지를 수어로 설명한다."],["6수어03-01","6","수어","수어 문법","다양한 수어 표현 속에서 수어소(수형, 수위, 수동, 수향, 비수지)가 다른 수어 표현을 찾아내며 수어를 정확하게 익힌다."],["6수어03-02","6","수어","수어 문법","수어의 품사를 표현하는 방법을 알고 여러 가지 담화 상황에서 알맞은 수어를 표현한다."],["6수어03-03","6","수어","수어 문법","서술문, 의문문, 명령문, 청유문 등 의향을 나타내는 수어 표현법을 알고 다양한 의사소통 상황에서 수어로 표현한다."],["6수어03-04","6","수어","수어 문법","문장 성분과 호응에 맞는 접속 표현을 익히고 의사소통 시 활용한다."],["6수어03-05","6","수어","수어 문법","직접 화행 표현의 예를 알아보고 일상생활에서 적절한 문장 종류를 선택한다."],["9수어01-01","9","수어","수어 이해⋅표현","수어 표현의 원리와 내용을 이해하여 친숙한 주제로 시사 뉴스의 핵심을 파악하고 줄거리를 구체적으로 표현한다."],["9수어01-02","9","수어","수어 이해⋅표현","수어 문법적 요소의 정확한 표현을 익혀 공간과 등장인물을 표현한 수어를 이해하고 세 가지 대상을 비교하는 방법을 활용하여 수어로 표현한다."],["9수어01-03","9","수어","수어 이해⋅표현","이야기 중 핵심이 되는 내용을 파악하여 구체적으로 표현하고 이해한 내용을 타인과 공유하여 수어로 구성되는 세계와 자아를 인식한다."],["9수어01-04","9","수어","수어 이해⋅표현","수어 표현의 원리와 내용을 이해하여 수어사전에 등록되지 않은 다양한 사물의 일반적 특징을 표현한 수어를 이해한다."],["9수어01-05","9","수어","수어 이해⋅표현","단어와 문장 수준의 비수지 표현을 익혀 수어로 제시되는 복문 내용의 줄거리를 표현하며 자신의 수어 화법을 성찰한다."],["9수어02-01","9","수어","교과 수어","학교 폭력과 성폭력의 유형을 사회 문화적 맥락으로 이해하고 유형별 신고와 대처 방법을 수어로 정확하게 설명한다."],["9수어02-02","9","수어","교과 수어","약물⋅사이버 중독 예방법을 다양한 매체 자료를 활용하여 수어로 자유롭게 설명한다."],["9수어02-03","9","수어","교과 수어","문학 작품을 수어 연극으로 각색하고 공연하여 적극적이고 주체적인 의사소통 태도를 기른다."],["9수어02-04","9","수어","교과 수어","정치⋅외교⋅국가관에 대해 수어를 사용하여 주체적인 의사소통 방법으로 발표하고 적극적으로 토론한다."],["9수어02-05","9","수어","교과 수어","일상생활에서 활용 가능한 문자와 식, 함수와 그래프, 기하를 설명하고 확률과 통계의 해석을 수어로 이해하고 설명한다."],["9수어02-06","9","수어","교과 수어","일상생활에서 활용되는 힘과 운동을 수어로 자유롭게 설명하여 수어에 대한 자기주도성을 확신한다."],["9수어02-07","9","수어","교과 수어","우리 몸의 조절 능력을 이해하고 수어로 자유롭게 설명한다."],["9수어03-01","9","수어","수어 문법","수어 어휘와 문장을 표현할 때, 순차적으로 [정지-움직임-정지] 순서로 이루어지는 것과 양손을 동시에 [정지-움직임-정지] 순서로 이루어지는 동시성이 있음을 이해한다."],["9수어03-02","9","수어","수어 문법","수어는 순차적 합성어와 동시적 합성어로 이루어지며, 지역적 특성에 따라 지역 수어가 생성됨을 알고 존중하는 태도를 기른다."],["9수어03-03","9","수어","수어 문법","수어 담화 속에서 현재, 과거, 미래를 표현하는 수어를 활용하여 나타내 보고 경험한 일과 앞으로 일어날 수 있는 일을 표현한다."],["9수어03-04","9","수어","수어 문법","여러 가지 문장 구조(평서문, 의문문, 청유문, 명령문, 감탄문)를 이해하고 주동 표현, 피동⋅인용 표현을 활용하여 자신의 의견을 발표한다."],["9수어03-05","9","수어","수어 문법","토론 활동에서 나타나는 간접 화행을 이해하고 화자와 청자의 언어적 표현을 수용하는 태도를 기른다."],["10공국1-01-01","10","공통국어(청각장애)","듣기⋅말하기","대화의 원리를 고려하여 대화하고 자신의 듣기⋅말하기 과정과 공동체의 담화 관습을 성찰한다."],["10공국1-01-02","10","공통국어(청각장애)","듣기⋅말하기","논제의 필수 쟁점별로 논증을 구성하고 논증이 타당한지 평가하며 토론한다."],["10공국1-01-03","10","공통국어(청각장애)","듣기⋅말하기","말⋅수어 등의 표현 전략을 효과적으로 사용하여 대화의 원리에 맞게 듣고 말한다."],["10공국1-02-01","10","공통국어(청각장애)","읽기","다양한 글이나 자료를 읽으며 논증의 타당성을 평가하고 자신의 관점을 바탕으로 논증을 재구성한다."],["10공국1-02-02","10","공통국어(청각장애)","읽기","자신의 진로나 관심 분야와 관련한 다양한 글이나 자료를 찾아 주제 통합적으로 읽고 읽은 결과를 공유한다."],["10공국1-02-03","10","공통국어(청각장애)","읽기","다양한 시각적 영상 자료와 수어 담화 등을 보고 내용을 이해하고 추론하며 읽는다."],["10공국1-03-01","10","공통국어(청각장애)","쓰기","내용 전개의 일반적 원리를 고려하여 사회적 쟁점에 대한 자신의 견해를 정교하게 표현하는 글을 쓴다."],["10공국1-03-02","10","공통국어(청각장애)","쓰기","다양한 언어 공동체의 특성을 고려하며 필자의 개성이 드러나는 글을 쓴다."],["10공국1-03-03","10","공통국어(청각장애)","쓰기","자신의 생각, 느낌, 감정 등의 표현을 어법과 문법에 맞게 글로 쓴다."],["10공국1-04-01","10","공통국어(청각장애)","문법","언어 공동체가 다변화함에 따라 다양해진 언어 실천 양상을 분석하고 언어 주체로서 책임감을 가지며 국어생활을 한다."],["10공국1-04-02","10","공통국어(청각장애)","문법","음운 변동을 탐구하여 발음과 표기에 올바르게 적용한다."],["10공국1-04-03","10","공통국어(청각장애)","문법","다양한 분야의 글과 담화에 나타난 문법 요소 및 어휘의 표현 효과를 평가하고 적절한 표현을 생성한다."],["10공국1-04-04","10","공통국어(청각장애)","문법","수어의 언어적 특성을 이해하고, 수어의 언어 규칙을 탐구한다."],["10공국1-05-01","10","공통국어(청각장애)","문학","문학 소통의 특성을 고려하며 문학 소통에 참여한다."],["10공국1-05-02","10","공통국어(청각장애)","문학","갈래에 따른 형상화 방법의 특성을 고려하며 작품을 수용한다."],["10공국1-05-03","10","공통국어(청각장애)","문학","작품 구성 요소의 유기적 관계와 맥락에 유의하여 작품을 수용하고 생산한다."],["10공국1-05-04","10","공통국어(청각장애)","문학","작품에 대한 비평을 말⋅글⋅수어 등의 적절한 의사소통 양식으로 표현한다."],["10공국1-06-01","10","공통국어(청각장애)","매체","사회적 의제를 다룬 매체 자료를 비판적으로 분석한다."],["10공국1-06-02","10","공통국어(청각장애)","매체","소통 맥락과 매체 특성을 고려하여 다양한 목적의 매체 자료를 제작한다."],["10공국1-06-03","10","공통국어(청각장애)","매체","다양한 청각장애 지원 매체를 살펴보고, 편의성을 높일 수 있는 매체를 제작한다."],["10공국2-01-01","10","공통국어(청각장애)","듣기⋅말하기","청중의 관심과 요구에 맞게 내용을 구성하여 발표하고 청중의 질문에 효과적으로 답변한다."],["10공국2-01-02","10","공통국어(청각장애)","듣기⋅말하기","쟁점과 이해관계를 고려하여 문제를 해결할 수 있는 대안을 탐색하며 협상한다."],["10공국2-01-03","10","공통국어(청각장애)","듣기⋅말하기","사회적 소통 과정에서 말의 영향력을 고려하여 책임감 있게 듣고 말한다."],["10공국2-01-04","10","공통국어(청각장애)","듣기⋅말하기","말⋅수어 등의 표현전략을 사용하여 상대방과 소통하고, 담화의 의미를 공유한다."],["10공국2-02-01","10","공통국어(청각장애)","읽기","복합양식으로 구성된 글이나 자료에 내재된 필자의 관점이나 의도, 표현 방법을 평가하며 읽는다."],["10공국2-02-02","10","공통국어(청각장애)","읽기","동일한 화제의 글이나 자료라도 서로 다른 관점과 형식으로 표현됨을 이해하며 읽기 목적을 고려하여 글이나 자료를 주제 통합적으로 읽는다."],["10공국2-02-03","10","공통국어(청각장애)","읽기","의미 있는 사회적 독서 활동에 참여함으로써 타인과 교류하고 다양한 지식이나 정보, 삶에 대한 가치관 등을 이해하는 태도를 지닌다."],["10공국2-02-04","10","공통국어(청각장애)","읽기","다양한 시각적 영상자료와 수어 영상 도서 등을 읽고 내용을 이해하고 감상하면서 읽기의 즐거움을 느낀다."],["10공국2-03-01","10","공통국어(청각장애)","쓰기","언어 공동체가 공유하는 작문 관습의 특성을 이해하고 쓰기 과정과 전략을 점검하며 책임감 있게 글을 쓴다."],["10공국2-03-02","10","공통국어(청각장애)","쓰기","논증 요소에 따른 분석을 바탕으로 효과적으로 내용을 조직하여 논증하는 글을 쓴다."],["10공국2-03-03","10","공통국어(청각장애)","쓰기","신뢰할 수 있는 정보를 종합하여 복합양식 자료가 포함된 공동 보고서를 쓴다."],["10공국2-03-04","10","공통국어(청각장애)","쓰기","타당한 근거와 객관적인 자료를 제시하여 자신의 의견과 주장을 설득력 있게 표현하는 글을 쓴다."],["10공국2-04-01","10","공통국어(청각장애)","문법","과거 및 현재의 국어생활에 나타나는 국어의 변화를 이해하고 국어문화 발전에 참여한다."],["10공국2-04-02","10","공통국어(청각장애)","문법","한글 맞춤법의 원리를 적용하여 국어생활을 성찰하고 문제를 해결한다."],["10공국2-04-03","10","공통국어(청각장애)","문법","다양한 수어 표현을 탐구하여 비교하고, 자신의 언어생활을 성찰한다."],["10공국2-05-01","10","공통국어(청각장애)","문학","한국 문학사의 흐름을 고려하여 작품을 수용한다."],["10공국2-05-02","10","공통국어(청각장애)","문학","주체적인 관점에서 작품을 해석하고 평가하며 문학을 생활화하는 태도를 지닌다."],["10공국2-05-03","10","공통국어(청각장애)","문학","작가 관점에서 글⋅수어 작품을 맥락에 유의하여 창작한다."],["10공국2-06-01","10","공통국어(청각장애)","매체","매체 비평 자료를 비판적으로 수용하고 자신의 관점을 담아 매체 비평 자료를 제작한다."],["10공국2-06-02","10","공통국어(청각장애)","매체","매체의 변화가 소통 문화에 끼치는 영향을 탐구한다."],["10공국2-06-03","10","공통국어(청각장애)","매체","청각장애 관련 다양한 매체 비평 자료를 비판적으로 수용하고, 관점을 담은 비평 텍스트를 생산한다."],["12사적01-01","12","사회적응","생활 적응","깨끗한 용모와 단정한 옷차림을 계획하고 스스로 관리한다."],["12사적01-02","12","사회적응","생활 적응","가정생활에 필요한 기술을 익혀 가정을 관리하는 능력을 기른다."],["12사적01-03","12","사회적응","생활 적응","가정생활에서 일어날 수 있는 위기 상황을 알고 대처한다."],["12사적01-04","12","사회적응","생활 적응","응급 상황에 대처하고 규칙적인 운동과 체중 관리로 건강을 유지한다."],["12사적01-05","12","사회적응","생활 적응","지역사회의 다양한 자원을 활용하여 여가생활을 즐긴다."],["12사적01-06","12","사회적응","생활 적응","능동적으로 자기 삶을 관리하고 주도적인 생활을 영위한다."],["12사적02-01","12","사회적응","직업 적응","일의 개인적⋅사회적 가치를 인식하고 일하고자 하는 의지를 갖는다."],["12사적02-02","12","사회적응","직업 적응","자신의 능력과 강점을 알고, 직업적 흥미, 적성, 기술 등을 파악하여 진로를 개발한다."],["12사적02-03","12","사회적응","직업 적응","다양한 직군에서 필요한 지식과 정보, 직무 능력을 바탕으로 직업을 이해한다."],["12사적02-04","12","사회적응","직업 적응","과제를 정확하고 신속하게 수행한다."],["12사적02-05","12","사회적응","직업 적응","직장생활 유지에 필요한 규칙과 예절, 공감과 존중 등의 태도를 익힌다."],["12사적02-06","12","사회적응","직업 적응","작업장 내 안전 수칙을 준수하여 안전사고를 예방한다."],["12사적03-01","12","사회적응","생애 학습 적응","지속적인 배움의 필요성을 알고 배움의 기술을 익힌다."],["12사적03-02","12","사회적응","생애 학습 적응","일상생활에서 요구되는 기능적 학업 기술을 익힌다."],["12사적03-03","12","사회적응","생애 학습 적응","평생교육 기관의 정보를 수집하여 제공하는 서비스를 이용한다."],["12사적03-04","12","사회적응","생애 학습 적응","대학 교육 기관의 정보를 수집하여 제공하는 서비스를 이용한다."],["12사적03-05","12","사회적응","생애 학습 적응","지속적인 배움을 생활과 직업에서의 적응으로 연계한다."],["12사적04-01","12","사회적응","사회적 관계 적응","타인의 생각과 감정을 이해한다."],["12사적04-02","12","사회적응","사회적 관계 적응","상황, 장소, 대상에 따른 자신의 생각과 감정을
